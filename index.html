const LOGO_RE = [['wise',/wise/i],['ing',/\bing\b/i],['n26',/n26/i],['buddy',/buddy/i],['bbva',/bbva/i],['cro',/crypto/i],['ibkr',/interactive|ibkr|ibks|\bib\b|brokers/i],['bondora',/bondora/i],['crowdcube',/crowdcube/i]];
function contoIcon(c){
  const m = LOGO_RE.find(([k,re])=>re.test(c.n));
  return m ? `<img class="logo" src="${LOGHI[m[0]]}" alt="">` : `<i class="logo l">${esc((c.n||'?')[0].toUpperCase())}</i>`;
}
const GRP = [['Banche','var(--acc)'],['Cash','var(--warn)'],['Investimenti','var(--blue)']];
function renderPat(){
  const patr = sum(S.conti.map(c=>c.v)), base = patr>0 ? patr : 1;
  const tot = g => sum(S.conti.filter(c=>c.g===g).map(c=>c.v));
  const pct = v => v>0 && patr>0 ? (v/base<0.005 ? '<1%' : Math.round(v/base*100)+'%') : '–';
  // riepilogo: totale + barra della composizione (Banche / Cash / Investimenti)
  let html = `<div class="card hero pat-hero">
    <div class="kpi"><small>Patrimonio totale</small><b class="mono">${eur(patr,0)}</b>
      <div class="note" style="color:var(--hero-ink);margin-top:4px">Liquidità ${eur(tot('Banche')+tot('Cash'),0)}</div></div>
    <div><div class="pat-bar">${GRP.map(([g,col])=>tot(g)>0?`<div style="flex:${tot(g)};background:${col}"></div>`:'').join('')}</div>
      <div class="pat-leg">${GRP.map(([g,col])=>`<div><i style="background:${col}"></i><span>${g}</span><b class="mono">${eur(tot(g),0)}</b><em class="mono">${pct(tot(g))}</em></div>`).join('')}</div></div>
  </div><div class="pgs">`;
  GRP.forEach(([g,col])=>{
    const items = S.conti.filter(c=>c.g===g);
    html += `<div class="pg-${g.toLowerCase()}"><div class="gh"><b><i class="dot" style="background:${col}"></i>${g}</b><span class="mono">${eur(tot(g),0)}</span></div><div class="card" style="padding:4px 14px">
      ${items.map(c=>`<div class="acct" onclick="openConto('${c.id}')"><span class="acct-n">${contoIcon(c)}<span>${esc(c.n)}<small>${pct(c.v)} del patrimonio</small></span></span><b class="mono ${c.v?'':'mut'}">${eur(c.v,0)}</b></div>`).join('') || '<div class="empty">—</div>'}</div></div>`;
  });
  html += `</div><button class="btn ghost pat-add" onclick="openConto()">+ Aggiungi conto</button>`;
  html += storicoHTML();
  $('v-pat').innerHTML = html;
  drawPatrChart();
}
/* ---- Andamento del patrimonio ---- */
const fmtM = m => `${M3[+m.slice(5)-1]} ${m.slice(0,4)}`;
const delta = (a,b) => b ? {v:round2(a.tot-b.tot), p:b.tot ? (a.tot-b.tot)/Math.abs(b.tot)*100 : null} : null;
const dTxt = x => !x ? '–' : `${x.v>=0?'▲ +':'▼ −'}${eur(Math.abs(x.v),0)}${x.p!=null?` (${x.v>=0?'+':'−'}${Math.abs(x.p).toFixed(1).replace('.',',')}%)`:''}`;
function storicoSerie(){
  const st = S.storico||[]; if(!st.length) return [];
  const n = {12:12, 24:24, all:9999}[ui.patR||12];
  return st.slice(-n);
}
function storicoHTML(){
  const st = S.storico||[], serie = storicoSerie(), last = st.at(-1), prev = st.at(-2);
  const gen = last && st.filter(f=>f.m.slice(0,4)===last.m.slice(0,4))[0];
  const dGen = gen && gen!==last ? delta(last, st[st.indexOf(gen)-1] || gen) : null;
  const tag = {fine:'fine mese', tardi:'riportata a fine mese', ora:'salvata a mano', inserito:'inserita a mano'};
  const righe = st.slice().reverse().map((f,i,a)=>{ const d = delta(f, a[i+1]);
    return `<div class="tx" onclick="openFoto('${f.m}')"><div class="mid"><b>${MESI[+f.m.slice(5)-1]} ${f.m.slice(0,4)}</b><small>${tag[f.tipo]||''}${f.tipo!=='inserito'?' · '+fmtD(f.d):''}</small></div>
      <div style="text-align:right"><b class="mono">${eur(f.tot,0)}</b><small class="mono ${!d?'mut':d.v>=0?'pos':'neg'}" style="display:block;font-size:11px">${dTxt(d)}</small></div></div>`; }).join('');
  return `<h2 class="sec">Andamento del patrimonio</h2>
    <div class="card">
      <div class="row" style="align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div class="pat-delta"><div><small>Ultimo mese</small><b class="mono ${!prev?'mut':delta(last,prev).v>=0?'pos':'neg'}">${dTxt(last&&delta(last,prev))}</b></div>
          <div><small>Da inizio ${last?last.m.slice(0,4):'anno'}</small><b class="mono ${!dGen?'mut':dGen.v>=0?'pos':'neg'}">${dTxt(dGen)}</b></div></div>
        <div class="chips" style="margin:0">${[[12,'12 mesi'],[24,'2 anni'],['all','Tutto']].map(([v,l])=>`<button class="chip ${String(ui.patR||12)===String(v)?'on':''}" onclick="ui.patR='${v}';render()">${l}</button>`).join('')}</div>
      </div>
      <div id="pchart" class="pchart">${serie.length ? '' : '<div class="empty">Ancora nessun mese salvato: la prima foto del patrimonio viene scattata il '+fmtD(lastDay(thisMonth()))+'.</div>'}</div>
    </div>
    <div class="gh"><b>Storico mensile</b><span><button class="btn sm ghost" onclick="salvaOra()">Salva ${MESI[now.getMonth()].toLowerCase()}</button> <button class="btn sm ghost" onclick="openFoto()">+ Mese passato</button></span></div>
    ${righe || '<div class="empty">Nessun mese salvato</div>'}
    <p class="note" style="margin-top:10px">L'ultimo giorno di ogni mese il patrimonio viene salvato in automatico. Se quel giorno non apri l'app, viene salvato alla prima apertura dopo, riportando i saldi a fine mese (tolti i movimenti registrati nel frattempo).</p>`;
}
// grafico a linea del totale: asse Y non da zero (le variazioni mensili sono piccole rispetto al totale)
function drawPatrChart(){
  const box = $('pchart'), serie = storicoSerie();
  if(!box || !serie.length) return;
  const W = Math.max(280, box.clientWidth), H = WIDE.matches ? 240 : 190, L = 46, Rr = 14, T = 14, B = 26;
  const vals = serie.map(f=>f.tot);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi-lo < Math.max(1, Math.abs(hi))*0.02){ const pad = Math.max(100, Math.abs(hi)*0.02); lo -= pad; hi += pad; }
  const step = (()=>{ const raw = (hi-lo)/4, e = 10**Math.floor(Math.log10(raw)), f = raw/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; })();
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const x = i => serie.length===1 ? L+(W-L-Rr)/2 : L + i*(W-L-Rr)/(serie.length-1);
  const y = v => T + (hi-v)/(hi-lo||1)*(H-T-B);
  const k = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'K' : String(Math.round(v));
  let g = '';
  for(let v=lo; v<=hi+1e-6; v+=step) g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${k(v)} €</text>`;
  const every = Math.ceil(serie.length / Math.floor((W-L-Rr)/44));
  serie.forEach((f,i)=>{ if(i%every===0 || i===serie.length-1) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ax">${M3[+f.m.slice(5)-1]}${f.m.slice(5)==='01'||i===0?' '+f.m.slice(2,4):''}</text>`; });
  const path = serie.map((f,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(f.tot).toFixed(1)}`).join('');
  const lastI = serie.length-1;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Andamento del patrimonio, ultimo valore ${eur(vals[lastI],0)}">
    ${g}<path d="${path}" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(lastI)}" cy="${y(vals[lastI])}" r="4.5" style="fill:var(--acc);stroke:var(--panel)" stroke-width="2"/>
    <line id="pc-x" y1="${T}" y2="${H-B}" stroke-width="1" style="display:none;stroke:var(--ink3)"/>
    <circle id="pc-d" r="5" stroke-width="2" style="display:none;fill:var(--acc);stroke:var(--panel)"/>
    <rect x="${L}" y="0" width="${W-L-Rr}" height="${H}" fill="transparent" id="pc-hit"/></svg>
    <div class="ptip" id="pc-tip"></div>`;
  const svg = box.querySelector('svg'), tip = $('pc-tip');
  const show = i => {
    const f = serie[i], d = delta(f, (S.storico||[])[S.storico.indexOf(f)-1]);
    $('pc-x').setAttribute('x1', x(i)); $('pc-x').setAttribute('x2', x(i)); $('pc-x').style.display='';
    $('pc-d').setAttribute('cx', x(i)); $('pc-d').setAttribute('cy', y(f.tot)); $('pc-d').style.display='';
    tip.replaceChildren();
    const line = (t, cls) => { const e = document.createElement('div'); e.textContent = t; if(cls) e.className = cls; tip.appendChild(e); };
    line(eur(f.tot,0), 'v'); line(`${MESI[+f.m.slice(5)-1]} ${f.m.slice(0,4)}`, 'm');
    GRUPPI.forEach(k=>line(`${k} ${eur(f.g[k]||0,0)}`));
    if(d) line(dTxt(d), d.v>=0?'pos':'neg');
    tip.style.display = 'block';
    const tx = Math.min(Math.max(x(i) - tip.offsetWidth/2, 0), W - tip.offsetWidth);
    tip.style.left = tx+'px'; tip.style.top = Math.max(0, y(f.tot) - tip.offsetHeight - 12)+'px';
  };
  const hide = () => { tip.style.display='none'; $('pc-x').style.display='none'; $('pc-d').style.display='none'; };
  const near = e => { const r = svg.getBoundingClientRect(), px = e.clientX - r.left; let b=0; serie.forEach((f,i)=>{ if(Math.abs(x(i)-px) < Math.abs(x(b)-px)) b=i; }); return b; };
  let cur = lastI;
  svg.addEventListener('pointermove', e=>show(cur=near(e)));
  svg.addEventListener('pointerdown', e=>show(cur=near(e)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ cur = Math.min(lastI, Math.max(0, cur + (e.key==='ArrowLeft'?-1:1))); show(cur); e.preventDefault(); } });
  svg.addEventListener('focus', ()=>show(cur)); svg.addEventListener('blur', hide);
}
let patResize; window.addEventListener('resize', ()=>{ if(ui.tab!=='pat') return; clearTimeout(patResize); patResize=setTimeout(drawPatrChart, 150); });
function salvaOra(){
  const m = thisMonth(), old = (S.storico||[]).find(f=>f.m===m);
  if(old && old.tipo==='inserito' && !confirm('Questo mese era inserito a mano: sostituirlo con i saldi di oggi?')) return;
  putFoto(fotoPatr(m, today(), 'ora', S.conti.map(c=>({n:c.n, g:c.g, v:c.v}))));
  save(); render(); toast(`Patrimonio di ${MESI[now.getMonth()].toLowerCase()} salvato (verrà aggiornato l'ultimo giorno del mese)`);
}
// dettaglio di un mese, oppure inserimento di un mese passato (m vuoto)
function openFoto(m){
  const f = m && S.storico.find(x=>x.m===m);
  const val = k => f ? String(f.g[k]||0).replace('.',',') : '';
  sheet(`<h3>${f ? `Patrimonio · ${MESI[+f.m.slice(5)-1]} ${f.m.slice(0,4)}` : 'Aggiungi un mese passato'}</h3>
    ${f && f.conti && f.conti.length && f.tipo!=='inserito' ? `<div class="card" style="padding:4px 14px;margin-bottom:12px">${f.conti.map(c=>`<div class="acct" style="cursor:default"><span class="acct-n">${contoIcon(c)}<span>${esc(c.n)}<small>${c.g}</small></span></span><b class="mono">${eur(c.v,0)}</b></div>`).join('')}</div>
      <p class="note" style="margin:-4px 0 12px">Salvato il ${fmtD(f.d)}. Puoi correggere i totali qui sotto: il mese diventa "inserito a mano" e non verrà più aggiornato in automatico.</p>` : ''}
    ${f ? '' : `<div class="f"><label>Mese</label><input type="month" id="sf-m" value="${addYM(thisMonth(),-1)}" max="${thisMonth()}"></div>`}
    <div class="grid2">${GRUPPI.map((k,i)=>`<div class="f" ${i===2?'style="grid-column:1/-1"':''}><label>${k} (€)</label><input id="sf-${i}" inputmode="decimal" value="${val(k)}" placeholder="0 €"></div>`).join('')}</div>
    <button class="btn" onclick="saveFoto('${f?f.m:''}')">Salva</button>
    ${f?`<button class="btn danger" style="margin-top:8px" onclick="if(confirm('Eliminare questo mese dallo storico?')){S.storico=S.storico.filter(x=>x.m!=='${f.m}');save();closeSheet();render();}">Elimina mese</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
function saveFoto(m){
  const mese = m || ($('sf-m') && $('sf-m').value);
  if(!/^\d{4}-\d{2}$/.test(mese||'')) return toast('Scegli il mese');
  const old = S.storico.find(x=>x.m===mese);
  const vals = GRUPPI.map((k,i)=>num($('sf-'+i).value));
  if(old && !m && !confirm(`${fmtM(mese)} è già nello storico: sostituirlo?`)) return;
  if(old && m && GRUPPI.every((k,i)=>round2(old.g[k]||0)===round2(vals[i]))){ closeSheet(); return; }
  putFoto(fotoPatr(mese, today(), 'inserito', GRUPPI.map((k,i)=>({n:k, g:k, v:vals[i]}))));
  save(); closeSheet(); render(); toast('Mese salvato');
}
function openConto(id){
  const c = id ? S.conti.find(x=>x.id===id) : {g:'Banche',n:'',v:0};
  sheet(`<h3>${id?'Modifica conto':'Nuovo conto'}</h3>
    <div class="f"><label>Gruppo</label><select id="c-g">${['Banche','Cash','Investimenti'].map(g=>`<option ${c.g===g?'selected':''}>${g}</option>`).join('')}</select></div>
    <div class="f"><label>Nome</label><input id="c-n" value="${esc(c.n)}" placeholder="es. ING"></div>
    <div class="f"><label>Saldo (€)</label><input id="c-v" inputmode="decimal" class="amt" value="${c.v||''}" placeholder="0 €"></div>
    <button class="btn" onclick="saveConto('${id||''}')">Salva</button>
    ${id?`<button class="btn danger" style="margin-top:8px" onclick="delConto('${id}')">Elimina</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
const num = s => parseFloat(String(s).replace(',','.')) || 0;
function saveConto(id){
  const o = {g:$('c-g').value, n:$('c-n').value.trim(), v:num($('c-v').value)};
  if(!o.n) return toast('Inserisci un nome');
  if(id) Object.assign(S.conti.find(x=>x.id===id),o); else S.conti.push({id:uid(),...o});
  save(); closeSheet(); render(); toast('Salvato');
}
function delConto(id){ S.conti=S.conti.filter(x=>x.id!==id); save(); closeSheet(); render(); }

/* ---- Altro: Rate / Investimenti / Trading ---- */
function renderAltro(){

  let body='';
  if(ui.altro==='rate'){
    body = renderRate();
  } else if(ui.altro==='abbo'){
    body = renderAbbo();
  } else if(ui.altro==='carte'){
    body = renderCarte();
  } else if(ui.altro==='inv'){
    body = renderInv();
  } else {
    const m = ui.plMonth; const list = S.trading.filter(t=>+t.d.slice(0,4)===ui.year && +t.d.slice(5,7)-1===m).sort((a,b)=>a.d.localeCompare(b.d));
    const tot = sum(list.map(t=>t.v)); const mx = Math.max(1,...list.map(t=>Math.abs(t.v)));
    const yr = sum(S.trading.filter(t=>+t.d.slice(0,4)===ui.year).map(t=>t.v));
    body = `<div class="chips" style="margin:0 0 10px">${MESI.map((x,i)=>`<button class="chip ${m===i?'on':''}" onclick="ui.plMonth=${i};render()">${M3[i]}</button>`).join('')}</div>
      <div class="grid2"><div class="card kpi"><small>P&L ${M3[m]}</small><b class="mono ${tot<0?'neg':tot>0?'pos':''}">${eur(tot)}</b></div><div class="card kpi"><small>P&L ${ui.year}</small><b class="mono ${yr<0?'neg':yr>0?'pos':''}">${eur(yr)}</b></div></div>
      <div class="card" style="margin-top:10px">${list.length?`<div class="pl-bars">${list.map(t=>`<div style="height:${Math.abs(t.v)/mx*100}%;background:${t.v>=0?'var(--acc)':'var(--neg)'}"></div>`).join('')}</div>`:'<div class="empty">Nessun giorno registrato</div>'}</div>
      <h2 class="sec">Aggiungi giornata</h2>
      <div class="grid2"><input type="date" id="pl-d" value="${now.toISOString().slice(0,10)}"><input id="pl-v" inputmode="decimal" placeholder="P&L in €, es. -120,50"></div>
      <button class="btn" style="margin-top:8px" onclick="addPL()">Aggiungi</button>
      <div style="margin-top:14px">${list.slice().reverse().map(t=>`<div class="tx" onclick="delPL('${t.id}')"><div class="mid"><b>${+t.d.slice(8,10)} ${MESI[m]}</b><small>tocca per eliminare</small></div><b class="mono ${t.v>=0?'pos':'neg'}">${t.v>0?'+':''}${eur(t.v)}</b></div>`).join('')}</div>`;
  }
  // selettore di Altro solo su telefono e solo nella voce Altro (Rate e Carte hanno la loro voce nella barra)
  const seg = !WIDE.matches && ui.tab==='altro' ? altroSeg(ui.altro) : '';
  $('v-altro').innerHTML = seg + body;
}
function renderRate(){
  const att = S.rate.filter(r=>residue(r)>0), fin = S.rate.filter(r=>residue(r)===0);
  const seg = `<div class="seg" style="margin-bottom:14px">
    <button class="${ui.rateTab==='due'?'on':''}" onclick="ui.rateTab='due';render()">Da pagare · ${att.length}</button>
    <button class="${ui.rateTab==='paid'?'on':''}" onclick="ui.rateTab='paid';render()">Pagate · ${fin.length}</button></div>`;
  const titolo = r => esc(r.prod || r.tipo || 'Rata');
  const top = `<div class="grid2" style="margin-bottom:12px"><button class="btn" onclick="openRata()">+ Nuova rata</button><button class="btn ghost" onclick="openServizi()">Servizi</button></div>`;
  if(ui.rateTab==='due'){
    const ym = thisMonth(), nome = MESI[now.getMonth()].toLowerCase();
    const next = r => r.first ? dueDate(r, pagate(r)) : '9999';
    const card = r=>{
      const pm = rateDelMese(ym).find(x=>x.r===r && x.paid);
      const info = r.first
        ? `Prossima: <b style="color:var(--ink)">${fmtD(next(r))}</b> · ${eur(quota(r,pagate(r)))}`
        : `<span style="color:var(--warn)">Manca la data della prossima rata: tocca Modifica</span>`;
      return `<div class="card rate">
        <div class="row"><div style="min-width:0"><b>${titolo(r)}</b><div class="note">${eur(r.rata)} × ${r.n}${daDove(r)?` · da ${esc(daDove(r))}`:''}${r.tx?` · acquisto del ${fmtD(r.acq)} nei movimenti`:''}</div></div><b class="mono">${eur(daPagare(r))}</b></div>
        <div class="bar" style="margin:4px 0 8px"><div style="width:${pagate(r)/r.n*100}%;background:var(--acc)"></div></div>
        <div class="row"><div class="note">${pagate(r)}/${r.n} pagate · ${info}${pm?`<br><span class="pos">✓ ${nome} pagata il ${fmtD(pm.d)}</span>`:''}</div>
          <button class="btn sm ghost" onclick="openRata('${r.id}')">Modifica</button></div></div>`;
    };
    // un gruppo per servizio; i servizi senza rate in corso restano nascosti
    const gruppi = [...new Set(att.map(r=>r.tipo||'Altro'))].sort((a,b)=>{ const i=x=>{ const k=servizi().indexOf(x); return k<0?99:k; }; return i(a)-i(b); });
    const html = gruppi.map(g=>{ const l = att.filter(r=>(r.tipo||'Altro')===g).sort((a,b)=>next(a).localeCompare(next(b)));
      return `<div class="gh"><b>${esc(g)}</b><span class="mono">${eur(sum(l.map(r=>r.rata)))}/mese · resta ${eur(sum(l.map(daPagare)))}</span></div><div class="rgrid">${l.map(card).join('')}</div>`; }).join('');
    return top + seg + `<div class="grid2"><div class="card kpi"><small>Rate al mese</small><b class="mono">${eur(sum(att.map(r=>r.rata)))}</b></div><div class="card kpi"><small>Ancora da pagare</small><b class="mono neg">${eur(sum(att.map(daPagare)))}</b></div></div>
      ${html || '<div class="empty">Nessuna rata da pagare 🎉</div>'}
      <p class="note" style="margin-top:14px">Nel giorno della scadenza (o alla prima apertura dell'app dopo) la rata viene registrata tra le uscite, categoria Rate, e tolta dal conto scelto; se è pagata con una carta di credito finisce nel suo estratto conto.</p>`;
  }
  const storico = S.tx.filter(t=>t.rid && !t.int).sort((a,b)=>b.d.localeCompare(a.d) || b.id.localeCompare(a.id));
  const ultima = r => (storico.find(t=>t.rid===r.id)||{}).d;
  let cur='', righe='';
  storico.forEach(t=>{
    const m = `${MESI[txMonth(t)]} ${txYear(t)}`;
    if(m!==cur){ cur=m; righe+=`<div class="day">${m.toUpperCase()}</div>`; }
    righe += `<div class="tx" onclick="openTx('${t.id}')"><div class="mid"><b>${esc(t.note.split(' · ')[0]||t.sub)}</b><small>${fmtD(t.d)} · ${esc(t.sub)} · ${esc(t.note.split(' · ')[1]||'')}${daDove(t)?` · da ${esc(daDove(t))}`:''}</small></div><b class="mono">-${eur(t.amt)}</b></div>`;
  });
  return top + seg + `<h2 class="sec" style="margin-top:0">Rate concluse</h2><div class="rgrid">${fin.map(r=>`<div class="card rate" onclick="openRata('${r.id}')" style="cursor:pointer">
      <div class="row"><div style="min-width:0"><b>${titolo(r)}</b><div class="note">${esc(r.tipo)} · ${r.n} rate${ultima(r)?` · ultima il ${fmtD(ultima(r))}`:''}</div></div><b class="mono">${eur(r.tot)}</b></div>
      <span class="pill">✓ saldata</span></div>`).join('') || '<div class="empty">Nessuna rata conclusa</div>'}</div>
    <h2 class="sec">Pagamenti registrati</h2>${righe || '<div class="empty">Ancora nessun pagamento registrato dall\'app</div>'}`;
}
function openRata(id){
  const r = id ? S.rate.find(x=>x.id===id) : null;
  const acq = r ? (r.acq||'') : today();
  const dec = x => x ? String(x).replace('.',',') : ''; // 229.5 → 229,5 nel campo
  const v = r ? {tipo:r.tipo, prod:r.prod, acq, tot:dec(r.tot), n:r.n||'', res:residue(r), next:r.first ? dueDate(r,pagate(r)) : addMonths(today(),1), conto:r.conto}
              : {tipo:servizi()[0]||'PayPal', prod:'', acq, tot:'', n:'', res:'', next:addMonths(acq,1), conto:(S.conti.find(c=>c.g==='Banche')||{}).id||''};
  const sel = r && r.carta ? 'k:'+r.carta : v.conto ? 'c:'+v.conto : '';
  const conti = `<option value="">Nessun conto (non scalare)</option><optgroup label="Conti">` + S.conti.map(c=>`<option value="c:${c.id}" ${'c:'+c.id===sel?'selected':''}>${esc(c.n)} · ${c.g}</option>`).join('')
    + `</optgroup><optgroup label="Carte di credito">` + carte().map(c=>`<option value="k:${c.id}" ${'k:'+c.id===sel?'selected':''}>${esc(c.n)}</option>`).join('') + '</optgroup>';
  const srv = [...new Set([...servizi(), v.tipo].filter(Boolean))];
  sheet(`<h3>${id?'Modifica rata':'Nuova rata'}</h3>
    <div class="grid2">
      <div class="f"><label>Servizio</label><select id="r-t" data-prev="${esc(v.tipo)}" onchange="nuovoServizio(this)">${srv.map(x=>`<option ${x===v.tipo?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new">+ Nuovo servizio…</option></select></div>
      <div class="f"><label>Prodotto</label><input id="r-p" value="${esc(v.prod)}" placeholder="es. iPhone"></div>
      <div class="f"><label>Data acquisto</label><input type="date" id="r-acq" value="${v.acq}" oninput="rataAcq()"></div>
      <div class="f"><label>Importo totale (€)</label><input id="r-tot" inputmode="decimal" value="${v.tot}" placeholder="0,00 €" oninput="rataPrev()"></div>
      <div class="f"><label>Numero rate</label><input id="r-n" inputmode="numeric" value="${v.n}" placeholder="es. 12" oninput="rataN()"></div>
      <div class="f"><label>Rate da pagare</label><input id="r-res" inputmode="numeric" value="${v.res}" placeholder="tutte" oninput="this.dataset.t=1;rataPrev()"></div>
      <div class="f"><label>Prossima rata il</label><input type="date" id="r-next" value="${v.next}" oninput="this.dataset.t=1;rataPrev()"></div>
      <div class="f"><label>Pagata da</label><select id="r-c">${conti}</select></div>
    </div>
    <p class="note" id="r-prev" style="margin:0 0 12px"></p>
    <p class="note" style="margin:-4px 0 12px">Le rate successive scadono ogni mese nello stesso giorno. Se scegli una carta di credito, la rata finisce nel suo estratto conto e lascia il conto della carta il giorno dell'addebito.</p>
    <button class="btn" onclick="saveRata('${id||''}')">Salva</button>
    ${id?`<button class="btn danger" style="margin-top:8px" onclick="delRata('${id}')">Elimina</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
  if(id){ $('r-res').dataset.t=1; $('r-next').dataset.t=1; }
  rataPrev();
}
// valori dei campi: finché non li tocchi, "rate da pagare" segue il numero rate e la prossima rata segue l'acquisto
function rataN(){ if(!$('r-res').dataset.t) $('r-res').value = $('r-n').value; rataPrev(); }
function rataAcq(){ if(!$('r-next').dataset.t && $('r-acq').value) $('r-next').value = addMonths($('r-acq').value, 1); rataPrev(); }
function rataForm(){
  const n = parseInt($('r-n').value)||0, r = $('r-res').value.trim();
  return {tot:num($('r-tot').value), n, res: r==='' ? n : parseInt(r), next:$('r-next').value};
}
function rataPrev(){
  const {tot,n,res,next} = rataForm(), el = $('r-prev');
  if(!tot || !n){ el.textContent = ''; return; }
  const rata = round2(tot/n);
  el.innerHTML = `Rata <b class="mono" style="color:var(--ink)">${eur(rata)}</b> × ${n}` +
    (res>=0 && res<=n ? ` · da pagare ${res} (${eur(res===n ? tot : res*rata)})` + (res && next ? ` · ultima il ${fmtD(addMonths(next,res-1))}` : '') : '');
}
function saveRata(id){
  const old = id ? S.rate.find(x=>x.id===id) : null, done = old ? old.done : 0;
  const {tot,n,res,next} = rataForm();
  if(!tot) return toast('Inserisci l\'importo totale');
  if(n<1) return toast('Inserisci il numero di rate');
  if(isNaN(res) || res<0 || res>n) return toast('Rate da pagare: tra 0 e '+n);
  if(res && !next) return toast('Inserisci la data della prossima rata');
  const pre = n - res - done;
  if(pre<0) return toast(`L'app ha già registrato ${done} rate: al massimo ${n-done} da pagare`);
  if(res && next<today() && !confirm(`La prossima rata (${fmtD(next)}) è già passata: verrà registrata subito come pagata e tolta dal conto. Continuare?`)) return;
  const o = {tipo:$('r-t').value.trim()||'PayPal', prod:$('r-p').value.trim(), acq:$('r-acq').value||null,
    tot:round2(tot), n, rata:round2(tot/n), pre, done, first: res ? next : (old&&old.first)||null, fi: pre+done,
    conto: $('r-c').value.startsWith('c:') ? $('r-c').value.slice(2) : '', carta: $('r-c').value.startsWith('k:') ? $('r-c').value.slice(2) : ''};
  if(old) Object.assign(old,o); else S.rate.push({id:uid(),...o});
  addServizio(o.tipo);
  save(); closeSheet(); payDueRate(); render(); toast('Salvato');
}
/* ---- Investimenti ----
   S.inv = elenco ordinato {id, n, lvl:0|1|2, inv, eff, agg}: le voci di livello 1 e 2 seguono la voce che le contiene.
   una voce con sotto-voci che hanno importi = somma delle sotto-voci. I totali usano le voci di livello 0. */
function invFigli(i){ const r = S.inv[i], out = []; for(let j=i+1; j<S.inv.length && S.inv[j].lvl>r.lvl; j++) if(S.inv[j].lvl===r.lvl+1) out.push(j); return out; }
// una voce con dentro voci che hanno importi vale la loro somma (es. P2P Lending = Bondora); altrimenti i suoi importi
const invSomma = i => invFigli(i).some(j=>invVal(j,'inv')!=null || invVal(j,'eff')!=null);
function invVal(i, k){
  if(!invSomma(i)) return S.inv[i][k] ?? null;
  const v = invFigli(i).map(j=>invVal(j,k)); return v.some(x=>x!=null) ? round2(sum(v.map(x=>x||0))) : null;
}
// tipologie degli investimenti: un riquadro ciascuna, con il logo della piattaforma sfocato come sfondo
const INV_TIPI = [['azioni','Interactive Brokers','ibkr'],['crypto','Crypto.com','cro'],['p2p','Bondora','bondora'],['altro','Crowdcube','crowdcube']];
const invTipoAuto = n => /interactive|ibkr|ibks|azion|etf|stock|borsa/i.test(n) ? 'azioni' : /crypto|cripto|bitcoin|btc|ethereum|eth\b|solana/i.test(n) ? 'crypto'
  : /bondora|p2p|lending|mintos|recrowd/i.test(n) ? 'p2p' : 'altro';
// tipologia di una voce: la sua (voci principali) o quella della voce principale che la contiene
function invTipo(i){ let j=i; while(j>0 && S.inv[j].lvl>0) j--; const r=S.inv[j]; return r.tipo || invTipoAuto(r.n); }
// una volta: le voci per Azioni (Interactive Brokers) e Altro (Crowdcube) se mancano; il valore attuale dal conto in Patrimonio
function seedInvTipi(){
  const top = S.inv.filter(r=>r.lvl===0), conto = re => (S.conti.find(c=>re.test(c.n))||{}).v ?? null;
  const add = (n, tipo, re) => { if(!S.inv.some(r=>re.test(r.n))){ const v = conto(re); S.inv.push({id:uid(), n, lvl:0, tipo, inv:null, eff:v, agg:v!=null?today():undefined}); } };
  if(!top.some(r=>(r.tipo||invTipoAuto(r.n))==='azioni')) add('Interactive Brokers','azioni',/interactive|ibkr|ibks/i);
  if(!top.some(r=>(r.tipo||invTipoAuto(r.n))==='crypto')) add('Crypto.com','crypto',/crypto/i);
  if(!top.some(r=>(r.tipo||invTipoAuto(r.n))==='p2p')) add('Bondora','p2p',/bondora/i);
  add('Crowdcube','altro',/crowdcube/i);
}
// una volta: IBKS è Interactive Brokers. Se c'è già una voce IBKS, la voce "Interactive Brokers" creata in automatico
// (vuota, senza sotto-voci) si toglie e il suo valore passa a IBKS
// fine (esclusa) della voce i con le sue sotto-voci
function invBlocco(i){ let j = i+1; while(j<S.inv.length && S.inv[j].lvl>S.inv[i].lvl) j++; return j; }
// una volta: ogni tipologia ha la sua voce principale con le piattaforme dentro
// (Azioni → IBKS / Interactive Brokers, Varie → Crowdcube), come Criptovalute e P2P Lending
function invGruppi(){
  const gruppo = (n, tipo, pos) => { let g = S.inv.find(r=>r.lvl===0 && r.n.toLowerCase()===n.toLowerCase());
    if(!g){ g = {id:uid(), n, lvl:0, tipo, inv:null, eff:null}; S.inv.splice(pos, 0, g); } else if(!g.tipo) g.tipo = tipo;
    return g; };
  const sposta = (re, n, tipo) => {
    const ids = S.inv.filter(r=>re.test(r.n) && r.n.toLowerCase()!==n.toLowerCase()).map(r=>r.id); if(!ids.length) return;
    const p0 = S.inv.findIndex(r=>r.id===ids[0]);
    const g = gruppo(n, tipo, S.inv[p0].lvl===0 ? p0 : S.inv.length);
    ids.forEach(id=>{ const i = S.inv.findIndex(r=>r.id===id), j = invBlocco(i);
      if(S.inv.slice(i,j).some(r=>r.lvl-S.inv[i].lvl+1 > 2)) return; // troppi livelli: resta dov'è
      const blk = S.inv.splice(i, j-i), d = 1 - blk[0].lvl; blk.forEach(r=>r.lvl += d);
      S.inv.splice(invBlocco(S.inv.indexOf(g)), 0, ...blk); });
  };
  sposta(/ibks|interactive|ibkr/i, 'Azioni', 'azioni');
  sposta(/crowdcube/i, 'Varie', 'altro');
}
function unisciIbks(){
  const k = S.inv.findIndex(r=>r.lvl===0 && /ibks/i.test(r.n)); if(k<0) return;
  if(!S.inv[k].tipo) S.inv[k].tipo = 'azioni';
  const d = S.inv.findIndex(r=>r.lvl===0 && r.n==='Interactive Brokers' && r.inv==null);
  if(d<0 || invFigli(d).length) return;
  if(S.inv[k].eff==null && S.inv[d].eff!=null){ S.inv[k].eff = S.inv[d].eff; S.inv[k].agg = S.inv[d].agg; }
  S.inv.splice(d,1);
}
const invPct = (e,v) => v>0 && e!=null ? (e-v)/v*100 : null;
const invPctS = p => (p>=0?'+':'')+p.toFixed(1).replace('.',',')+'%';
// totali di una tipologia (voci principali)
function invTot(k){
  const its = S.inv.map((r,i)=>i).filter(i=>S.inv[i].lvl===0 && invTipo(i)===k);
  return { its, vi: sum(its.map(i=>invVal(i,'inv')||0)), ve: sum(its.map(i=>invVal(i,'eff')||0)),
    haE: its.some(i=>invVal(i,'eff')!=null), haI: its.some(i=>invVal(i,'inv')) };
}
function renderInv(){
  return `<div class="itiles">${INV_TIPI.map(([k,nome,logo])=>{
    const {its, vi, ve, haE, haI} = invTot(k), p = invPct(ve,vi);
    return `<button class="itile" onclick="openInvTipo('${k}')">
      <span class="itile-clip"><img class="itile-bg" src="${LOGHI[logo]}" alt=""></span><span class="itile-in">
        <span class="itile-h"><img class="logo" src="${LOGHI[logo]}" alt=""><small>${nome}</small></span>
        <b class="mono">${haE ? eurI(ve) : '–'}</b>
        <span class="itile-f"><span class="mono">inv. ${haI ? eurI(vi) : '–'}</span>${p!=null?`<span class="mono ${p>=0?'pos':'neg'}">${invPctS(p)}</span>`:''}</span>
      </span></button>`; }).join('')}</div>`;
}
// riepilogo di una tipologia: totali e tutte le sue voci; modifica e aggiunta tornano qui
function openInvTipo(k){
  ui.invRiep = k;
  const [, nome, logo] = INV_TIPI.find(t=>t[0]===k), {vi, ve, haE} = invTot(k), p = invPct(ve,vi);
  const righe = S.inv.map((r,i)=>i).filter(i=>invTipo(i)===k).map(i=>{ const r = S.inv[i], vi = invVal(i,'inv'), ve = invVal(i,'eff'), auto = invSomma(i);
    const p = invPct(ve,vi);
    return `<div class="inv-r" onclick="openInv('${r.id}')" style="cursor:pointer"><div class="${r.lvl===1?'l1':r.lvl===2?'l2':''}" style="${r.lvl===0?'font-weight:700':''}">${esc(r.n.replace(/^- /,''))}${r.agg?`<small class="mut" style="display:block;font-size:10.5px;font-weight:500">agg. ${fmtD(r.agg)}</small>`:auto?'<small class="mut" style="display:block;font-size:10.5px;font-weight:500">somma delle voci</small>':''}</div>
      <div class="mono">${vi?eurI(vi):'–'}</div><div class="mono">${ve!=null?eurI(ve):'–'}</div><div class="mono ${p==null?'mut':p>=0?'pos':'neg'}">${p==null?'–':(p>0?'+':'')+Math.round(p)+'%'}</div></div>`; }).join('');
  sheet(`<h3 class="iriep-h"><img class="logo" src="${LOGHI[logo]}" alt="">${nome}</h3>
    <div class="grid2"><div class="card kpi"><small>Valore attuale</small><b class="mono">${haE?eur(ve,0):'–'}</b></div><div class="card kpi"><small>Investito</small><b class="mono">${vi?eur(vi,0):'–'}</b></div></div>
    <div class="card kpi" style="margin-top:10px"><small>Rendimento</small><b class="mono ${p==null?'mut':p>=0?'pos':'neg'}">${p==null?'–':`${invPctS(p)}  ·  ${ve>=vi?'+':''}${eur(ve-vi,0)}`}</b></div>
    <h2 class="sec">Voci</h2><div class="card" style="padding:4px 12px">
      <div class="inv-r h"><div>Voce</div><div>Inv.</div><div>Attuale</div><div>%</div></div>
      ${righe || '<div class="empty">Nessuna voce in questa tipologia.</div>'}</div>
    <button class="btn" style="margin-top:12px" onclick="openInv()">+ Aggiungi</button>
    <p class="note" style="margin-top:10px">Tocca una voce per modificarla. Il rendimento % è calcolato da investito e valore attuale.</p>`);
}
// dopo modifica/eliminazione si torna al riepilogo da cui si è partiti
const invTorna = () => ui.invRiep ? openInvTipo(ui.invRiep) : closeSheet();
function openInv(id){
  const i = id ? S.inv.findIndex(x=>x.id===id) : -1, r = i>=0 ? S.inv[i] : {n:'', lvl:0, inv:null, eff:null};
  const dec = v => v==null ? '' : String(v).replace('.',',');
  const haFigli = i>=0 && invFigli(i).length, somma = i>=0 && invSomma(i);
  const imp = k => somma ? `value="" placeholder="${eurI(invVal(i,k)??0)}" disabled` : `value="${dec(r[k])}" placeholder="${haFigli?'somma delle voci':'0 €'}"`;
  const genitore = i>=0 && r.lvl>0 ? (()=>{ for(let j=i-1;j>=0;j--) if(S.inv[j].lvl===r.lvl-1) return S.inv[j].id; })() : '';
  // si può mettere dentro una voce di livello 0 o 1 (massimo tre livelli), mai dentro se stessa
  const opz = `<option value="">— Voce principale —</option>` + S.inv.filter(x=>x.lvl<2 && x.id!==r.id).map(x=>`<option value="${x.id}" ${x.id===genitore?'selected':''}>${x.lvl?'   └ ':''}${esc(x.n.replace(/^- /,''))}</option>`).join('');
  sheet(`<h3>${id?'Modifica investimento':'Nuovo investimento'}</h3>
    <div class="f"><label>Nome</label><input id="iv-n" value="${esc(r.n.replace(/^- /,''))}" placeholder="es. Bitcoin, ETF MSCI World, Bondora"></div>
    <div class="f" id="iv-t-w"><label>Riquadro</label><select id="iv-t">${INV_TIPI.map(([k,l])=>`<option value="${k}" ${(i>=0 ? invTipo(i) : ui.invRiep || 'altro')===k?'selected':''}>${l}</option>`).join('')}</select>
      <p class="note" style="margin:4px 0 0">Per le voci dentro un'altra vale il riquadro di quella principale.</p></div>
    <div class="f"><label>Dentro a</label><select id="iv-p" ${haFigli?'disabled':''}>${opz}</select>
      ${haFigli?'<p class="note" style="margin:4px 0 0">Contiene altre voci: per spostarla sposta prima quelle.</p>':''}</div>
    <div class="grid2">
      <div class="f"><label>Investito (€)</label><input id="iv-i" inputmode="decimal" ${imp('inv')}></div>
      <div class="f"><label>Valore attuale (€)</label><input id="iv-e" inputmode="decimal" ${imp('eff')}></div>
    </div>
    ${somma?'<p class="note" style="margin:-4px 0 12px">Il totale è la somma delle voci che contiene: si aggiorna modificando quelle.</p>':''}
    <button class="btn" onclick="saveInv('${id||''}')">Salva</button>
    ${id?`<button class="btn danger" style="margin-top:8px" onclick="delInv('${id}')">Elimina</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="invTorna()">Annulla</button>`);
}
function saveInv(id){
  const n = $('iv-n').value.trim(); if(!n) return toast('Inserisci il nome');
  const val = el => $(el).value.trim()==='' ? null : round2(num($(el).value));
  const inv = val('iv-i'), eff = val('iv-e');
  let i = id ? S.inv.findIndex(x=>x.id===id) : -1;
  const r = i>=0 ? S.inv[i] : {id:uid()};
  if(eff!=null && r.eff!==eff) r.agg = today(); // data dell'ultimo aggiornamento del valore
  Object.assign(r, {n, inv, eff, tipo:$('iv-t').value});
  const pid = $('iv-p').value;
  // genitore attuale: la voce resta dov'è se "Dentro a" non cambia
  const pidOld = i>=0 && r.lvl>0 ? (()=>{ for(let j=i-1;j>=0;j--) if(S.inv[j].lvl===r.lvl-1) return S.inv[j].id; })() : '';
  const moveable = !$('iv-p').disabled && (i<0 || pid!==pidOld);
  if(moveable){
    if(i>=0) S.inv.splice(i,1);
    if(!pid){ r.lvl = 0; S.inv.push(r); }
    else { // in fondo alle sotto-voci del genitore
      const pi = S.inv.findIndex(x=>x.id===pid); r.lvl = S.inv[pi].lvl + 1;
      let j = pi+1; while(j<S.inv.length && S.inv[j].lvl>S.inv[pi].lvl) j++;
      S.inv.splice(j, 0, r);
    }
  }
  save(); render(); invTorna(); toast('Salvato');
}
function delInv(id){
  const i = S.inv.findIndex(x=>x.id===id); let j = i+1;
  while(j<S.inv.length && S.inv[j].lvl>S.inv[i].lvl) j++;
  if(!confirm(j-i>1 ? `Eliminare "${S.inv[i].n}" e le ${j-i-1} voci che contiene?` : `Eliminare "${S.inv[i].n}"?`)) return;
  S.inv.splice(i, j-i); save(); render(); invTorna();
}

// riconosciuti dal nome del servizio; l'ordine conta (Apple Music prima di Apple)
const SRV_RE = [['vodafone',/vodafone/i],['iliad',/iliad/i],['applemusic',/apple\s*music/i],['icloud',/icloud/i],['claude',/claude|anthropic/i],
  ['netflix',/netflix/i],['spotify',/spotify/i],['prime',/prime|amazon/i],['youtube',/youtube/i],['dazn',/dazn/i],['openai',/chatgpt|openai/i],
  ['dropbox',/dropbox/i],['playstation',/playstation|ps\s?plus/i],['nintendo',/nintendo/i],['duolingo',/duolingo/i],['apple',/apple/i]];
function srvIcon(n, size=36){
  const m = SRV_RE.find(([k,re])=>re.test(n||''));
  return m ? `<img class="logo" src="${LOGHI_SRV[m[0]]}" alt="" style="width:${size}px;height:${size}px">`
           : `<i class="logo l" style="width:${size}px;height:${size}px">${esc((n||'?')[0].toUpperCase())}</i>`;
}

/* ---- Abbonamenti: pagina ---- */
function renderAbbo(){
  const att = abbo().filter(a=>a.attivo!==false).sort((a,b)=>(a.next||'9').localeCompare(b.next||'9')), sosp = abbo().filter(a=>a.attivo===false);
  const giorni = d => Math.round((new Date(d+'T12:00') - new Date(today()+'T12:00'))/864e5);
  const quando = d => { const g = giorni(d); return g===0 ? 'oggi' : g===1 ? 'domani' : g<0 ? 'scaduto' : `tra ${g} giorni`; };
  const meseCorr = thisMonth(), delMese = att.filter(a=>a.next && a.next.slice(0,7)===meseCorr);
  const pagati = S.tx.filter(t=>t.abid && t.d.slice(0,7)===meseCorr);
  const card = a => { const ult = S.tx.filter(t=>t.abid===a.id).sort((x,y)=>y.d.localeCompare(x.d))[0], pl = pagLabel(pagParse(a.pag||''));
    return `<div class="tx" onclick="openAbbo('${a.id}')">${srvIcon(a.n)}
      <div class="mid"><b>${esc(a.n)}</b><small>${freqName(a.freq)}${pl?' · '+esc(pl):''}</small>
        <small>${a.attivo===false?'Sospeso':a.next?`Rinnovo ${fmtD(a.next)} · ${quando(a.next)}`:''}${ult?` · ultimo ${fmtD(ult.d)}`:''}</small></div>

// prossima scadenza = ultimo pagamento + ricorrenza; se è già passata, la prima data futura
function abboNext(){
  const u = $('ab-u').value, f = +$('ab-f').value;
  if(!u) return abboPrev();
  let d = addMonths(u, f); while(d < today()) d = addMonths(d, f);
  $('ab-d').value = d; abboPrev();
}
function abboPrev(){
  const d = $('ab-d').value, f = +$('ab-f').value, ogni = {1:'ogni mese',2:'ogni 2 mesi',3:'ogni 3 mesi',6:'ogni 6 mesi',12:'ogni anno'}[f];
  $('ab-prev').textContent = d ? `Si rinnova ${ogni} · prossimo pagamento il ${fmtD(d)}, poi il ${fmtD(addMonths(d,f))}` : '';
}
function saveAbbo(id){
  const o = {n:$('ab-n').value.trim(), costo:round2(num($('ab-c').value)), freq:+$('ab-f').value, next:$('ab-d').value, pag:$('ab-p').value, cat:$('ab-cat').value.trim()||'Ricorrenti', attivo:$('ab-on').checked};
  if(!o.n) return toast('Inserisci il servizio');
  if(!o.costo) return toast('Inserisci il costo');
  if(!o.next) return toast('Inserisci la prossima scadenza');
  if(o.attivo && o.next<today() && !confirm(`La scadenza (${fmtD(o.next)}) è già passata: i pagamenti fino a oggi verranno registrati subito. Continuare?`)) return;
  const nid = id || uid();
  if(id) Object.assign(abbo().find(x=>x.id===id), o); else S.abbo.push({id:nid, ...o});
  // pagamento appena fatto: lo registro con la data dell'ultimo pagamento
  const u = $('ab-u').value;
  if(!id && $('ab-reg') && $('ab-reg').checked && u && !S.tx.some(x=>x.id===`ab_${nid}_${u}`)){
    const tx = {id:`ab_${nid}_${u}`, d:u, t:'u', cat:o.cat, sub:o.n, amt:o.costo, note:freqName(o.freq), abid:nid, ...pagParse(o.pag)};
    S.tx.push(tx); applyPag(tx);
  }
  save(); closeSheet(); payAbbo(); render(); toast('Salvato');
}
function delAbbo(id){
  if(!confirm('Eliminare questo abbonamento? I pagamenti già registrati restano tra i movimenti.')) return;
  S.abbo = S.abbo.filter(x=>x.id!==id); save(); closeSheet(); render();
}

function delPF(cid, fid){

/* ---- servizi delle rate (PayPal, Klarna…): rinomina, aggiungi, elimina ---- */
function nuovoServizio(sel){
  if(sel.value!=='__new'){ sel.dataset.prev = sel.value; return; }
  const n = (prompt('Nome del nuovo servizio')||'').trim();
  if(!n){ sel.value = sel.dataset.prev; return; }
  addServizio(n);
  if(![...sel.options].some(o=>o.value===n)){ const o=document.createElement('option'); o.textContent=n; sel.insertBefore(o, sel.lastElementChild); }
  sel.value = sel.dataset.prev = n;
}
function addServizio(n){ if(!S.servizi) S.servizi=[]; if(n && !S.servizi.includes(n)) S.servizi.push(n); }
function openServizi(){
  const uso = n => S.rate.filter(r=>r.tipo===n);
  sheet(`<h3>Servizi delle rate</h3>
    <p class="note" style="margin:-6px 0 12px">Nella scheda Da pagare compaiono solo i servizi con rate in corso; gli altri restano qui, pronti per la prossima rata.</p>
    ${servizi().map((n,i)=>{ const u=uso(n), att=u.filter(r=>residue(r)>0).length;

    <div class="row" style="margin:12px 0"><input id="sv-new" placeholder="Nuovo servizio, es. Younited" style="flex:1"><button class="btn sm" onclick="if($('sv-new').value.trim()){ saveServizi(); addServizio($('sv-new').value.trim()); save(); openServizi(); }">Aggiungi</button></div>

    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
// rinomina: aggiorna anche le rate e le loro uscite (voce nei movimenti)
function saveServizi(){
  S.servizi = S.servizi.map((old,i)=>{ const el=$('sv-'+i); const n=el ? el.value.trim()||old : old;
    if(n!==old){ S.rate.forEach(r=>{ if(r.tipo===old) r.tipo=n; }); S.tx.forEach(t=>{ if(t.rid && t.sub===old) t.sub=n; }); }
    return n; });
  S.servizi = [...new Set(S.servizi)];
}
function delServizio(i){ saveServizi(); S.servizi.splice(i,1); save(); openServizi(); }
function delRata(id){
  if(!confirm('Eliminare questa rata? I pagamenti già registrati restano tra i movimenti.')) return;
  S.tx.forEach(t=>{ if(t.rata===id) delete t.rata; });

}
function addPL(){ const d=$('pl-d').value, v=num($('pl-v').value); if(!d||$('pl-v').value==='') return toast('Data e valore'); S.trading.push({id:uid(),d,v}); save(); ui.plMonth=+d.slice(5,7)-1; render(); }
function delPL(id){ S.trading=S.trading.filter(t=>t.id!==id); save(); render(); }

}

    <div class="f"><label>Voce (sottocategoria)</label><input id="t-s" list="t-sl" value="${esc(t.sub)}" placeholder="es. Benzina Golf"><datalist id="t-sl"></datalist></div>
    <div class="f"><label>Nota</label><input id="t-n" value="${esc(t.note.startsWith('Totale mensile')?t.note:t.note)}" placeholder="facoltativa"></div>
    <div class="f" id="t-k-w" style="display:${t.t==='u'?'block':'none'}"><label id="t-k-l">${rp?'Rate pagate con':'Pagato con'}</label><select id="t-k" ${t.rid||t.pf?'disabled':''}>${pagOptions(rp ? (rp.carta ? 'k:'+rp.carta : rp.conto ? 'c:'+rp.conto : '') : id ? pagValue(t) : carta ? 'k:'+carta : ui.lastPag||'')}</select>
      ${t.pf?'<p class="note" style="margin:4px 0 0">Spesa rateizzata con la carta: per cambiarla annulla prima la rateizzazione nella sezione Carte.</p>':''}</div>
    <div id="t-r-w" style="display:${t.t==='u'&&rateOk?'block':'none'}">
      <label class="chk" style="justify-content:flex-start;margin:-2px 0 10px"><input type="checkbox" id="t-r" ${rp?'checked':''} ${lock?'disabled':''} onchange="txRate()"> Pagato a rate</label>
      <div id="t-r-f" style="display:${rp?'block':'none'}">

          <div class="f"><label>Numero rate</label><input id="t-r-n" inputmode="numeric" list="t-r-nl" value="${rp?rp.n:3}" oninput="txRatePrev()" ${lock?'disabled':''}><datalist id="t-r-nl"><option>3<option>4<option>6<option>10<option>12<option>24</datalist></div>
          <div class="f"><label>Prima rata il</label><input type="date" id="t-r-d" value="${rp?dueDate(rp,0):addMonths(t.d,1)}" ${rp?'data-t="1"':''} oninput="this.dataset.t=1;txRatePrev()" ${lock?'disabled':''}></div>
          <div class="f"><label>Totale da rimborsare (€)</label><input id="t-r-t" inputmode="decimal" value="${rp && rp.tot!==rp.imp ? dec(rp.tot) : ''}" placeholder="= importo" oninput="txRatePrev()" ${lock?'disabled':''}></div>
        </div>

function txRate(){
  const on = $('t-r').checked;
  $('t-r-f').style.display = on ? 'block' : 'none';
  $('t-k-l').textContent = on ? 'Rate pagate con' : 'Pagato con';
  txRatePrev();
}
function txRatePrev(){
  const el = $('t-r-p'); if(!el) return;
  const amt = num($('t-a').value), n = parseInt($('t-r-n').value)||0, first = $('t-r-d').value, tot = num($('t-r-t').value) || amt;
  if(!amt || n<2 || !first){ el.textContent = ''; return; }

  el.innerHTML = `${n} rate da <b class="mono" style="color:var(--ink)">${eur(round2(tot/n))}</b> · dal ${fmtD(first)} al ${fmtD(addMonths(first,n-1))}${int>0?` · interessi ${eur(int)}`:''}<br>La spesa di ${eur(amt)} vale alla data dell'acquisto; i soldi escono a ogni rata, non subito.`;
}
// pagamento di una rata collegata a un acquisto: non è una spesa, si gestisce dalla rata
function openPagRata(t){
  const r = S.rate.find(x=>x.id===t.rid);
  sheet(`<h3>Pagamento rata</h3>
    <p class="note" style="margin:-6px 0 12px"><b style="color:var(--ink)">${esc(t.note)}</b> · ${fmtD(t.d)} · ${eur(t.amt)}${pagLabel(t)?' · '+esc(pagLabel(t)):''}</p>
    <p class="note" style="margin:0 0 14px">È il pagamento di una rata: la spesa è già registrata con l'acquisto, quindi qui non conta come uscita. Per cambiare importi o scadenze apri la rata.</p>
    ${r?`<button class="btn" onclick="closeSheet();showTab('rate');openRata('${r.id}')">Apri la rata</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Chiudi</button>`);
}
function setTxT(v){
  $('t-t').value=v; draftT=v; $('t-k-w').style.display = v==='u'?'block':'none'; $('t-r-w').style.display = v==='u'?'block':'none';
  document.querySelectorAll('#tx-seg button').forEach(b=>b.classList.toggle('on',b.classList.contains(v)));
  fillCats('');
}
function fillCats(sel){
  const tipo=$('t-t').value; const m=catMap(tipo);
  $('t-c').innerHTML = [...m.keys()].sort().map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('') + '<option value="__new">+ Nuova categoria…</option>';
  if(sel && !m.has(sel)){ $('t-c').value='__new'; $('t-newc').value=sel; }
  catChange();
}
function catChange(){
  const v=$('t-c').value; $('t-newc-w').style.display = v==='__new'?'block':'none';
  const subs = v==='__new' ? [] : [...(catMap($('t-t').value).get(v)||[])].sort();
  $('t-sl').innerHTML = subs.map(s=>`<option value="${esc(s)}">`).join('');
}
function saveTx(id){
  const o = { t:$('t-t').value, amt:num($('t-a').value), d:$('t-d').value,
    cat: $('t-c').value==='__new' ? $('t-newc').value.trim() : $('t-c').value, sub:$('t-s').value.trim(), note:$('t-n').value.trim() };
  if(!o.amt) return toast('Inserisci un importo');
  if(!o.cat) return toast('Scegli una categoria');
  if(!o.d) return toast('Inserisci la data');
  const old = id && S.tx.find(x=>x.id===id);
  if(!(old && (old.rid || old.pf))) Object.assign(o, o.t==='u' ? pagParse($('t-k').value) : {carta:'', pag:'', conto:''});
  // pagato a rate: l'acquisto non muove soldi, li muovono le rate dal conto/carta di "Rate pagate con"
  const rateOn = o.t==='u' && $('t-r') && $('t-r').checked && !(old && (old.rid || old.pf || old.abid));
  const pianoOld = old && old.rata && S.rate.find(r=>r.id===old.rata);
  let piano = null, pagRate = null;
  if(rateOn){
    pagRate = pagParse($('t-k').value);
    if(!(pianoOld && pianoOld.done>0)){
      const n = parseInt($('t-r-n').value)||0, first = $('t-r-d').value, tot = num($('t-r-t').value) || o.amt;
      if(n<2) return toast('Numero di rate: almeno 2');
      if(!first) return toast('Inserisci la data della prima rata');
      if(tot < o.amt) return toast('Il totale da rimborsare non può essere minore dell\'importo');
      if(first<today() && !(pianoOld && dueDate(pianoOld,0)===first) && !confirm(`La prima rata (${fmtD(first)}) è già passata: le rate fino a oggi verranno registrate subito come pagate e tolte da "${pagLabel(pagRate)||'nessun conto'}". Continuare?`)) return;
      piano = {n, first, tot:round2(tot)};
    }
    Object.assign(o, {carta:'', pag:'', conto:''});
  }
  // una spesa di un estratto conto già addebitato non può cambiare carta né importo: il conto è già stato scalato
  const chiuso = t => t && t.carta && (()=>{ const c=carte().find(x=>x.id===t.carta); return c && (c.es||[]).some(e=>e.m===t.d.slice(0,7)); })();
  if(chiuso(old) && (o.carta!==old.carta || o.amt!==old.amt || o.d.slice(0,7)!==old.d.slice(0,7))) return toast('Estratto conto già addebitato: importo, mese e carta non si possono più cambiare');
  if(chiuso({...o, carta:o.carta}) && !(old && old.carta===o.carta && old.d.slice(0,7)===o.d.slice(0,7))) return toast('L\'estratto conto di quel mese è già stato addebitato');
  if(old && old.pf){ const f=carte().flatMap(c=>c.flex||[]).find(f=>f.id===old.pf); if(f && o.amt!==old.amt){ if(f.done) return toast('Rateizzazione già in corso: l\'importo non si può cambiare'); f.imp=o.amt; } }
  // carta di debito / conto / contanti: l'importo esce subito dal conto (prima tolgo l'effetto della versione vecchia)
  if(old) applyPag(old, -1);
  if(old) Object.assign(old,o); else S.tx.push({id:uid(),...o});
  const tx = old || S.tx[S.tx.length-1];
  applyPag(tx);
  if(o.t==='u' && !(old && (old.rid || old.pf))) ui.lastPag = $('t-k').value;
  if(rateOn){
    const pr = {...(piano ? {n:piano.n, tot:piano.tot, rata:round2(piano.tot/piano.n), first:piano.first, fi:0, pre:0, done:0, imp:o.amt, tipo:$('t-r-s').value} : {}),
      prod:o.sub||o.cat, acq:o.d, conto:pagRate.conto, carta:pagRate.carta, tx:tx.id};
    if(pianoOld) Object.assign(pianoOld, pr); else { const rid = uid(); S.rate.push({id:rid, ...pr}); tx.rata = rid; }
    addServizio(pr.tipo || (pianoOld||{}).tipo);
  } else if(pianoOld){ S.rate = S.rate.filter(r=>r!==pianoOld); delete tx.rata; } // spunta tolta (nessuna rata ancora pagata)
  if(rateOn) payDueRate();
  save(); closeSheet(); render(); toast('Movimento salvato');
}
function delTx(id){
  const t = S.tx.find(x=>x.id===id);
  if(t.pf) return toast('Spesa rateizzata: annulla prima la rateizzazione nella sezione Carte');
  const pr = t.rata && S.rate.find(r=>r.id===t.rata);
  if(pr){
    if(!confirm(pr.done ? `Questo acquisto è pagato a rate e ${pr.done} rate sono già state pagate. Eliminare acquisto e piano rate? I pagamenti già registrati restano.` : 'Eliminare l\'acquisto e il suo piano rate?')) return;
    S.rate = S.rate.filter(r=>r!==pr);
  }
  applyPag(t, -1); // restituisce l'importo al conto
  S.tx=S.tx.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Eliminato');
}

/* ============ GIORNALE DI BORDO (app del gommone): scadenze di auto, scooter, moto, gommone e carrello ============
   Sola lettura dal suo progetto Firebase, con l'account del Giornale (accesso una volta per dispositivo, da Impostazioni).
   Lì i dati stanno in users/{uid}/data/{chiave} = {value: JSON}; ogni voce è un periodo pagato {scadenza, premio|importo}:
   la scadenza della più recente è il prossimo pagamento (importo stimato = l'ultimo pagato), quelle già rinnovate risultano pagate.
   Le scadenze restano in memoria: non entrano nei dati cifrati di Bilancio e nel Giornale non si scrive nulla. */
const BORDO_CFG = {
  apiKey: "AIzaSyCslXOf7xIBBHQfEMWspOw4kGp9vwmu2QY",
  authDomain: "app-gommone.firebaseapp.com",
  projectId: "app-gommone",
  appId: "1:291691340599:web:c6682923f4a45e1a2970b2"
};
const BORDO_FONTI = [ // [chiave, mezzo, cosa]
  ...['auto','scooter','moto'].flatMap(v=>[[v+'_insurances',v,'Assicurazione'],[v+'_bollo',v,'Bollo'],[v+'_revisioni',v,'Revisione']]),
  ['insurances','gommone','Assicurazione'], ['carrelloInsurances','carrello','Assicurazione'], ['carrelloBollo','carrello','Bollo'], ['carrelloRevisioni','carrello','Revisione']];
const bordo = {stato:'off', voci:[], err:'', email:'', agg:0};
let bordoApp = null, bordoBoxH = '';
const bordoOn = () => { try{ return localStorage.getItem('bilancio:bordo')==='1'; }catch(e){ return false; } };
// dalle liste del Giornale alle scadenze {n:'Bollo auto', chi, d, amt (null = importo mai inserito), paid}
function bordoVoci(dati){
  const out = [], imp = x => x.premio ?? x.importo ?? null;
  BORDO_FONTI.forEach(([k, mezzo, cosa])=>{
    const l = (Array.isArray(dati[k]) ? dati[k] : []).filter(x=>x && x.scadenza).sort((a,b)=>a.scadenza.localeCompare(b.scadenza));
    l.forEach((x,i)=>{ const dopo = l[i+1];
      out.push({n:`${cosa} ${mezzo}`, chi:x.compagnia||'', d:x.scadenza, amt: dopo ? imp(dopo) : imp(x), paid:!!dopo}); });
  });
  return out.sort((a,b)=>a.d.localeCompare(b.d));
}
const bordoDelMese = ym => bordo.voci.filter(v=>v.d.slice(0,7)===ym);
function bordoAggiorna(){
  if(!CLOUD || cloud.key) render();
  // solo se cambia: non cancella email e password mentre le scrivi
  const b = $('bordo-box'), h = bordoBox(); if(b && bordoBoxH!==h){ b.innerHTML = bordoBoxH = h; }
}
async function bordoAvvia(){
  if(bordoApp) return bordoApp;
  if(!window.firebase) for(const f of ['app','auth','firestore']) await loadScript(`${FIREBASE_SDK}firebase-${f}-compat.js`);
  bordoApp = (firebase.apps||[]).find(a=>a.name==='bordo') || firebase.initializeApp(BORDO_CFG, 'bordo');
  bordoApp.auth().onAuthStateChanged(u=>{
    bordo.email = u ? u.email : '';
    if(u) return bordoLeggi();
    bordo.stato = 'login'; bordo.voci = []; bordoAggiorna();
  });
  return bordoApp;
}
async function bordoLeggi(){
  const u = bordoApp && bordoApp.auth().currentUser; if(!u) return;
  bordo.stato = 'carico'; bordoAggiorna();
  try{
    const col = bordoApp.firestore().collection('users').doc(u.uid).collection('data');
    const docs = await Promise.all(BORDO_FONTI.map(([k])=>col.doc(k).get()));
    const dati = {};
    docs.forEach((d,i)=>{ if(d.exists) try{ dati[BORDO_FONTI[i][0]] = JSON.parse(d.data().value); }catch(e){} });
    bordo.voci = bordoVoci(dati); bordo.stato = 'ok'; bordo.agg = Date.now();
  }catch(e){ console.error(e); bordo.stato = 'err'; bordo.err = e.code==='permission-denied' ? 'accesso negato dalle regole del Giornale' : (e.code||e.message); }
  bordoAggiorna();
}
async function bordoCollega(){
  const e = $('bd-e').value.trim(), p = $('bd-p').value;
  if(!e || !p) return toast('Inserisci email e password del Giornale');
  $('bd-b').disabled = true; $('bd-b').textContent = 'Collego…';
  try{
    await bordoAvvia();
    await bordoApp.auth().signInWithEmailAndPassword(e, p);
    try{ localStorage.setItem('bilancio:bordo','1'); }catch(x){}
  }catch(x){ toast(x.code ? authMsg(x) : 'Giornale di Bordo non raggiungibile'); $('bd-b').disabled = false; $('bd-b').textContent = 'Collega'; }
}
async function bordoScollega(){
  try{ localStorage.removeItem('bilancio:bordo'); }catch(x){}
  if(bordoApp) await bordoApp.auth().signOut();
  Object.assign(bordo, {stato:'off', voci:[], email:''}); bordoAggiorna();
}
function bordoBox(){
  const prossime = bordo.voci.filter(v=>!v.paid).slice(0,4);
  if(bordo.stato==='ok') return `<p class="note">Collegato come <b>${esc(bordo.email)}</b>: assicurazioni, bolli e revisioni compaiono in Panoramica (Da pagare) e in Abbonamenti.</p>
    ${prossime.map(v=>`<div class="row" style="font-size:13px;margin:4px 0"><span>${esc(v.n)} · ${fmtD(v.d)}</span><b class="mono">${v.amt!=null?eur(v.amt):'–'}</b></div>`).join('') || '<p class="note">Nessuna scadenza trovata nel Giornale.</p>'}

/* ---- CSV ---- */
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/,'');
  const first = txt.split(/\r?\n/)[0]||'';
  const del = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===del){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
const csvNum = v => { if(v==null||String(v).trim()==='') return null; let x=String(v).replace(/[€\s]/g,''); if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.'); const n=parseFloat(x); return isNaN(n)?null:n; };
function csvDate(v){
  v=String(v||'').trim(); let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function importCSV(f){
  if(!f) return;
  const kind=$('csv-k').value, rep=$('csv-rep').checked;
  const r=new FileReader();
  r.onload=()=>{
    let rows=parseCSV(r.result), skipped=0, out=[];
    if(rows.length && /[a-zA-Z]/.test(rows[0].join('')) && csvNum(rows[0][rows[0].length-1])===null) rows=rows.slice(1); // intestazione
    rows.forEach(c=>{
      if(kind==='mov'){
        const d=csvDate(c[0]), a=csvNum(c[4]); const t=/^e/i.test(c[1]||'')?'e':/^u/i.test(c[1]||'')?'u':null;
        if(!d||a==null||!t||!c[2]) return skipped++;
        out.push({id:uid(),d,t,cat:c[2],sub:c[3]||'',amt:Math.abs(a),note:c[5]||''});
      } else if(kind==='conti'){
        const v=csvNum(c[2]); if(!c[1]||v==null) return skipped++;
        out.push({id:uid(),g:c[0]||'Banche',n:c[1],v});
      } else if(kind==='rate'){
        const rt=csvNum(c[2]), rs=csvNum(c[3]); if(rt==null||rs==null) return skipped++;
        const ct = c[5] ? S.conti.find(x=>x.n.toLowerCase()===c[5].toLowerCase()) : null;
        out.push({id:uid(), tipo:c[0]||'PayPal', prod:c[1]==='-'?'':(c[1]||''), acq:null, tot:round2(rt*rs), n:rs, rata:rt, pre:0, done:0, first:csvDate(c[4]), fi:0, conto:ct?ct.id:''});
      } else if(kind==='inv'){
        if(!c[0]) return skipped++;
        out.push({id:uid(),n:c[0],lvl:parseInt(c[1])||0,inv:csvNum(c[2]),eff:csvNum(c[3])});
      } else if(kind==='storico'){
        // mese come 2026-03, 03/2026 o 01/03/2026
        const t=String(c[0]||'').trim(); let m=t.match(/^(\d{4})-(\d{1,2})/)||t.match(/^(?:\d{1,2}[\/.-])?(\d{1,2})[\/.-](\d{4})$/);
        if(!m) return skipped++;
        const ym = m[1].length===4 ? `${m[1]}-${m[2].padStart(2,'0')}` : `${m[2]}-${m[1].padStart(2,'0')}`;
        const v = [1,2,3].map(i=>csvNum(c[i])||0);
        out.push(fotoPatr(ym, today(), 'inserito', GRUPPI.map((k,i)=>({n:k, g:k, v:v[i]}))));
      } else {
        const d=csvDate(c[0]), v=csvNum(c[1]); if(!d||v==null) return skipped++;
        out.push({id:uid(),d,v});
      }
    });
    const key = {mov:'tx',conti:'conti',rate:'rate',inv:'inv',trading:'trading',storico:'storico'}[kind];
    if(key==='storico'){ if(rep) S.storico=[]; out.forEach(putFoto); }
    else S[key] = rep ? out : S[key].concat(out);
    if(key==='rate') payDueRate();
    save(); closeSheet(); render();
    toast(`Importati ${out.length}${skipped?` · ${skipped} righe saltate`:''}`);
  };
  r.readAsText(f);
}
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='bilancio-backup.json'; a.click(); }

async function onUser(u){
  if(!u){ resetVault(); cloud.user=null; cloud.meta=null; return gate('login'); }
  if(cloud.user && cloud.user.uid===u.uid && cloud.key) return;
  cloud.user = u;
  gate('loading','Apro la cassaforte…');
  try{ const s = await cloud.ref().get(); cloud.meta = s.exists ? s.data() : null; }
  catch(e){ return e.code==='permission-denied' ? gate('denied') : gate('error','Non riesco a leggere i dati: '+(e.code||e.message)); }
  if(!cloud.meta) return gate('setup');
  const saved = await kdb.get(u.uid);
  if(saved && saved.salt===cloud.meta.salt && await keyOk(saved.key, cloud.meta)) return openVault(saved.key);
  gate('unlock');
}
function remember(key){ const r=$('g-r'); return kdb.set(cloud.user.uid, r&&r.checked ? {key, salt:cloud.meta.salt} : null); }
function newPass(p, p2){
  if(p.length<8){ return 'Almeno 8 caratteri'; }
  if(p!==p2){ return 'Le due passphrase non coincidono'; }
  return '';

async function setupVault(){
  const err = newPass($('g-p').value, $('g-p2').value); if(err) return gateErr(err);
  gateBtn(true,'Creo…');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey($('g-p').value,salt,KDF_ITER);
    const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
    const ref=cloud.ref();
    // mai sovrascrivere una cassaforte esistente: i dati cifrati con la vecchia chiave andrebbero persi
    await cloud.db.runTransaction(async t=>{ if((await t.get(ref)).exists) throw new Error('exists'); t.set(ref,{...meta, created:ts()}); });
    cloud.meta=meta;
    await remember(key);
    openVault(key);
  }catch(e){
    if(e.message==='exists') return onUser(cloud.user);
    gateBtn(false,'Crea cassaforte'); gateErr('Errore: '+(e.code||e.message));
  }
}
async function unlockVault(){
  const p=$('g-p').value; if(!p) return;
  gateBtn(true,'Verifico…');
  const key = await deriveKey(p, unb64(cloud.meta.salt), cloud.meta.iter);
  if(!await keyOk(key, cloud.meta)){ gateBtn(false,'Sblocca'); return gateErr('Passphrase errata'); }
  await remember(key);
  openVault(key);
}
async function openVault(key){
  cloud.key=key;

  try{ S = await cloud.get(); }
  catch(e){ cloud.key=null; return gate('error','Impossibile leggere o decifrare i dati: '+(e.code||e.message||'chiave non valida')); }
  cloud.v = S;
  // primo accesso da un browser che aveva già dati in locale: li porto nel cloud e poi li tolgo da localStorage
  // (prima di afterLoad, che crea le carte predefinite e renderebbe il cloud "non vuoto")
  const loc = localStore.get();
  if(loc && SEZ.some(k=>(loc[k]||[]).length) && !SEZ.some(k=>(S[k]||[]).length)){
    S = {...buildSeed(), ...loc}; cloud.wipeLocal = true; save(); toast('Dati locali caricati nel cloud');
  }
  afterLoad();
  $('gate').classList.remove('on'); setSync(cloud.timer?'saving':'ok'); render();
}

  try{
    const fresh = await cloud.get();
    if(cloud.busy || cloud.timer) return;
    if(SEZ.some(k=>JSON.stringify(fresh[k])!==JSON.stringify(S[k]))){ S=fresh; cloud.v=S; S.rate=S.rate.map(migrateRata); render(); }
  }catch(e){}
  checkRate();
});
window.addEventListener('beforeunload', e=>{ if(CLOUD && (cloud.timer || cloud.busy || cloud.dirty().length)){ e.preventDefault(); e.returnValue=''; } });

// app rimasta aperta: a ogni ritorno in primo piano e ogni ora controllo le rate in scadenza
function checkRate(){ if((!CLOUD || cloud.key) && S.carte && (payDueRate() + payAbbo() + settleCards() + autoStorico())) render(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !CLOUD) checkRate(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && bordo.stato==='ok' && Date.now()-bordo.agg > 10*60*1000) bordoLeggi(); });
setInterval(checkRate, 60*60*1000);

if(!CLOUD) afterLoad();
if(!CLOUD && bordoOn()) bordoAvvia().catch(e=>console.error(e));
showTab('home');
sizeSide();
boot();
</script>
</body>
