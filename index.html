<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6f4ef">
<script>
  let t = 'vetro'; try{ t = localStorage.getItem('bilancio:tema') || 'vetro'; }catch(e){}
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = {scuro:'#1e2629', carta:'#f6f4ef'}[t] || '#e6dccf';
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilancio">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icona-180.png">
<title>Bilancio — Finanze personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* tema Carta (predefinito): bianco caldo e verde smeraldo */
:root{
  color-scheme:light;
  --bg:#f6f4ef; --panel:#ffffff; --panel2:#f1eee7; --line:#e4dfd4;
  --ink:#1d2420; --ink2:#55605a; --ink3:#8a938d;
  --acc:#0f9f6e; --acc-dim:rgba(15,159,110,.12); --on-acc:#ffffff; --acc-shadow:rgba(15,159,110,.28);
  --neg:#d9304f; --neg-line:#f1c3cc; --warn:#c97a06; --blue:#2a78d6;
  --glass:rgba(246,244,239,.92); --sheet:#ffffff; --overlay:rgba(20,24,22,.35); --track:rgba(0,0,0,.07); --sub-bg:rgba(0,0,0,.02);
  --hero-bg:linear-gradient(160deg,#e3f3ea,#ffffff 65%); --hero-line:#bfe3cf; --hero-ink:#0b7a54; --gate-glow:#dff1e7;
  --solid:var(--panel); --solid2:var(--panel2);
  --brand-bg:#0f9f6e; --brand-fg:#ffffff; --brand-cl:#0a6347; --brand-dot:#0f9f6e;
  --nav-glass:rgba(255,255,255,.72); --nav-line:rgba(255,255,255,.9); --nav-on:rgba(20,30,25,.07);
  --r:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
/* tema scuro Ardesia: grafite morbida e verde brillante */
:root[data-theme="scuro"]{
  color-scheme:dark;
  --bg:#1e2629; --panel:#273235; --panel2:#2f3b3f; --line:#3a474b;
  --ink:#eef3f1; --ink2:#b3c1bb; --ink3:#84928c;
  --acc:#4ade80; --acc-dim:rgba(74,222,128,.14); --on-acc:#0f1f15; --acc-shadow:rgba(74,222,128,.30);
  --neg:#fb7185; --neg-line:#5a3440; --warn:#fbbf24; --blue:#60a5fa;
  --glass:rgba(30,38,41,.92); --sheet:#232d30; --overlay:rgba(0,0,0,.5); --track:rgba(0,0,0,.22); --sub-bg:rgba(255,255,255,.02);
  --hero-bg:linear-gradient(160deg,#2f4d44,#273235 65%); --hero-line:#3f6357; --hero-ink:#a7e9c3; --gate-glow:#2f4d44;
  --brand-bg:#111a17; --brand-fg:#4ade80; --brand-cl:#0a0f0d; --brand-dot:#4ade80;
  --nav-glass:rgba(47,59,63,.72); --nav-line:rgba(255,255,255,.09); --nav-on:rgba(255,255,255,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + var(--sab))}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}

/* masthead */
.mast{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:calc(12px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand i{width:24px;height:24px;display:block;flex:none}
.brand i svg{width:100%;height:100%;display:block}
/* logo (portafoglio): colori dal tema */
.b-bg{fill:var(--brand-bg)} .b-fg{fill:var(--brand-fg)} .b-st{stroke:var(--brand-fg)} .b-cl{fill:var(--brand-cl)} .b-dot{fill:var(--brand-dot)}
.icon-btn{background:none;border:1px solid var(--line);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.period{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.yr{display:flex;align-items:center;gap:6px;font-weight:700}
.yr button{background:none;border:none;color:var(--ink2);font-size:18px;padding:2px 6px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink2);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

/* layout */
.view{display:none;padding:14px 16px}
.view.on{display:block}
h2.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{display:block;color:var(--ink3);font-size:11px;font-weight:600;margin-bottom:4px}
.kpi b{font-size:19px;font-weight:700}
.hero{background:var(--hero-bg);border-color:var(--hero-line)}
.hero small{color:var(--hero-ink)}
.hero b{font-size:30px;letter-spacing:-.02em}
.pos{color:var(--acc)} .neg{color:var(--neg)} .mut{color:var(--ink3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:13px}

/* bars list */
.bl{display:flex;flex-direction:column;gap:11px}
.bl-i .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bl-i .top span:first-child{font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar>div{height:100%;border-radius:9px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--ink3);font-weight:600}
.donut .c b{display:block;font-size:14px;color:var(--ink)}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* movimenti */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.u{color:var(--neg)} .seg button.on.e{color:var(--acc)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.search{margin:10px 0}
.day{font-size:11px;color:var(--ink3);font-weight:700;margin:16px 2px 6px;letter-spacing:.05em}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.tx .dot{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(max(12px, calc(var(--sab) - 6px)) + 78px);width:54px;height:54px;border-radius:17px;border:none;background:var(--acc);color:var(--on-acc);font-size:28px;font-weight:600;box-shadow:0 8px 24px var(--acc-shadow);cursor:pointer;z-index:15;display:none}
.fab.on{display:block}

/* matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-height:68vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.mx th,.mx td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mx th{position:sticky;top:0;background:var(--solid2);color:var(--ink3);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;z-index:2}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;text-align:left;background:var(--solid);z-index:1;min-width:128px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
.mx th:first-child{background:var(--solid2);z-index:3}
.mx tr.grp td{background:var(--solid2);font-weight:700}
.mx tr.grp td:first-child{background:var(--solid2)}
.mx tr.sub td:first-child{padding-left:20px;color:var(--ink2)}
.mx td.z{color:var(--ink3)}
.mx tr.grp td, .mx tr.sub td{cursor:pointer}
.mx tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.mx td.t{font-weight:700;background:var(--solid2)}

/* lists */
.acct{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.acct:last-child{border:none}
/* investimenti: un riquadro per tipologia, logo della piattaforma sfocato come sfondo */
.itiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.itile{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:0;text-align:left;cursor:pointer;color:var(--ink);
  box-shadow:0 8px 24px rgba(0,0,0,.10);transition:transform .15s, box-shadow .15s}
/* Safari non ritaglia agli angoli arrotondati un elemento con filter: il ritaglio esplicito sì */
.itile-clip{position:absolute;inset:0;overflow:hidden;border-radius:inherit;clip-path:inset(0 round var(--r));-webkit-mask-image:-webkit-radial-gradient(white,black)}
.itile-bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(12px) saturate(1.4);opacity:.8}
.itile-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px;background:linear-gradient(180deg,var(--panel) 0%,transparent 45%,transparent 55%,var(--panel) 100%)}
.itile-h{display:flex;align-items:center;gap:8px}
.itile-h .logo{width:26px;height:26px;border-radius:8px}
.itile-h small{font-size:12px;font-weight:700;color:var(--ink2)}
.itile b{font-size:21px;font-weight:700;margin-top:auto}
.itile-f{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--ink2);margin-top:6px;white-space:nowrap}
:root[data-theme="scuro"] .itile-bg{opacity:.5}
.iriep-h{display:flex;align-items:center;gap:10px}
.iriep-h .logo{width:30px;height:30px;border-radius:9px}
.itile:active{transform:scale(.98)}
/* selettore delle carte: come carte di plastica (chip e riflesso) */
.cardsel{display:flex;align-items:stretch;gap:12px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:5px 5px 8px}
.cardsel::-webkit-scrollbar{display:none}
/* tutte le carte della stessa misura (proporzioni 85,6×54 mm): la selezionata ha il contorno, le altre sono attenuate */
.pcard{flex:0 0 auto;width:calc((100% - 70px) / 2);max-width:250px;aspect-ratio:1.586;position:relative;border-radius:10px;border:none;padding:10px 12px;text-align:left;cursor:pointer;overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.18);opacity:.62;transition:opacity .2s, box-shadow .2s}
.pcard span{position:relative;z-index:1;font-weight:800;font-size:13.5px;letter-spacing:.01em}
.pcard i{position:absolute;left:12px;bottom:11px;width:24px;height:18px;border-radius:4px;background:linear-gradient(135deg,#f7e9b8,#c8a24a 55%,#e8d38b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.38),rgba(255,255,255,0) 42%)}
.pcard:hover{opacity:.85}
.pcard.on{opacity:1;box-shadow:0 8px 22px rgba(0,0,0,.22), 0 0 0 2px var(--bg), 0 0 0 4.5px var(--ink)}
.pcard.oro{background:linear-gradient(135deg,#a77a26,#e7cc78 42%,#c99b3d 68%,#9c6f1f);color:#3a2808}
.pcard.oro i{background:linear-gradient(135deg,#f4f4f4,#b9bdc2 55%,#e6e8ea)}
.pcard.blu{background:linear-gradient(135deg,#051a38,#0b3d7c 58%,#06234a);color:#fff}
.pcard.nero{background:linear-gradient(135deg,#121212,#3b3b3b 60%,#1a1a1a);color:#fff}
.pcard.argento{background:linear-gradient(135deg,#aeb4bb,#f1f3f5 45%,#c2c7cd);color:#1d2022}
.pcard.verde{background:linear-gradient(135deg,#0a4d37,#1f9d6b 60%,#0d6a4a);color:#fff}
.pcard.foto{background-size:cover;background-position:center}
.pcard.foto span,.pcard.foto i{display:none}
.pcard.foto::after{background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}
.pcard-add{flex:0 0 46px;border-radius:10px;border:1.5px dashed var(--ink3);background:none;color:var(--ink2);font-size:22px;cursor:pointer;}
.ord{display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ord span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord.sub{padding-left:20px;font-size:13px;color:var(--ink2);cursor:default;background:var(--sub-bg)}
.ord .btn.sm{padding:5px 10px}
.ord .btn:disabled{opacity:.25}
.acct-n{display:flex;align-items:center;gap:12px;min-width:0}
.acct-n>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-n small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
/* patrimonio: andamento */
.pchart{position:relative;margin-top:12px;min-height:60px}
.pchart svg{display:block;touch-action:pan-y;outline:none}
.pchart .ax{fill:var(--ink3);font-size:10px;font-family:'JetBrains Mono',monospace}
.ptip{position:absolute;display:none;pointer-events:none;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--ink2);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ptip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--ink)}
.ptip .m{color:var(--ink3);margin-bottom:4px}
.pat-delta{display:flex;gap:22px}
.pat-delta small{display:block;color:var(--ink3);font-size:11px;font-weight:600;margin-bottom:3px}
.pat-delta b{font-size:13px}
/* patrimonio: riepilogo con composizione */
.pat-hero{display:grid;gap:16px}
.pat-hero .kpi b{font-size:30px;letter-spacing:-.02em}
.pat-bar{display:flex;gap:3px;height:10px;border-radius:6px;overflow:hidden;background:var(--track)}
.pat-bar div{min-width:4px}
.pat-leg{display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:13px}
.pat-leg div{display:flex;align-items:center;gap:8px}
.pat-leg i{width:9px;height:9px;border-radius:3px;flex:none}
.pat-leg span{flex:1;color:var(--ink2)}
.pat-hero .pat-leg b{font-size:13px;font-weight:600;letter-spacing:0}
.pat-leg em{font-style:normal;font-size:11px;color:var(--ink3);width:34px;text-align:right}
.gh .dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:8px;vertical-align:1px}
.pat-add{margin-top:18px}
.logo{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover;display:block}
.logo.l{font-style:normal;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 6px}
.gh b{font-size:13px} .gh span{font-size:13px;color:var(--ink2)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--acc-dim);color:var(--acc)}
.btn{background:var(--acc);color:var(--on-acc);border:none;border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:none;border:1px solid var(--neg-line);color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:12px;width:auto;border-radius:9px}
.rate{margin-bottom:8px}
.rate .row{margin-bottom:8px}
.rate .row>b{white-space:nowrap}
.inv-r{display:grid;grid-template-columns:1fr 74px 74px 44px;gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px}
.inv-r.h{color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.inv-r div:not(:first-child){text-align:right}
.l1{padding-left:12px;color:var(--ink2)} .l2{padding-left:24px;color:var(--ink3);font-size:11.5px}
/* panoramica: saldo quadrato + rate del mese */
.h-kpi{margin-top:10px}
.k-conti{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.k-conti>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k-n{display:flex;align-items:center;gap:8px;min-width:0}
.k-n .logo{width:22px;height:22px;border-radius:6px;font-size:10px}
.k-n span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-conti .mono{font-size:12px;font-weight:700}
.k-conti small{font-size:10.5px;margin:0}
.k-ring{display:flex;align-items:center;gap:12px;margin-top:10px}
.k-ring svg{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.k-ring>div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink2)}
.k-ring i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
.kpi .k-ring b{font-size:13px;display:inline;color:var(--ink)}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sq{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.sq .io small{margin:6px 0 1px}
.sq .io b{font-size:19px}
.rc{aspect-ratio:1/1;display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer}
.rc>b{font-size:19px}
.rl{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.rl div{display:flex;justify-content:space-between;gap:6px}
.rc .rl b{display:inline;font-size:12px;font-weight:600;white-space:nowrap}
.rl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.rl .ok{color:var(--acc)}
.rc .note{margin-top:auto;padding-top:8px}
.legend .eu{font-size:11px;color:var(--ink2)}
.legend .pc{font-size:10.5px;color:var(--ink3);width:30px;text-align:right}
.pl-bars{display:flex;align-items:center;gap:3px;height:90px;margin-top:10px}
.pl-bars div{flex:1;border-radius:3px;min-height:2px}

/* bottom nav */
/* barra in basso stile iOS: pillola di vetro sospesa sopra il contenuto */
nav{position:fixed;bottom:max(12px, calc(var(--sab) - 6px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:30;
  background:var(--nav-glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--nav-line);border-radius:32px;box-shadow:0 10px 34px rgba(0,0,0,.14), inset 0 1px 0 var(--nav-line);
  display:flex;padding:6px}
nav button{flex:1;background:none;border:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:7px 0 6px;border-radius:26px;cursor:pointer;transition:background .2s}
nav button.on{background:var(--nav-on)}
nav button svg{width:21px;height:21px}
nav button.wide-only{display:none}
/* ordine della barra del telefono: Panoramica, Movimenti, Carte, Rate, Patrimonio, Altro */
nav button[data-t=home]{order:1} nav button[data-t=mov]{order:2} nav button[data-t=carte]{order:3}
nav button[data-t=rate]{order:4} nav button[data-t=pat]{order:5} nav button[data-t=altro]{order:6}
nav button.on{color:var(--acc)}

/* sheet */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + var(--sab))}
.sheet h3{margin:0 44px 14px 0;font-size:17px}
/* croce di chiusura: resta visibile in alto anche scorrendo le finestre lunghe */
.sheet-x{position:sticky;top:0;float:right;margin:-4px -2px 0 8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:2}
.sheet-x:active{transform:scale(.94)}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.amt{font-size:28px;font-weight:700;text-align:center;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:calc(max(12px, calc(var(--sab) - 6px)) + 82px);transform:translateX(-50%);background:var(--acc);color:var(--on-acc);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--ink3);line-height:1.5}
.btn:disabled{opacity:.6}

/* accesso (email/password + passphrase) */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 70% at 50% 0%,var(--gate-glow),var(--bg) 60%);display:none;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--sab))}
.gate.on{display:flex}
.gate-box{width:100%;max-width:340px;text-align:center}
.gate-brand{justify-content:center;font-size:24px;margin-bottom:14px}
.gate-brand i{width:34px;height:34px}
.gate-box .note{margin:0 0 16px}
.gate-box #g-err{margin:12px 0 0}
.gate-box input{text-align:center}
.gate-box .btn{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--ink2)}
.chk input{width:auto}
.sync{width:8px;height:8px;border-radius:50%;display:none;cursor:pointer}
.sync.on{display:block} .sync.ok{background:var(--acc)} .sync.saving{background:var(--warn)} .sync.err{background:var(--neg)}

/* ===== schermo largo: iPad in orizzontale, Mac ===== */
@media (min-width:900px){
  /* due colonne: menu laterale largo quanto la voce più lunga + contenuto. Il menu è nel flusso della pagina,
     quindi il contenuto parte sempre dopo di lui (anche quando il carattere arriva in ritardo e il menu si allarga) */
  body{max-width:none;margin:0;padding:0 0 40px;display:grid;grid-template-columns:max-content minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start}
  .mast,main{max-width:1200px;margin:0 auto;width:100%;grid-column:2;box-sizing:border-box}
  .mast{grid-row:1} main{grid-row:2}
  .mast{padding:16px 28px 12px;border-bottom:none}
  .view{padding:12px 28px 28px}
  nav{position:sticky;grid-column:1;grid-row:1 / span 2;align-self:start;height:100vh;left:auto;top:0;bottom:auto;transform:none;width:max-content;max-width:none;flex-direction:column;gap:4px;border:none;border-radius:0;box-shadow:none;
    padding:calc(22px + var(--sat)) 10px 22px;border-top:none;border-right:1px solid var(--line);background:var(--panel)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px}
  nav button:hover{color:var(--ink2)}
  nav button.on{background:var(--acc-dim);color:var(--acc)}
  nav button svg{width:19px;height:19px}
  nav button.wide-only{display:flex}
  nav button{order:0 !important} /* menu laterale: ordine del codice */
  .fab{right:32px;bottom:32px}
  .toast{left:calc(50% + var(--side,170px) / 2);bottom:32px}
  .ov{align-items:center}
  .sheet{border-radius:22px;max-width:480px;max-height:86vh;padding:22px 22px 24px}
  h2.sec{margin-top:4px}

  /* Panoramica: saldo | rate | liquidità+patrimonio, poi grafici affiancati */
  .home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
  /* righe: saldo · rate · liquidità / uscite per categoria · patrimonio / entrate vs uscite */
  .home{grid-template-areas:"top top liq" "cat cat pat" "bars bars bars"}
  .home .top2{grid-area:top;gap:16px}
  .home .sq,.home .rc{aspect-ratio:auto;min-height:230px}
  .home .sq>div>b{font-size:30px !important}
  .home .sq .io b{font-size:22px}
  .home .h-kpi{display:contents}
  .home .k-liq{grid-area:liq;display:flex;flex-direction:column;justify-content:center}
  .home .k-pat{grid-area:pat;margin-top:29px;display:flex;flex-direction:column;justify-content:center} /* allineata alla scheda sotto il titolo "Uscite per categoria" */
  .home .k-ring svg{width:84px;height:84px}
  .home .h-cat{grid-area:cat}
  .home .h-bars{grid-area:bars}
  .home .h-cat,.home .h-bars{display:flex;flex-direction:column}
  .home .h-cat .card,.home .h-bars .card{flex:1}
  .donut{width:150px;height:150px}
  .home .donut-wrap{gap:32px}
  .home .legend{flex:0 1 380px}
  .narrow-only{display:none}

  /* Movimenti su due colonne, intestazione del giorno a tutta larghezza */
  #mov-list{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  #mov-list .day,#mov-list .empty{grid-column:1/-1}

  /* Mensile: tutti i mesi senza scorrere quando c'è spazio */
  .mx-wrap{max-height:none}
  table.mx{min-width:100%}
  .mx th,.mx td{padding:8px 8px}

  /* Patrimonio: Banche / Cash / Investimenti affiancati */
  /* Patrimonio: riepilogo su due colonne; Banche a sinistra, Cash e Investimenti impilati a destra */
  .pat-hero{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:center;gap:40px;padding:22px 24px}
  .pat-hero .kpi b{font-size:38px}
  .pgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"banche cash" "banche investimenti";grid-template-rows:auto 1fr;column-gap:16px;align-items:start}
  .pg-banche{grid-area:banche} .pg-cash{grid-area:cash} .pg-investimenti{grid-area:investimenti}
  .pgs .gh{margin-top:20px}

  .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .itiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .rgrid .rate{margin:0}
  .rgrid .empty{grid-column:1/-1}
  .inv-r{grid-template-columns:1fr 110px 110px 70px}

<script>

/* ============ CONFIG FIREBASE ============
   Incolla la configurazione web del progetto (Console Firebase → Impostazioni progetto → Le tue app → Web).
   Con apiKey vuota l'app resta solo locale (localStorage). Questi valori non sono segreti:
   l'accesso ai dati lo decidono le regole Firestore (firestore.rules). */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCiItrJc1Waa0q07JPYdPqF0ke-pFLLufA',
  authDomain: 'contabilit-1a500.firebaseapp.com',
  projectId: 'contabilit-1a500',
  appId: '1:771839838672:web:9943e49e505942b400d1d5'
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const CLOUD = !!FIREBASE_CONFIG.apiKey;

/* ============ CIFRATURA ============
   AES-GCM 256 con chiave derivata dalla passphrase (PBKDF2-SHA256).
   Su Firestore arrivano solo iv + testo cifrato: senza passphrase i dati non si leggono. */
const KDF_ITER = 600000;
const CHECK = 'bilancio-ok';
const ENC = new TextEncoder(), DEC = new TextDecoder();
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', ENC.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
// aad lega ogni blocco cifrato alla sua sezione (tx, conti…): non si può scambiarlo con un altro
async function encrypt(key, txt, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:ENC.encode(aad)}, key, ENC.encode(txt));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decrypt(key, o, aad){
  return DEC.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv), additionalData:ENC.encode(aad)}, key, unb64(o.ct)));
}
async function keyOk(key, meta){ try{ return await decrypt(key, meta.check, 'check') === CHECK; }catch(e){ return false; } }

// "Ricorda su questo dispositivo": la chiave (non esportabile) resta in IndexedDB, mai la passphrase
const kdb = {
  open(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('bilancio-keys',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); },
  async get(id){ try{ const db=await this.open(); return await new Promise(ok=>{ const q=db.transaction('k').objectStore('k').get(id); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } },
  async set(id,v){ try{ const db=await this.open(); await new Promise(ok=>{ const t=db.transaction('k','readwrite'), s=t.objectStore('k'); v==null?s.delete(id):s.put(v,id); t.oncomplete=t.onerror=()=>ok(); }); }catch(e){} }
};

/* ============ STORAGE ============
   store.get / store.set: senza Firebase localStorage (come prima); con Firebase
   Firestore in bilancio/{uid}/sez/{tx|conti|rate|inv|trading}, ogni sezione cifrata.
   Salvataggio ottimistico: lo stato in memoria cambia subito, l'invio parte dopo 400 ms
   e solo per le sezioni modificate, con nuovi tentativi se la rete manca. */
const KEY = 'bilancio:v1';
const SEZ = ['tx','conti','rate','inv','trading','carte','servizi','opz','storico','abbo'];
const localStore = {
  get(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
const ts = () => firebase.firestore.FieldValue.serverTimestamp();
const cloud = {
  db:null, user:null, meta:null, key:null, v:null, last:{}, timer:null, rt:null, busy:false, again:false, retry:0, wipeLocal:false,
  ref(){ return this.db.collection('bilancio').doc(this.user.uid); },
  async get(){
    const col = this.ref().collection('sez');
    const snap = await col.get({source:'server'}).catch(()=>col.get());
    const out = buildSeed();
    for(const d of snap.docs) if(SEZ.includes(d.id)) out[d.id] = JSON.parse(await decrypt(this.key, d.data(), d.id));
    SEZ.forEach(k=>this.last[k]=JSON.stringify(out[k]));
    return out;
  },
  set(v){ this.v=v; clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.timer=null; this.flush(); },400); setSync('saving'); },
  dirty(){ return this.key && this.v ? SEZ.map(k=>[k,JSON.stringify(this.v[k])]).filter(([k,j])=>j!==this.last[k]) : []; },
  async flush(){
    if(this.busy){ this.again=true; return; }
    if(!this.key) return;
    this.busy=true; this.again=false;
    let ok=true;
    try{
      const dirty=this.dirty();
      if(dirty.length){
        setSync('saving');
        const b=this.db.batch(), kid=this.meta.salt;
        for(const [k,j] of dirty) b.set(this.ref().collection('sez').doc(k), {kid, ...await encrypt(this.key,j,k), updated:ts()});
        await b.commit();
        dirty.forEach(([k,j])=>this.last[k]=j);
      }
      this.retry=0;
      if(this.wipeLocal){ localStore.clear(); this.wipeLocal=false; }
    }catch(e){ ok=false; this.fail(e); }
    this.busy=false;
    if(this.again) return this.flush();
    if(ok && !this.timer && this.key) setSync('ok');
  },
  fail(e){
    console.error(e);
    if(e.code==='permission-denied') return keyMismatch();
    setSync('err');
    this.retry++; clearTimeout(this.rt);
    this.rt=setTimeout(()=>this.flush(), Math.min(60000, 2000*2**(this.retry-1)));
  },
  // nuova passphrase: nuovo sale, si ricifra tutto in un'unica scrittura atomica
  async rekey(pass){
    while(this.busy) await new Promise(r=>setTimeout(r,100));
    clearTimeout(this.timer); this.timer=null; this.busy=true;
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey(pass,salt,KDF_ITER);
      const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
      const b=this.db.batch(), last={};
      b.set(this.ref(), {...meta, updated:ts()}, {merge:true});
      for(const k of SEZ){ last[k]=JSON.stringify(S[k]??[]); b.set(this.ref().collection('sez').doc(k), {kid:meta.salt, ...await encrypt(key,last[k],k), updated:ts()}); }
      await b.commit();
      const kept = await kdb.get(this.user.uid);
      Object.assign(this, {key, meta, last, v:S});
      if(kept) await kdb.set(this.user.uid, {key, salt:meta.salt});
    }finally{ this.busy=false; if(this.again) this.flush(); }
  }
};

/* ============ UTILS ============ */
const eur = (v,d=2) => (v<0?'-':'') + Math.abs(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'}) + ' €';

const $ = id => document.getElementById(id);

/* ---- Rate: piano di pagamento ----
   {id, tipo, prod, acq, tot, n, rata, pre, done, first, fi, conto}
   n rate mensili da `rata` € (l'ultima assorbe gli arrotondamenti); pre = già pagate prima di
   inserirla, done = pagate dall'app. La rata i (0…n-1) scade il giorno first + (i - fi) mesi. */
const round2 = v => Math.round(v*100)/100;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
function addMonths(s, k){
  const [y,m,d] = s.split('-').map(Number), t = new Date(y, m-1+k, 1);
  t.setDate(Math.min(d, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate())); // 31 gen + 1 mese = 28/29 feb
  return ymd(t);
}
const fmtD = s => `${+s.slice(8,10)} ${M3[+s.slice(5,7)-1].toLowerCase()} ${s.slice(0,4)}`;
const dueDate = (r,i) => r.first ? addMonths(r.first, i - r.fi) : null;
const quota = (r,i) => i===r.n-1 ? round2(r.tot - r.rata*(r.n-1)) : r.rata;
const pagate = r => Math.min(r.n, r.pre + r.done);
// quota di capitale della rata i per un acquisto registrato nei movimenti (r.imp = importo dell'acquisto)
const capRata = (r,i) => { const imp = r.imp ?? r.tot; return i===r.n-1 ? round2(imp - round2(imp/r.n)*(r.n-1)) : round2(imp/r.n); };
const residue = r => r.n - pagate(r);
const daPagare = r => round2(sum(Array.from({length:residue(r)}, (_,j)=>quota(r, pagate(r)+j))));
const contoName = id => (S.conti.find(c=>c.id===id)||{}).n || '';
const carte = () => S.carte || [];
const cartaName = id => (carte().find(c=>c.id===id)||{}).n || '';
const daDove = o => o.carta ? cartaName(o.carta) : contoName(o.conto); // "Pagata da" di una rata o di un movimento
const servizi = () => S.servizi || [];
// rate con scadenza nel mese ym ('YYYY-MM'), pagate o no
function rateDelMese(ym){
  const out = [];
  S.rate.forEach(r=>{
    if(!r.first){ if(residue(r)) out.push({r, amt:r.rata, paid:false}); return; } // senza data: la conto da pagare
    for(let i=r.pre; i<r.n; i++){
      const d = dueDate(r,i), m = d.slice(0,7);
      if(m>ym) break;
      if(m===ym) out.push({r, i, d, amt:quota(r,i), paid:i<pagate(r)});
    }
  });
  // rate PagoFlex addebitate con l'estratto conto della carta
  carte().forEach(c=>(c.flex||[]).forEach(f=>{ for(let i=0;i<f.n;i++){ const d=stmtDate(c, addYM(f.m0,i)); if(d.slice(0,7)===ym) out.push({r:{tipo:pfNome(c)}, i, d, amt:pfRata(f,i), paid:i<f.done}); } }));
  return out;
}
// vecchio formato {tipo, prod, rata, res} → piano senza data (va completato con Modifica)
function migrateRata(r){
  if(r.n!=null) return r;
  const res = Math.max(0, r.res||0);
  return {id:r.id||uid(), tipo:r.tipo||'', prod:r.prod==='-'?'':(r.prod||''), acq:null, tot:round2((r.rata||0)*res), n:res, rata:r.rata||0, pre:0, done:0, first:null, fi:0, conto:''};
}
// paga le rate scadute (oggi compreso): uscita nei movimenti, importo tolto dal conto, rata segnata pagata.
// L'id del movimento è fisso per rata, così due dispositivi non la registrano due volte.
function payDueRate(){
  const t = today(); let k = 0;
  S.rate.forEach(r=>{
    while(r.first && pagate(r)<r.n){
      const i = pagate(r), d = dueDate(r,i);
      if(d>t) break;
      const id = `rt_${r.id}_${i}`, amt = quota(r,i);
      if(!S.tx.some(x=>x.id===id)){
        // pagata con carta: diventa una spesa della carta e lascia il conto con l'estratto conto.
        // Rata di un acquisto già registrato nei movimenti (r.tx): è solo un pagamento (t:'r'), la spesa c'è già;
        // gli eventuali interessi (totale da rimborsare − importo) diventano una spesa a parte.
        S.tx.push({id, d, t:r.tx?'r':'u', cat:'Rate', sub:r.tipo||'Rate', amt, note:`${r.prod||r.tipo} · rata ${i+1}/${r.n}`, rid:r.id, conto:r.carta?'':(r.conto||''), carta:r.carta||''});
        const c = !r.carta && S.conti.find(c=>c.id===r.conto); if(c) c.v = round2(c.v - amt);
        const int = r.tx ? round2(amt - capRata(r,i)) : 0;
        if(int>0) S.tx.push({id:`rti_${r.id}_${i}`, d, t:'u', cat:'Rate', sub:'Interessi '+(r.tipo||''), amt:int, note:`${r.prod||r.tipo} · rata ${i+1}/${r.n}`, rid:r.id, int:1});
      }
      r.done++; k++;
    }
  });
  if(k){ save(); toast(k===1 ? '1 rata pagata in automatico' : `${k} rate pagate in automatico`); }
  return k;
}
/* ---- Carte di credito ----
   {id, n, plafond, tipo:'giorno'|'fine', giorno, conto, pf, pfMin, pfComm, dal, flex:[], es:[]}
   Le spese con carta sono movimenti con `carta`. Il ciclo è il mese della spesa: con tipo 'giorno'
   si addebita il `giorno` del mese dopo, con 'fine' l'ultimo giorno dello stesso mese.
   `dal` = primo mese gestito dall'app (i mesi prima si considerano già addebitati fuori dall'app).
   PagoFlex {id, tx, desc, imp, n, comm, m0, done}: la spesa tx esce dall'estratto conto e la rata i
   (capitale + commissione mensile comm% sull'importo) si addebita con l'estratto del mese m0 + i.
   es = estratti conto già addebitati {m, d, spese, pf, tot}. */
const addYM = (ym,k) => addMonths(ym+'-01',k).slice(0,7);
const lastDay = ym => ymd(new Date(+ym.slice(0,4), +ym.slice(5,7), 0));
const stmtDate = (c,ym) => c.tipo==='fine' ? lastDay(ym) : addMonths(ym+'-'+String(Math.min(c.giorno||10,28)).padStart(2,'0'), 1);
const pfCap = (f,i) => i===f.n-1 ? round2(f.imp - round2(f.imp/f.n)*(f.n-1)) : round2(f.imp/f.n);
// rateizzazione per carta: ING "PagoFlex" con commissione % al mese sull'importo,
// BBVA "Rimborso rateale" con commissione fissa in € per tutto il piano, divisa sulle rate
const pfNome = c => c.pfNome || (/bbva/i.test(c.n) ? 'Rimborso rateale' : 'PagoFlex');
const pfEur = c => (c.pfCommTipo || (/bbva/i.test(c.n) ? 'eur' : 'perc')) === 'eur';
const pfFee = (f,i) => f.commTipo==='eur'
  ? (i===f.n-1 ? round2((f.comm||0) - round2((f.comm||0)/f.n)*(f.n-1)) : round2((f.comm||0)/f.n))
  : round2(f.imp*(f.comm||0)/100);
const pfCosto = f => f.commTipo==='eur' ? round2(f.comm||0) : round2(f.imp*(f.comm||0)/100*f.n);
const pfRata = (f,i) => round2(pfCap(f,i) + pfFee(f,i));
const pfResiduo = f => round2(sum(Array.from({length:f.n-f.done}, (_,j)=>pfCap(f, f.done+j))));
const settled = (c,ym) => ym < c.dal || (c.es||[]).some(e=>e.m===ym);
// spese della carta nel ciclo ym (escluse quelle passate a PagoFlex)
const cartaSpese = (c,ym) => S.tx.filter(t=>t.carta===c.id && !t.pf && t.d.slice(0,7)===ym);
const mdiff = (a,b) => (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7)); // mesi da a a b ('YYYY-MM')
// rate PagoFlex che cadono nel ciclo ym
const pfDelCiclo = (c,ym) => (c.flex||[]).map(f=>({f, i:mdiff(f.m0,ym)})).filter(x=>x.i>=0 && x.i<x.f.n);
// cicli non ancora addebitati che hanno qualcosa da addebitare, dal più vecchio
function cicliAperti(c){
  const m = new Set();
  S.tx.forEach(t=>{ if(t.carta===c.id && !t.pf) m.add(t.d.slice(0,7)); });
  (c.flex||[]).forEach(f=>{ for(let i=f.done;i<f.n;i++) m.add(addYM(f.m0,i)); });
  return [...m].filter(ym=>!settled(c,ym)).sort();
}
const cicloTot = (c,ym) => round2(sum(cartaSpese(c,ym).map(t=>t.amt)) + sum(pfDelCiclo(c,ym).map(x=>pfRata(x.f,x.i))));
// plafond impegnato: spese non ancora addebitate + capitale PagoFlex ancora da restituire
function plafondUsato(c){
  const spese = sum(cicliAperti(c).map(ym=>sum(cartaSpese(c,ym).map(t=>t.amt))));
  return round2(spese + sum((c.flex||[]).map(pfResiduo)));
}
// addebito automatico degli estratti conto scaduti (giorno di addebito compreso)
function settleCards(){
  const t = today(); let k = 0;
  carte().forEach(c=>{
    c.es = c.es || [];
    for(const ym of cicliAperti(c)){
      const d = stmtDate(c, ym); if(d>t) break;
      const spese = round2(sum(cartaSpese(c,ym).map(x=>x.amt))), rate = pfDelCiclo(c,ym).filter(x=>x.i===x.f.done);
      const pf = round2(sum(rate.map(x=>pfRata(x.f,x.i))));
      rate.forEach(({f,i})=>{
        const fee = pfFee(f,i), id = `pfc_${f.id}_${i}`;
        if(fee && !S.tx.some(x=>x.id===id)) S.tx.push({id, d, t:'u', cat:'Carte', sub:'Commissioni '+pfNome(c), amt:fee, note:`${f.desc} · rata ${i+1}/${f.n}`});
        f.done++;
      });
      const tot = round2(spese+pf), conto = S.conti.find(x=>x.id===c.conto);
      if(conto) conto.v = round2(conto.v - tot);
      c.es.push({m:ym, d, spese, pf, tot, conto:c.conto||''});
      k++;
    }
  });
  if(k){ save(); toast(k===1 ? 'Addebitato 1 estratto conto della carta' : `Addebitati ${k} estratti conto delle carte`); }
  return k;
}
function seedCarte(){

  return [

    {id:'bbva', n:'BBVA', plafond:1000, tipo:'fine', giorno:10, conto:find(/bbva/i), pf:true, pfNome:'Rimborso rateale', pfCommTipo:'eur', pfMin:50, pfComm:0, dal:thisMonth(), flex:[], es:[]}
  ];

// conti con carta di debito/prepagata: se mancano li creo una volta sola (saldo 0, da compilare in Patrimonio)
const CONTI_BASE = [['ING',/\bing\b/i],['BBVA',/bbva/i],['N26',/n26/i],['Buddy Bank',/buddy/i],['Wise',/wise/i]];
function seedConti(){

  carte().forEach(k=>{ if(!k.conto){ const m = CONTI_BASE.find(([n,re])=>re.test(k.n)); const c = m && S.conti.find(c=>m[1].test(c.n)); if(c) k.conto=c.id; } });
}
/* Metodo di pagamento di una spesa:
   carta di credito → t.carta (lascia il conto con l'estratto conto)
   carta di debito/prepagata → t.pag='carta', t.conto  |  conto (bonifico, bollettino) → t.pag='conto', t.conto
   contanti → t.pag='contanti', t.conto (conto del gruppo Cash). Con pag l'importo esce subito dal conto. */
const hasCredito = contoId => carte().some(k=>k.conto===contoId);
const debitoName = c => (hasCredito(c.id) ? 'Carta di debito ' : 'Carta ') + c.n;
function pagLabel(t){
  if(t.carta) return 'Carta di credito '+cartaName(t.carta);
  const c = S.conti.find(x=>x.id===t.conto);
  if(!c || !t.pag) return '';
  return t.pag==='carta' ? debitoName(c) : t.pag==='conto' ? 'Conto '+c.n : 'Contanti';
}
const pagValue = t => t.carta ? 'k:'+t.carta : t.pag && t.conto ? `${t.pag==='conto'?'c':t.pag==='contanti'?'x':'d'}:${t.conto}` : '';
function pagOptions(sel){
  const opt = (v,l) => `<option value="${v}" ${v===sel?'selected':''}>${esc(l)}</option>`;
  const banche = S.conti.filter(c=>c.g==='Banche'), cash = S.conti.filter(c=>c.g==='Cash');
  return opt('','Non specificato') +
    (carte().length ? `<optgroup label="Carte di credito">${carte().map(k=>opt('k:'+k.id,'Carta di credito '+k.n)).join('')}</optgroup>` : '') +
    (banche.length ? `<optgroup label="Carte di debito e prepagate">${banche.map(c=>opt('d:'+c.id, debitoName(c))).join('')}</optgroup>
      <optgroup label="Dal conto (bonifico, bollettino…)">${banche.map(c=>opt('c:'+c.id, 'Conto '+c.n)).join('')}</optgroup>` : '') +
    (cash.length ? `<optgroup label="Contanti">${cash.map(c=>opt('x:'+c.id, 'Contanti · '+c.n)).join('')}</optgroup>` : '');
}
function pagParse(v){
  const [k,id] = v.split(':');
  return k==='k' ? {carta:id, pag:'', conto:''} : id ? {carta:'', pag:{d:'carta',c:'conto',x:'contanti'}[k], conto:id} : {carta:'', pag:'', conto:''};
}
// effetto di una spesa sul saldo del conto (sign -1 per annullarlo)
function applyPag(t, sign=1){
  if(!t || !t.pag || !t.conto) return;
  const c = S.conti.find(x=>x.id===t.conto); if(c) c.v = round2(c.v - sign*(t.t==='e'?-1:1)*t.amt);
}
/* ---- Storico del patrimonio: una "foto" per mese ----
   {m:'YYYY-MM', d (giorno in cui è stata scattata), tot, g:{Banche,Cash,Investimenti}, conti:[{n,g,v}], tipo}
   tipo 'fine' = ultimo giorno del mese · 'tardi' = alla prima apertura dopo, con i saldi riportati
   a fine mese · 'ora' = salvata a mano durante il mese · 'inserito' = mese passato inserito a mano o da CSV
   (mai sovrascritto in automatico). */
const GRUPPI = ['Banche','Cash','Investimenti'];
// saldi dei conti a una data passata: tolgo gli effetti registrati dall'app dopo quella data
function contiAl(data){
  const v = new Map(S.conti.map(c=>[c.id, c.v]));
  const add = (id, x) => { if(v.has(id)) v.set(id, round2(v.get(id) + x)); };
  S.tx.forEach(t=>{
    if(t.d<=data) return;
    if(t.pag && t.conto) add(t.conto, t.t==='u' ? t.amt : -t.amt);   // debito, conto, contanti
    else if(t.rid && t.conto && !t.carta) add(t.conto, t.amt);        // rata pagata dal conto
  });
  carte().forEach(c=>(c.es||[]).forEach(e=>{ if(e.d>data && e.conto) add(e.conto, e.tot); })); // estratti conto
  return S.conti.map(c=>({n:c.n, g:c.g, v:v.get(c.id)}));
}
function fotoPatr(m, d, tipo, conti){
  const g = {}; GRUPPI.forEach(k=>g[k] = round2(sum(conti.filter(c=>c.g===k).map(c=>c.v))));
  return {m, d, tot:round2(sum(conti.map(c=>c.v))), g, conti, tipo};
}
function putFoto(f){ S.storico = S.storico.filter(x=>x.m!==f.m).concat(f).sort((a,b)=>a.m.localeCompare(b.m)); }
// a ogni controllo: l'ultimo giorno del mese aggiorno la foto del mese; dopo, se manca, la scatto "in ritardo"
function autoStorico(){
  if(!S.storico) S.storico = [];
  if(!S.opz) S.opz = {};
  // lo storico automatico parte dal mese in cui l'app comincia a seguirlo: per i mesi prima non conosce i movimenti
  if(!S.opz.storicoDal){ S.opz.storicoDal = thisMonth(); save(); }
  const t = today(), m = t.slice(0,7), prev = addYM(m,-1), get = x => S.storico.find(f=>f.m===x);
  let f = null;
  if(t===lastDay(m) && (get(m)||{}).tipo!=='inserito') f = fotoPatr(m, t, 'fine', S.conti.map(c=>({n:c.n, g:c.g, v:c.v})));
  else if(!get(prev) && prev>=S.opz.storicoDal && S.conti.length) f = fotoPatr(prev, t, 'tardi', contiAl(lastDay(prev)));
  if(!f) return 0;
  const old = get(f.m);
  if(old && JSON.stringify({...old, d:0}) === JSON.stringify({...f, d:0})) return 0;
  putFoto(f); save();
  return 1;
}
/* ---- Abbonamenti e servizi ricorrenti ----
   {id, n, costo, freq (mesi: 1, 2, 3, 6, 12), next:'YYYY-MM-DD' (prossima scadenza), pag ('k:carta'|'d:conto'|'c:conto'|'x:cash'|''),
    cat, attivo}. Alla scadenza diventa un'uscita (cat › nome) pagata con `pag` e la scadenza avanza di freq mesi. */
const FREQ = [[1,'Mensile'],[2,'Bimestrale'],[3,'Trimestrale'],[6,'Semestrale'],[12,'Annuale']];
const freqName = f => (FREQ.find(x=>x[0]===f)||[0,f+' mesi'])[1];
const abbo = () => S.abbo || [];
const abboMese = a => round2(a.costo/a.freq);
function payAbbo(){
  const t = today(); let k = 0;
  abbo().forEach(a=>{
    while(a.attivo!==false && a.next && a.next<=t){
      const id = `ab_${a.id}_${a.next}`;
      if(!S.tx.some(x=>x.id===id)){
        const tx = {id, d:a.next, t:'u', cat:a.cat||'Ricorrenti', sub:a.n, amt:a.costo, note:freqName(a.freq), abid:a.id, ...pagParse(a.pag||'')};
        S.tx.push(tx); applyPag(tx);
      }
      a.next = addMonths(a.next, a.freq); k++;
    }
  });
  if(k){ save(); toast(k===1 ? '1 abbonamento registrato in automatico' : `${k} abbonamenti registrati in automatico`); }
  return k;
}
// dopo ogni caricamento dei dati (avvio, sblocco, backup importato, ritorno in primo piano)
function afterLoad(){
  S.rate = S.rate.map(migrateRata);
  if(!S.opz) S.opz = {};
  if(!S.opz.contiBase){ seedConti(); S.opz.contiBase = true; save(); }
  if(!S.carte){ S.carte = seedCarte(); seedConti(); }
  if(!S.opz.bbvaRateale){
    const b = S.carte.find(c=>/bbva/i.test(c.n));
    if(b) Object.assign(b, {pf:true, pfNome:'Rimborso rateale', pfCommTipo:'eur', pfMin:50, pfComm:b.pfCommTipo==='eur' ? b.pfComm : 0});
    S.opz.bbvaRateale = true; save();
  }
  if(!S.servizi) S.servizi = ['PayPal','Klarna','Scalapay','Findomestic','Compass'];
  S.rate.forEach(r=>{ if(r.tipo && !S.servizi.includes(r.tipo)) S.servizi.push(r.tipo); });
  if(!S.abbo) S.abbo = [];
  S.inv.forEach(r=>{ if(!r.id) r.id = uid(); });
  if(!S.opz.invTipi){ seedInvTipi(); S.opz.invTipi = true; save(); }
  if(!S.opz.invIbks){ unisciIbks(); S.opz.invIbks = true; save(); }
  if(!S.opz.invGruppi){ invGruppi(); S.opz.invGruppi = true; save(); }
  payDueRate(); payAbbo(); settleCards(); autoStorico();
}

function donut(data){
  const tot = sum(data.map(d=>d[1])) || 1; const R=48, C=2*Math.PI*R; let off=0;
  const arcs = data.map(([k,v],i)=>{ const len=v/tot*C; const s=`<circle cx="64" cy="64" r="${R}" fill="none" stroke="${k==='Altre'&&i===PAL.length-1?'#9a9f9c':PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off+=len; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" fill="none" style="stroke:var(--panel2)" stroke-width="16"/>${arcs}</svg><div class="c"><div><b class="mono">${eur0(tot)}</b>uscite</div></div></div>`;
}

// conti da mostrare in Panoramica: i saldi di oggi, o per un mese passato la foto dello storico del patrimonio
// (con "Anno" su un anno passato l'ultima foto di quell'anno); null = mese passato senza foto
function contiVista(){
  const cur = thisMonth(), ym = ui.month==='all' ? (ui.year < now.getFullYear() ? `${ui.year}-12` : cur) : `${ui.year}-${String(ui.month+1).padStart(2,'0')}`;
  const tot = conti => ({conti, patr:sum(conti.map(c=>c.v)), liq:sum(conti.filter(c=>c.g!=='Investimenti').map(c=>c.v))});
  if(ym >= cur) return {...tot(S.conti), nota:''};
  const f = ui.month==='all' ? [...S.storico].reverse().find(x=>x.m.slice(0,4)===String(ui.year)) : S.storico.find(x=>x.m===ym);
  if(!f) return null;
  const nota = 'al '+fmtD(f.d && f.d.slice(0,7)===f.m ? f.d : lastDay(f.m));
  // foto inserita solo con i totali per gruppo (a mano o da CSV): niente elenco dei conti
  return (f.conti||[]).length ? {...tot(f.conti), nota} : {conti:[], patr:f.tot, liq:round2((f.g.Banche||0)+(f.g.Cash||0)), nota};
}
// Liquidità con i conti principali, Patrimonio con l'anello liquidità / investito

  const pl = patr>0 ? Math.min(1, Math.max(0, liq/patr)) : 0, R = 26, C = 2*Math.PI*R;

      <div class="k-conti">${top.map(c=>`<div><span class="k-n">${contoIcon(c)}<span>${esc(c.n)}</span></span><span class="mono">${eurI(c.v)}</span></div>`).join('')

          <circle cx="32" cy="32" r="${R}" fill="none" style="stroke:var(--blue)" stroke-width="9"/>
          <circle cx="32" cy="32" r="${R}" fill="none" style="stroke:var(--acc)" stroke-width="9" stroke-dasharray="${pl*C} ${C-pl*C}"/></svg>

// spese fisse del mese ym (abbonamenti, bollo, assicurazione…): pagate = già registrate, da pagare = scadenze future
function abboDelMese(ym){
  const out = S.tx.filter(t=>t.abid && t.d.slice(0,7)===ym).map(t=>({a:abbo().find(a=>a.id===t.abid)||{n:t.sub, freq:1}, d:t.d, amt:t.amt, paid:true}));
  abbo().forEach(a=>{ if(a.attivo===false || !a.next) return;
    for(let d=a.next; d.slice(0,7)<=ym; d=addMonths(d, a.freq>0 ? a.freq : 1)) if(d.slice(0,7)===ym) out.push({a, d, amt:a.costo, paid:false}); });
  return out;
}
// mese mostrato in Panoramica (con "Anno" il mese corrente)
const meseVista = () => ui.month==='all' ? thisMonth() : `${ui.year}-${String(ui.month+1).padStart(2,'0')}`;
// da pagare nel mese scelto: rate per metodo (PayPal, Klarna…), abbonamenti mensili insieme, le altre spese fisse una per una
function rateCard(){
  const ym = meseVista();
  const list = [...rateDelMese(ym).map(x=>({...x, k:x.r.tipo||'Altro'})),
    ...abboDelMese(ym).map(x=>({...x, k:x.a.freq===1 ? 'Abbonamenti' : x.a.n})),
    ...bordoDelMese(ym).map(x=>({...x, k:x.n, amt:x.amt||0, ign:x.amt==null}))];
  const by = new Map();
  list.forEach(x=>{ const g=by.get(x.k)||{due:0,paid:0}; g[x.paid?'paid':'due']+=x.amt; if(x.ign && !x.paid) g.ign=true; by.set(x.k,g); });
  const groups = [...by.entries()].sort((a,b)=>(b[1].due-a[1].due) || (b[1].paid-a[1].paid)); // prima quelle da pagare
  const due = sum(list.filter(x=>!x.paid).map(x=>x.amt)), paid = sum(list.filter(x=>x.paid).map(x=>x.amt));
  const rows = WIDE.matches ? 8 : paid ? 3 : 4, MAX = groups.length>rows ? rows-1 : rows; // righe che stanno nel quadrato
  const amt = (v, ign) => v ? `<b class="mono">${eur(v)}${ign?' + ?':''}</b>` : ign ? `<b class="mono mut">?</b>` : `<b class="ok">✓</b>`;
  const lines = groups.slice(0,MAX).map(([k,g])=>`<div><span>${esc(k)}</span>${amt(g.due, g.ign)}</div>`).join('')
    + (groups.length>MAX ? `<div><span>+ altri ${groups.length-MAX}</span>${amt(sum(groups.slice(MAX).map(([k,g])=>g.due)))}</div>` : '');
  return `<div class="card kpi rc" onclick="showTab('rate')"><small>Da pagare · ${M3[+ym.slice(5)-1]}${ym.slice(0,4)!=now.getFullYear()?' '+ym.slice(0,4):''}</small>
    ${list.length ? `<b class="mono ${due?'neg':'pos'}">${due?eur(due):'Tutto pagato'}</b><div class="rl">${lines}</div>
      ${paid?`<div class="note">Già pagato ${eur(paid)}</div>`:''}` : `<div class="empty" style="padding:18px 0 0">Niente da pagare a ${MESI[+ym.slice(5)-1].toLowerCase()}</div>`}</div>`;
}

function renderMx(){
  const tipo = ui.mxTipo;
  const tx = S.tx.filter(t=>t.t===tipo && txYear(t)===ui.year);
  const cats = new Map();
  tx.forEach(t=>{
    if(!cats.has(t.cat)) cats.set(t.cat,{m:Array(12).fill(0),subs:new Map()});
    const c = cats.get(t.cat); c.m[txMonth(t)]+=t.amt;
    const sk = t.sub||'—';
    if(!c.subs.has(sk)) c.subs.set(sk,Array(12).fill(0));
    c.subs.get(sk)[txMonth(t)]+=t.amt;
  });
  const pers = (S.opz||{}).mxSort==='pers', ord = mxOrdine(tipo);
  const order = ordina([...cats.entries()], pers ? ord.cats : [], v=>sum(v.m));
  const fmt = eurI;
  const cell = v => `<td class="mono${v?'':' z'}">${fmt(v)}</td>`;
  const tot = Array(12).fill(0); order.forEach(([k,c])=>c.m.forEach((v,i)=>tot[i]+=v));
  // tocco su una cella: i movimenti di quella categoria/voce nel mese (o nell'anno), da modificare o aggiungere
  mxRighe = []; let rows='';
  const riga = (cls, nome, m, cat, sub) => { const r = mxRighe.push({cat, sub}) - 1;
    return `<tr class="${cls}"><td onclick="mxCella(${r},-1)">${esc(nome)}</td>${m.map((v,i)=>cell(v).replace('<td ',`<td onclick="mxCella(${r},${i})" `)).join('')}<td class="mono t" onclick="mxCella(${r},-1)">${fmt(sum(m))}</td></tr>`; };
  order.forEach(([k,c])=>{
    rows += riga('grp', k, c.m, k, null);
    if(c.subs.size>1 || ![...c.subs.keys()].includes('—'))
      ordina([...c.subs.entries()], pers ? ord.subs[k]||[] : [], sum).forEach(([s,m])=>{ rows += riga('sub', s, m, k, s); });
  });
  $('v-mx').innerHTML = (WIDE.matches ? '' : altroSeg('mx')) + `
    <div class="seg" style="margin-bottom:12px">
      <button class="u ${tipo==='u'?'on':''}" onclick="ui.mxTipo='u';render()">Uscite</button>
      <button class="e ${tipo==='e'?'on':''}" onclick="ui.mxTipo='e';render()">Entrate</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div class="chips" style="margin:0"><button class="chip ${pers?'':'on'}" onclick="setMxSort('importo')">Per importo</button><button class="chip ${pers?'on':''}" onclick="setMxSort('pers')">Personalizzato</button></div>
      <button class="btn sm ghost" onclick="openOrdine()">↕ Ordina</button></div>
    <div class="mx-wrap"><table class="mx">
      <tr><th>${tipo==='u'?'Uscite':'Entrate'} ${ui.year}</th>${M3.map(m=>`<th>${m}</th>`).join('')}<th>Totale</th></tr>
      <tr class="tot"><td>Totale mese</td>${tot.map(cell).join('')}<td class="mono t">${fmt(sum(tot))}</td></tr>
      ${rows || '<tr><td colspan="14" class="empty">Nessun dato per questo anno</td></tr>'}
    </table></div>
    <p class="note" style="margin-top:12px">Stessa logica del tuo foglio: macro-categoria, sottovoci e mesi in colonna. Tocca una cella per vedere, modificare o aggiungere i movimenti; + per una nuova ${tipo==='u'?'uscita':'entrata'}. <span class="narrow-only">Scorri a destra per vedere tutti i mesi.</span></p>`;
}
let mxRighe = [];
function mxCella(r, m){
  const {cat, sub} = mxRighe[r], tipo = ui.mxTipo;
  const list = S.tx.filter(t=>t.t===tipo && t.cat===cat && (sub==null || (t.sub||'—')===sub) && txYear(t)===ui.year && (m<0 || txMonth(t)===m))
    .sort((a,b)=>b.d.localeCompare(a.d));
  const oggi = today(), d = m<0 ? (ui.year===now.getFullYear() ? oggi : `${ui.year}-01-01`)
    : (ui.year===now.getFullYear() && m===now.getMonth() ? oggi : `${ui.year}-${String(m+1).padStart(2,'0')}-01`);
  const pre = JSON.stringify({t:tipo, cat, sub: sub && sub!=='—' ? sub : '', d}).replace(/"/g,'&quot;');
  sheet(`<h3>${esc(cat)}${sub && sub!=='—' ? ' · '+esc(sub) : ''}</h3>
    <p class="note" style="margin:-6px 0 12px">${tipo==='u'?'Uscite':'Entrate'} · ${m<0 ? ui.year : MESI[m]+' '+ui.year} · <b class="mono" style="color:var(--ink)">${eur(sum(list.map(t=>t.amt)))}</b></p>
    ${list.map(t=>`<div class="tx" onclick="openTx('${t.id}')"><div class="mid"><b>${esc(t.sub||t.cat)}</b><small>${esc([fmtD(t.d), t.note.startsWith('Totale mensile')?'':t.note, pagLabel(t)].filter(Boolean).join(' · '))}</small></div>
      <b class="mono ${t.t==='e'?'pos':''}">${t.t==='e'?'+':'-'}${eur(t.amt)}</b></div>`).join('') || '<div class="empty">Nessun movimento.</div>'}
    <button class="btn" style="margin-top:12px" onclick="openTx('', '', ${pre})">+ Aggiungi ${tipo==='u'?'uscita':'entrata'}</button>`);
}

/* ---- Ordine personalizzato delle categorie (Mensile) ----
   S.opz.ordine = {u:{cats:[...], subs:{cat:[...]}}, e:{...}}, S.opz.mxSort = 'importo' | 'pers'.
   Le categorie nuove, non ancora nell'elenco, vanno in fondo per importo. */
const mxOrdine = tipo => ((S.opz||{}).ordine||{})[tipo] || {cats:[], subs:{}};
function ordina(list, custom, tot){
  const i = n => { const k = custom.indexOf(n); return k<0 ? Infinity : k; };
  return list.sort((a,b)=> (i(a[0])-i(b[0])) || (tot(b[1])-tot(a[1])));
}
function setMxSort(v){
  S.opz.mxSort = v; save();
  if(v==='pers' && !mxOrdine(ui.mxTipo).cats.length) return openOrdine();
  render();
}
let ordDraft = null;
function openOrdine(){
  const tipo = ui.mxTipo, o = mxOrdine(tipo), all = S.tx.filter(t=>t.t===tipo);
  const totC = new Map(), totS = new Map();
  all.forEach(t=>{ totC.set(t.cat,(totC.get(t.cat)||0)+t.amt); if(t.sub){ const k=t.cat+'\u0000'+t.sub; totS.set(k,(totS.get(k)||0)+t.amt); } });
  const m = catMap(tipo);
  // parto dall'ordine salvato e aggiungo in fondo, per importo, quello che non c'è ancora
  const merge = (saved, names, t) => [...saved.filter(n=>names.includes(n)), ...names.filter(n=>!saved.includes(n)).sort((a,b)=>(t(b)||0)-(t(a)||0))];
  const cats = merge(o.cats, [...m.keys()], c=>totC.get(c));
  const subs = {}; cats.forEach(c=>subs[c] = merge(o.subs[c]||[], [...m.get(c)], s=>totS.get(c+'\u0000'+s)));
  ordDraft = {tipo, cats, subs, open:-1};
  drawOrdine();
}
function drawOrdine(){
  const d = ordDraft, top = $('ov').classList.contains('on') ? $('sheet').scrollTop : 0;
  const btns = (k, ci, i, n) => `<button class="btn sm ghost" ${i===0?'disabled':''} onclick="event.stopPropagation();mvOrd('${k}',${ci},${i},-1)" aria-label="Su">▲</button><button class="btn sm ghost" ${i===n-1?'disabled':''} onclick="event.stopPropagation();mvOrd('${k}',${ci},${i},1)" aria-label="Giù">▼</button>`;
  sheet(`<h3>Ordine delle ${d.tipo==='u'?'uscite':'entrate'}</h3>
    <p class="note" style="margin:-6px 0 10px">Sposta le categorie con ▲▼. Tocca una categoria per ordinare le sue voci.</p>
    ${d.cats.map((c,ci)=>`<div class="ord" onclick="ordDraft.open=ordDraft.open===${ci}?-1:${ci};drawOrdine()"><span><b>${esc(c)}</b>${d.subs[c].length?` <small class="mut">${d.open===ci?'▾':'▸'} ${d.subs[c].length} ${d.subs[c].length===1?'voce':'voci'}</small>`:''}</span>${btns('c',ci,ci,d.cats.length)}</div>
      ${d.open===ci ? d.subs[c].map((s,i)=>`<div class="ord sub"><span>${esc(s)}</span>${btns('s',ci,i,d.subs[c].length)}</div>`).join('') : ''}`).join('') || '<div class="empty">Nessuna categoria</div>'}
    <button class="btn" style="margin-top:14px" onclick="saveOrdine()">Salva ordine</button>
    <button class="btn ghost" style="margin-top:8px" onclick="if(confirm('Tornare all\\'ordine per importo?')){ delete (S.opz.ordine||{})[ordDraft.tipo]; S.opz.mxSort='importo'; save(); closeSheet(); render(); }">Ripristina ordine per importo</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
  $('sheet').scrollTop = top;
}
function mvOrd(k, ci, i, dir){
  const a = k==='c' ? ordDraft.cats : ordDraft.subs[ordDraft.cats[ci]], j = i+dir;
  if(j<0 || j>=a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  if(k==='c' && ordDraft.open===i) ordDraft.open = j; else if(k==='c' && ordDraft.open===j) ordDraft.open = i;
  drawOrdine();
}
function saveOrdine(){
  if(!S.opz.ordine) S.opz.ordine = {};
  S.opz.ordine[ordDraft.tipo] = {cats:ordDraft.cats, subs:ordDraft.subs};
  S.opz.mxSort = 'pers'; save(); closeSheet(); render(); toast('Ordine salvato');
}
