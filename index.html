<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bilancio — Finanze personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f0e; --panel:#121917; --panel2:#18211e; --line:#233029;
  --ink:#e8f1ec; --ink2:#9db0a6; --ink3:#62756b;
  --acc:#34d399; --acc-dim:rgba(52,211,153,.12);
  --neg:#fb7185; --warn:#fbbf24;
  --r:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + var(--sab))}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}

/* masthead */
.mast{position:sticky;top:0;z-index:20;background:rgba(11,15,14,.92);backdrop-filter:blur(12px);
  padding:calc(12px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--acc);display:grid;place-items:center}
.brand i svg{width:13px;height:13px}
.icon-btn{background:none;border:1px solid var(--line);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.period{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.yr{display:flex;align-items:center;gap:6px;font-weight:700}
.yr button{background:none;border:none;color:var(--ink2);font-size:18px;padding:2px 6px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink2);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04130c}

/* layout */
.view{display:none;padding:14px 16px}
.view.on{display:block}
h2.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{display:block;color:var(--ink3);font-size:11px;font-weight:600;margin-bottom:4px}
.kpi b{font-size:19px;font-weight:700}
.hero{background:linear-gradient(160deg,#143028,#0f1a17 60%);border-color:#1f4a3b}
.hero small{color:#7fcfae}
.hero b{font-size:30px;letter-spacing:-.02em}
.pos{color:var(--acc)} .neg{color:var(--neg)} .mut{color:var(--ink3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:13px}

/* bars list */
.bl{display:flex;flex-direction:column;gap:11px}
.bl-i .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bl-i .top span:first-child{font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar>div{height:100%;border-radius:9px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--ink3);font-weight:600}
.donut .c b{display:block;font-size:14px;color:var(--ink)}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* movimenti */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.u{color:var(--neg)} .seg button.on.e{color:var(--acc)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.search{margin:10px 0}
.day{font-size:11px;color:var(--ink3);font-weight:700;margin:16px 2px 6px;letter-spacing:.05em}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.tx .dot{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + var(--sab));width:54px;height:54px;border-radius:17px;border:none;background:var(--acc);color:#04130c;font-size:28px;font-weight:600;box-shadow:0 8px 24px rgba(52,211,153,.35);cursor:pointer;z-index:15;display:none}
.fab.on{display:block}

/* matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-height:68vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.mx th,.mx td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mx th{position:sticky;top:0;background:var(--panel2);color:var(--ink3);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;z-index:2}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;text-align:left;background:var(--panel);z-index:1;min-width:128px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
.mx th:first-child{background:var(--panel2);z-index:3}
.mx tr.grp td{background:var(--panel2);font-weight:700}
.mx tr.grp td:first-child{background:var(--panel2)}
.mx tr.sub td:first-child{padding-left:20px;color:var(--ink2)}
.mx td.z{color:var(--ink3)}
.mx tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.mx td.t{font-weight:700;background:var(--panel2)}

/* lists */
.acct{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.acct:last-child{border:none}
.acct-n{display:flex;align-items:center;gap:12px;min-width:0}
.acct-n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover;display:block}
.logo.l{font-style:normal;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 6px}
.gh b{font-size:13px} .gh span{font-size:13px;color:var(--ink2)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--acc-dim);color:var(--acc)}
.btn{background:var(--acc);color:#04130c;border:none;border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:none;border:1px solid #4a2430;color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:12px;width:auto;border-radius:9px}
.rate{margin-bottom:8px}
.rate .row{margin-bottom:8px}
.rate .row>b{white-space:nowrap}
.inv-r{display:grid;grid-template-columns:1fr 74px 74px 44px;gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px}
.inv-r.h{color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.inv-r div:not(:first-child){text-align:right}
.l1{padding-left:12px;color:var(--ink2)} .l2{padding-left:24px;color:var(--ink3);font-size:11.5px}
/* panoramica: saldo quadrato + rate del mese */
.h-kpi{margin-top:10px}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sq{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.sq .io small{margin:6px 0 1px}
.sq .io b{font-size:19px}
.rc{aspect-ratio:1/1;display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer}
.rc>b{font-size:19px}
.rl{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.rl div{display:flex;justify-content:space-between;gap:6px}
.rc .rl b{display:inline;font-size:12px;font-weight:600;white-space:nowrap}
.rl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.rl .ok{color:var(--acc)}
.rc .note{margin-top:auto;padding-top:8px}
.legend .eu{font-size:11px;color:var(--ink2)}
.legend .pc{font-size:10.5px;color:var(--ink3);width:30px;text-align:right}
.pl-bars{display:flex;align-items:center;gap:3px;height:90px;margin-top:10px}
.pl-bars div{flex:1;border-radius:3px;min-height:2px}

/* bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  background:rgba(11,15,14,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:7px 6px calc(7px + var(--sab))}
nav button{flex:1;background:none;border:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:5px 0;cursor:pointer}
nav button svg{width:21px;height:21px}
nav button.wide-only{display:none}
nav button.on{color:var(--acc)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#0f1513;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + var(--sab))}
.sheet h3{margin:0 0 14px;font-size:17px}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.amt{font-size:28px;font-weight:700;text-align:center;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:var(--acc);color:#04130c;padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--ink3);line-height:1.5}
.btn:disabled{opacity:.6}

/* accesso (email/password + passphrase) */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 70% at 50% 0%,#143028,var(--bg) 60%);display:none;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--sab))}
.gate.on{display:flex}
.gate-box{width:100%;max-width:340px;text-align:center}
.gate-brand{justify-content:center;font-size:24px;margin-bottom:14px}
.gate-brand i{width:30px;height:30px;border-radius:9px}
.gate-brand i svg{width:18px;height:18px}
.gate-box .note{margin:0 0 16px}
.gate-box #g-err{margin:12px 0 0}
.gate-box input{text-align:center}
.gate-box .btn{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--ink2)}
.chk input{width:auto}
.sync{width:8px;height:8px;border-radius:50%;display:none;cursor:pointer}
.sync.on{display:block} .sync.ok{background:var(--acc)} .sync.saving{background:var(--warn)} .sync.err{background:var(--neg)}

/* ===== schermo largo: iPad in orizzontale, Mac ===== */
@media (min-width:900px){
  body{max-width:none;margin:0;padding:0 0 40px 210px}
  .mast,main{max-width:1200px;margin:0 auto}
  .mast{padding:16px 28px 12px;border-bottom:none}
  .view{padding:12px 28px 28px}
  nav{left:0;top:0;bottom:0;transform:none;width:210px;max-width:none;flex-direction:column;gap:4px;
    padding:calc(22px + var(--sat)) 12px 22px;border-top:none;border-right:1px solid var(--line);background:var(--panel)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 14px;border-radius:10px}
  nav button:hover{color:var(--ink2)}
  nav button.on{background:var(--acc-dim);color:var(--acc)}
  nav button svg{width:19px;height:19px}
  nav button.wide-only{display:flex}
  .fab{right:32px;bottom:32px}
  .toast{left:calc(50% + 105px);bottom:32px}
  .ov{align-items:center}
  .sheet{border-radius:22px;max-width:480px;max-height:86vh;padding:22px 22px 24px}
  h2.sec{margin-top:4px}

  /* Panoramica: saldo | rate | liquidità+patrimonio, poi grafici affiancati */
  .home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
  .home .top2{grid-column:span 2;gap:16px}
  .home .sq,.home .rc{aspect-ratio:auto;min-height:230px}
  .home .sq>div>b{font-size:30px !important}
  .home .sq .io b{font-size:22px}
  .home .h-kpi{grid-template-columns:1fr;gap:16px;margin:0}
  .home .h-kpi .card{display:flex;flex-direction:column;justify-content:center}
  .home .h-cat{grid-column:span 2}
  .home .h-cat,.home .h-bars{display:flex;flex-direction:column}
  .home .h-cat .card,.home .h-bars .card{flex:1}
  .home .h-sub{grid-column:1/-1}
  .home .h-sub .bl{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
  .donut{width:150px;height:150px}
  .home .donut-wrap{gap:32px}
  .home .legend{flex:0 1 380px}
  .narrow-only{display:none}

  /* Movimenti su due colonne, intestazione del giorno a tutta larghezza */
  #mov-list{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  #mov-list .day,#mov-list .empty{grid-column:1/-1}

  /* Mensile: tutti i mesi senza scorrere quando c'è spazio */
  .mx-wrap{max-height:none}
  table.mx{min-width:100%}
  .mx th,.mx td{padding:8px 8px}

  /* Patrimonio: Banche / Cash / Investimenti affiancati */
  .pgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .pgs .gh{margin-top:20px}

  /* Altro */
  .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .rgrid .rate{margin:0}
  .rgrid .empty{grid-column:1/-1}
  .inv-r{grid-template-columns:1fr 110px 110px 70px}
}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-top">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="#04130c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg></i><span id="mast-title">Bilancio</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="sync" id="sync" onclick="syncTap(this)"></span>
      <button class="icon-btn" onclick="openSettings()" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div id="period-bar">
    <div class="period">
      <div class="yr"><button onclick="setYear(-1)">‹</button><span id="yr-label" class="mono"></span><button onclick="setYear(1)">›</button></div>
      <span class="note" id="period-note"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-mov"></section>
  <section class="view" id="v-mx"></section>
  <section class="view" id="v-pat"></section>
  <section class="view" id="v-altro"></section>
</main>

<button class="fab" id="fab" onclick="openTx()" aria-label="Nuovo movimento">+</button>

<nav id="nav">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Panoramica</button>
  <button data-t="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movimenti</button>
  <button data-t="mx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Mensile</button>
  <button data-t="pat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Patrimonio</button>
  <button data-t="rate" class="wide-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Rate</button>
  <button data-t="carte" class="wide-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/><circle cx="16.5" cy="15" r="1.2"/><circle cx="18.8" cy="15" r="1.2"/></svg>Carte</button>
  <button data-t="inv" class="wide-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Investimenti</button>
  <button data-t="altro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Altro</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div class="gate-box" id="gate-box"></div></div>

<script>

/* ============ CONFIG FIREBASE ============
   Incolla la configurazione web del progetto (Console Firebase → Impostazioni progetto → Le tue app → Web).
   Con apiKey vuota l'app resta solo locale (localStorage). Questi valori non sono segreti:
   l'accesso ai dati lo decidono le regole Firestore (firestore.rules). */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCiItrJc1Waa0q07JPYdPqF0ke-pFLLufA',
  authDomain: 'contabilit-1a500.firebaseapp.com',
  projectId: 'contabilit-1a500',
  appId: '1:771839838672:web:9943e49e505942b400d1d5'
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const CLOUD = !!FIREBASE_CONFIG.apiKey;

/* ============ CIFRATURA ============
   AES-GCM 256 con chiave derivata dalla passphrase (PBKDF2-SHA256).
   Su Firestore arrivano solo iv + testo cifrato: senza passphrase i dati non si leggono. */
const KDF_ITER = 600000;
const CHECK = 'bilancio-ok';
const ENC = new TextEncoder(), DEC = new TextDecoder();
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', ENC.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
// aad lega ogni blocco cifrato alla sua sezione (tx, conti…): non si può scambiarlo con un altro
async function encrypt(key, txt, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:ENC.encode(aad)}, key, ENC.encode(txt));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decrypt(key, o, aad){
  return DEC.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv), additionalData:ENC.encode(aad)}, key, unb64(o.ct)));
}
async function keyOk(key, meta){ try{ return await decrypt(key, meta.check, 'check') === CHECK; }catch(e){ return false; } }

// "Ricorda su questo dispositivo": la chiave (non esportabile) resta in IndexedDB, mai la passphrase
const kdb = {
  open(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('bilancio-keys',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); },
  async get(id){ try{ const db=await this.open(); return await new Promise(ok=>{ const q=db.transaction('k').objectStore('k').get(id); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } },
  async set(id,v){ try{ const db=await this.open(); await new Promise(ok=>{ const t=db.transaction('k','readwrite'), s=t.objectStore('k'); v==null?s.delete(id):s.put(v,id); t.oncomplete=t.onerror=()=>ok(); }); }catch(e){} }
};

/* ============ STORAGE ============
   store.get / store.set: senza Firebase localStorage (come prima); con Firebase
   Firestore in bilancio/{uid}/sez/{tx|conti|rate|inv|trading}, ogni sezione cifrata.
   Salvataggio ottimistico: lo stato in memoria cambia subito, l'invio parte dopo 400 ms
   e solo per le sezioni modificate, con nuovi tentativi se la rete manca. */
const KEY = 'bilancio:v1';
const SEZ = ['tx','conti','rate','inv','trading','carte','servizi','opz'];
const localStore = {
  get(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
const ts = () => firebase.firestore.FieldValue.serverTimestamp();
const cloud = {
  db:null, user:null, meta:null, key:null, v:null, last:{}, timer:null, rt:null, busy:false, again:false, retry:0, wipeLocal:false,
  ref(){ return this.db.collection('bilancio').doc(this.user.uid); },
  async get(){
    const col = this.ref().collection('sez');
    const snap = await col.get({source:'server'}).catch(()=>col.get());
    const out = buildSeed();
    for(const d of snap.docs) if(SEZ.includes(d.id)) out[d.id] = JSON.parse(await decrypt(this.key, d.data(), d.id));
    SEZ.forEach(k=>this.last[k]=JSON.stringify(out[k]));
    return out;
  },
  set(v){ this.v=v; clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.timer=null; this.flush(); },400); setSync('saving'); },
  dirty(){ return this.key && this.v ? SEZ.map(k=>[k,JSON.stringify(this.v[k])]).filter(([k,j])=>j!==this.last[k]) : []; },
  async flush(){
    if(this.busy){ this.again=true; return; }
    if(!this.key) return;
    this.busy=true; this.again=false;
    let ok=true;
    try{
      const dirty=this.dirty();
      if(dirty.length){
        setSync('saving');
        const b=this.db.batch(), kid=this.meta.salt;
        for(const [k,j] of dirty) b.set(this.ref().collection('sez').doc(k), {kid, ...await encrypt(this.key,j,k), updated:ts()});
        await b.commit();
        dirty.forEach(([k,j])=>this.last[k]=j);
      }
      this.retry=0;
      if(this.wipeLocal){ localStore.clear(); this.wipeLocal=false; }
    }catch(e){ ok=false; this.fail(e); }
    this.busy=false;
    if(this.again) return this.flush();
    if(ok && !this.timer && this.key) setSync('ok');
  },
  fail(e){
    console.error(e);
    if(e.code==='permission-denied') return keyMismatch();
    setSync('err');
    this.retry++; clearTimeout(this.rt);
    this.rt=setTimeout(()=>this.flush(), Math.min(60000, 2000*2**(this.retry-1)));
  },
  // nuova passphrase: nuovo sale, si ricifra tutto in un'unica scrittura atomica
  async rekey(pass){
    while(this.busy) await new Promise(r=>setTimeout(r,100));
    clearTimeout(this.timer); this.timer=null; this.busy=true;
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey(pass,salt,KDF_ITER);
      const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
      const b=this.db.batch(), last={};
      b.set(this.ref(), {...meta, updated:ts()}, {merge:true});
      for(const k of SEZ){ last[k]=JSON.stringify(S[k]??[]); b.set(this.ref().collection('sez').doc(k), {kid:meta.salt, ...await encrypt(key,last[k],k), updated:ts()}); }
      await b.commit();
      const kept = await kdb.get(this.user.uid);
      Object.assign(this, {key, meta, last, v:S});
      if(kept) await kdb.set(this.user.uid, {key, salt:meta.salt});
    }finally{ this.busy=false; if(this.again) this.flush(); }
  }
};

const PAL = ['#34d399','#60a5fa','#fbbf24','#f472b6','#a78bfa','#22d3ee','#fb923c','#a3e635','#94a3b8','#f87171'];

const now = new Date();

/* ============ UTILS ============ */
const eur = (v,d=2) => (v<0?'-':'') + Math.abs(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'}) + ' €';
const eurI = v => eur(Math.round(v),0); // euro interi, per tabelle e legende
const eur0 = v => eur(v, Math.abs(v)>=1000 ? 0 : 2);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const uid = () => 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sum = a => a.reduce((x,y)=>x+y,0);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1600); }
const txYear = t => +t.d.slice(0,4);
const thisMonth = () => `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

/* ---- Rate: piano di pagamento ----
   {id, tipo, prod, acq, tot, n, rata, pre, done, first, fi, conto}
   n rate mensili da `rata` € (l'ultima assorbe gli arrotondamenti); pre = già pagate prima di
   inserirla, done = pagate dall'app. La rata i (0…n-1) scade il giorno first + (i - fi) mesi. */
const round2 = v => Math.round(v*100)/100;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
function addMonths(s, k){
  const [y,m,d] = s.split('-').map(Number), t = new Date(y, m-1+k, 1);
  t.setDate(Math.min(d, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate())); // 31 gen + 1 mese = 28/29 feb
  return ymd(t);
}
const fmtD = s => `${+s.slice(8,10)} ${M3[+s.slice(5,7)-1].toLowerCase()} ${s.slice(0,4)}`;
const dueDate = (r,i) => r.first ? addMonths(r.first, i - r.fi) : null;
const quota = (r,i) => i===r.n-1 ? round2(r.tot - r.rata*(r.n-1)) : r.rata;
const pagate = r => Math.min(r.n, r.pre + r.done);
const residue = r => r.n - pagate(r);
const daPagare = r => round2(sum(Array.from({length:residue(r)}, (_,j)=>quota(r, pagate(r)+j))));
const contoName = id => (S.conti.find(c=>c.id===id)||{}).n || '';
const carte = () => S.carte || [];
const cartaName = id => (carte().find(c=>c.id===id)||{}).n || '';
const daDove = o => o.carta ? cartaName(o.carta) : contoName(o.conto); // "Pagata da" di una rata o di un movimento
const servizi = () => S.servizi || [];
// rate con scadenza nel mese ym ('YYYY-MM'), pagate o no
function rateDelMese(ym){
  const out = [];
  S.rate.forEach(r=>{
    if(!r.first){ if(residue(r)) out.push({r, amt:r.rata, paid:false}); return; } // senza data: la conto da pagare
    for(let i=r.pre; i<r.n; i++){
      const d = dueDate(r,i), m = d.slice(0,7);
      if(m>ym) break;
      if(m===ym) out.push({r, i, d, amt:quota(r,i), paid:i<pagate(r)});
    }
  });
  // rate PagoFlex addebitate con l'estratto conto della carta
  carte().forEach(c=>(c.flex||[]).forEach(f=>{ for(let i=0;i<f.n;i++){ const d=stmtDate(c, addYM(f.m0,i)); if(d.slice(0,7)===ym) out.push({r:{tipo:'PagoFlex'}, i, d, amt:pfRata(f,i), paid:i<f.done}); } }));
  return out;
}
// vecchio formato {tipo, prod, rata, res} → piano senza data (va completato con Modifica)
function migrateRata(r){
  if(r.n!=null) return r;
  const res = Math.max(0, r.res||0);
  return {id:r.id||uid(), tipo:r.tipo||'', prod:r.prod==='-'?'':(r.prod||''), acq:null, tot:round2((r.rata||0)*res), n:res, rata:r.rata||0, pre:0, done:0, first:null, fi:0, conto:''};
}
// paga le rate scadute (oggi compreso): uscita nei movimenti, importo tolto dal conto, rata segnata pagata.
// L'id del movimento è fisso per rata, così due dispositivi non la registrano due volte.
function payDueRate(){
  const t = today(); let k = 0;
  S.rate.forEach(r=>{
    while(r.first && pagate(r)<r.n){
      const i = pagate(r), d = dueDate(r,i);
      if(d>t) break;
      const id = `rt_${r.id}_${i}`, amt = quota(r,i);
      if(!S.tx.some(x=>x.id===id)){
        // pagata con carta: diventa una spesa della carta e lascia il conto con l'estratto conto
        S.tx.push({id, d, t:'u', cat:'Rate', sub:r.tipo||'Rate', amt, note:`${r.prod||r.tipo} · rata ${i+1}/${r.n}`, rid:r.id, conto:r.carta?'':(r.conto||''), carta:r.carta||''});
        const c = !r.carta && S.conti.find(c=>c.id===r.conto); if(c) c.v = round2(c.v - amt);
      }
      r.done++; k++;
    }
  });
  if(k){ save(); toast(k===1 ? '1 rata pagata in automatico' : `${k} rate pagate in automatico`); }
  return k;
}
/* ---- Carte di credito ----
   {id, n, plafond, tipo:'giorno'|'fine', giorno, conto, pf, pfMin, pfComm, dal, flex:[], es:[]}
   Le spese con carta sono movimenti con `carta`. Il ciclo è il mese della spesa: con tipo 'giorno'
   si addebita il `giorno` del mese dopo, con 'fine' l'ultimo giorno dello stesso mese.
   `dal` = primo mese gestito dall'app (i mesi prima si considerano già addebitati fuori dall'app).
   PagoFlex {id, tx, desc, imp, n, comm, m0, done}: la spesa tx esce dall'estratto conto e la rata i
   (capitale + commissione mensile comm% sull'importo) si addebita con l'estratto del mese m0 + i.
   es = estratti conto già addebitati {m, d, spese, pf, tot}. */
const addYM = (ym,k) => addMonths(ym+'-01',k).slice(0,7);
const lastDay = ym => ymd(new Date(+ym.slice(0,4), +ym.slice(5,7), 0));
const stmtDate = (c,ym) => c.tipo==='fine' ? lastDay(ym) : addMonths(ym+'-'+String(Math.min(c.giorno||10,28)).padStart(2,'0'), 1);
const pfCap = (f,i) => i===f.n-1 ? round2(f.imp - round2(f.imp/f.n)*(f.n-1)) : round2(f.imp/f.n);
const pfFee = f => round2(f.imp*(f.comm||0)/100);
const pfRata = (f,i) => round2(pfCap(f,i) + pfFee(f));
const pfResiduo = f => round2(sum(Array.from({length:f.n-f.done}, (_,j)=>pfCap(f, f.done+j))));
const settled = (c,ym) => ym < c.dal || (c.es||[]).some(e=>e.m===ym);
// spese della carta nel ciclo ym (escluse quelle passate a PagoFlex)
const cartaSpese = (c,ym) => S.tx.filter(t=>t.carta===c.id && !t.pf && t.d.slice(0,7)===ym);
const mdiff = (a,b) => (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7)); // mesi da a a b ('YYYY-MM')
// rate PagoFlex che cadono nel ciclo ym
const pfDelCiclo = (c,ym) => (c.flex||[]).map(f=>({f, i:mdiff(f.m0,ym)})).filter(x=>x.i>=0 && x.i<x.f.n);
// cicli non ancora addebitati che hanno qualcosa da addebitare, dal più vecchio
function cicliAperti(c){
  const m = new Set();
  S.tx.forEach(t=>{ if(t.carta===c.id && !t.pf) m.add(t.d.slice(0,7)); });
  (c.flex||[]).forEach(f=>{ for(let i=f.done;i<f.n;i++) m.add(addYM(f.m0,i)); });
  return [...m].filter(ym=>!settled(c,ym)).sort();
}
const cicloTot = (c,ym) => round2(sum(cartaSpese(c,ym).map(t=>t.amt)) + sum(pfDelCiclo(c,ym).map(x=>pfRata(x.f,x.i))));
// plafond impegnato: spese non ancora addebitate + capitale PagoFlex ancora da restituire
function plafondUsato(c){
  const spese = sum(cicliAperti(c).map(ym=>sum(cartaSpese(c,ym).map(t=>t.amt))));
  return round2(spese + sum((c.flex||[]).map(pfResiduo)));
}
// addebito automatico degli estratti conto scaduti (giorno di addebito compreso)
function settleCards(){
  const t = today(); let k = 0;
  carte().forEach(c=>{
    c.es = c.es || [];
    for(const ym of cicliAperti(c)){
      const d = stmtDate(c, ym); if(d>t) break;
      const spese = round2(sum(cartaSpese(c,ym).map(x=>x.amt))), rate = pfDelCiclo(c,ym).filter(x=>x.i===x.f.done);
      const pf = round2(sum(rate.map(x=>pfRata(x.f,x.i))));
      rate.forEach(({f,i})=>{
        const fee = pfFee(f), id = `pfc_${f.id}_${i}`;
        if(fee && !S.tx.some(x=>x.id===id)) S.tx.push({id, d, t:'u', cat:'Carte', sub:'Commissioni PagoFlex', amt:fee, note:`${f.desc} · rata ${i+1}/${f.n}`});
        f.done++;
      });
      const tot = round2(spese+pf), conto = S.conti.find(x=>x.id===c.conto);
      if(conto) conto.v = round2(conto.v - tot);
      c.es.push({m:ym, d, spese, pf, tot, conto:c.conto||''});
      k++;
    }
  });
  if(k){ save(); toast(k===1 ? 'Addebitato 1 estratto conto della carta' : `Addebitati ${k} estratti conto delle carte`); }
  return k;
}
function seedCarte(){
  const find = re => (S.conti.find(c=>re.test(c.n))||{}).id || '';
  return [
    {id:'ing-oro', n:'ING Oro', plafond:1500, tipo:'giorno', giorno:10, conto:find(/\bing\b/i), pf:true, pfMin:200, pfComm:0.5, dal:thisMonth(), flex:[], es:[]},
    {id:'bbva', n:'BBVA', plafond:1000, tipo:'fine', giorno:10, conto:find(/bbva/i), pf:false, pfMin:200, pfComm:0.5, dal:thisMonth(), flex:[], es:[]}
  ];
}
// conti con carta di debito/prepagata: se mancano li creo una volta sola (saldo 0, da compilare in Patrimonio)
const CONTI_BASE = [['ING',/\bing\b/i],['BBVA',/bbva/i],['N26',/n26/i],['Buddy Bank',/buddy/i],['Wise',/wise/i]];
function seedConti(){
  CONTI_BASE.forEach(([n,re])=>{ if(!S.conti.some(c=>re.test(c.n))) S.conti.push({id:uid(), g:'Banche', n, v:0}); });
  carte().forEach(k=>{ if(!k.conto){ const m = CONTI_BASE.find(([n,re])=>re.test(k.n)); const c = m && S.conti.find(c=>m[1].test(c.n)); if(c) k.conto=c.id; } });
}
/* Metodo di pagamento di una spesa:
   carta di credito → t.carta (lascia il conto con l'estratto conto)
   carta di debito/prepagata → t.pag='carta', t.conto  |  conto (bonifico, bollettino) → t.pag='conto', t.conto
   contanti → t.pag='contanti', t.conto (conto del gruppo Cash). Con pag l'importo esce subito dal conto. */
const hasCredito = contoId => carte().some(k=>k.conto===contoId);
const debitoName = c => (hasCredito(c.id) ? 'Carta di debito ' : 'Carta ') + c.n;
function pagLabel(t){
  if(t.carta) return 'Carta di credito '+cartaName(t.carta);
  const c = S.conti.find(x=>x.id===t.conto);
  if(!c || !t.pag) return '';
  return t.pag==='carta' ? debitoName(c) : t.pag==='conto' ? 'Conto '+c.n : 'Contanti';
}
const pagValue = t => t.carta ? 'k:'+t.carta : t.pag && t.conto ? `${t.pag==='conto'?'c':t.pag==='contanti'?'x':'d'}:${t.conto}` : '';
function pagOptions(sel){
  const opt = (v,l) => `<option value="${v}" ${v===sel?'selected':''}>${esc(l)}</option>`;
  const banche = S.conti.filter(c=>c.g==='Banche'), cash = S.conti.filter(c=>c.g==='Cash');
  return opt('','Non specificato') +
    (carte().length ? `<optgroup label="Carte di credito">${carte().map(k=>opt('k:'+k.id,'Carta di credito '+k.n)).join('')}</optgroup>` : '') +
    (banche.length ? `<optgroup label="Carte di debito e prepagate">${banche.map(c=>opt('d:'+c.id, debitoName(c))).join('')}</optgroup>
      <optgroup label="Dal conto (bonifico, bollettino…)">${banche.map(c=>opt('c:'+c.id, 'Conto '+c.n)).join('')}</optgroup>` : '') +
    (cash.length ? `<optgroup label="Contanti">${cash.map(c=>opt('x:'+c.id, 'Contanti · '+c.n)).join('')}</optgroup>` : '');
}
function pagParse(v){
  const [k,id] = v.split(':');
  return k==='k' ? {carta:id, pag:'', conto:''} : id ? {carta:'', pag:{d:'carta',c:'conto',x:'contanti'}[k], conto:id} : {carta:'', pag:'', conto:''};
}
// effetto di una spesa sul saldo del conto (sign -1 per annullarlo)
function applyPag(t, sign=1){
  if(!t || !t.pag || !t.conto) return;
  const c = S.conti.find(x=>x.id===t.conto); if(c) c.v = round2(c.v - sign*(t.t==='u'?1:-1)*t.amt);
}
// dopo ogni caricamento dei dati (avvio, sblocco, backup importato, ritorno in primo piano)
function afterLoad(){
  S.rate = S.rate.map(migrateRata);
  if(!S.opz) S.opz = {};
  if(!S.opz.contiBase){ seedConti(); S.opz.contiBase = true; save(); }
  if(!S.carte){ S.carte = seedCarte(); seedConti(); }
  if(!S.servizi) S.servizi = ['PayPal','Klarna','Scalapay','Findomestic','Compass'];
  S.rate.forEach(r=>{ if(r.tipo && !S.servizi.includes(r.tipo)) S.servizi.push(r.tipo); });
  payDueRate(); settleCards();
}
const txMonth = t => +t.d.slice(5,7)-1;
function inPeriod(t){ return txYear(t)===ui.year && (ui.month==='all' || txMonth(t)===ui.month); }
function periodTx(){ return S.tx.filter(inPeriod); }
function periodLabel(){ return ui.month==='all' ? `Anno ${ui.year}` : `${MESI[ui.month]} ${ui.year}`; }
function groupBy(arr, fn){ const m = new Map(); arr.forEach(x=>{ const k=fn(x); m.set(k,(m.get(k)||0)+x.amt); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
const SUB = ['rate','carte','inv']; // su schermo largo hanno una voce nel menu, su telefono stanno in Altro
function showTab(t){
  if(SUB.includes(t)){ ui.altro=t; if(!WIDE.matches) t='altro'; }
  else if(t==='altro' && WIDE.matches) ui.altro='trading';

  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+(SUB.includes(t)?'altro':t)));

  $('chips').style.display = (t==='home'||t==='mov') ? 'flex' : 'none';
  $('mast-title').textContent = {home:'Bilancio',mov:'Movimenti',mx:'Mensile',pat:'Patrimonio',rate:'Rate',carte:'Carte di credito',inv:'Investimenti',altro:'Altro'}[t];
  $('period-bar').style.display = (t==='pat' || SUB.includes(t)) ? 'none' : 'block';
  render(); window.scrollTo(0,0);
}
function setYear(d){ ui.year+=d; render(); }
function setMonth(m){ ui.month=m; render(); }
function renderChips(){
  const items = [['all','Anno'], ...MESI.map((m,i)=>[i,M3[i]])];
  $('chips').innerHTML = items.map(([v,l])=>`<button class="chip ${ui.month===v?'on':''}" onclick="setMonth(${typeof v==='number'?v:"'all'"})">${l}</button>`).join('');

  renderChips();

}

/* ---- Panoramica ---- */
function donut(data){
  const tot = sum(data.map(d=>d[1])) || 1; const R=48, C=2*Math.PI*R; let off=0;
  const arcs = data.map(([k,v],i)=>{ const len=v/tot*C; const s=`<circle cx="64" cy="64" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off+=len; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" fill="none" stroke="#18211e" stroke-width="16"/>${arcs}</svg><div class="c"><div><b class="mono">${eur0(tot)}</b>uscite</div></div></div>`;
}
function renderHome(){
  const p = periodTx(); const U = p.filter(t=>t.t==='u'), E = p.filter(t=>t.t==='e');
  const tu = sum(U.map(t=>t.amt)), te = sum(E.map(t=>t.amt)), saldo = te-tu;
  const patr = sum(S.conti.map(c=>c.v)), liq = sum(S.conti.filter(c=>c.g!=='Investimenti').map(c=>c.v));
  const byCat = groupBy(U, t=>t.cat);
  const bySub = groupBy(U, t=>t.cat + (t.sub?' › '+t.sub:'')).slice(0,8);
  const yU = Array(12).fill(0), yE = Array(12).fill(0);
  S.tx.filter(t=>txYear(t)===ui.year).forEach(t=>{ (t.t==='u'?yU:yE)[txMonth(t)] += t.amt; });
  const mx = Math.max(1,...yU,...yE);
  const bars = M3.map((m,i)=>`<div style="flex:1;text-align:center;cursor:pointer" onclick="setMonth(${i})">
      <div style="display:flex;gap:2px;align-items:flex-end;height:90px;justify-content:center">
        <div style="width:6px;height:${yE[i]/mx*100}%;background:var(--acc);border-radius:3px;min-height:2px;opacity:${ui.month===i||ui.month==='all'?1:.35}"></div>
        <div style="width:6px;height:${yU[i]/mx*100}%;background:var(--neg);border-radius:3px;min-height:2px;opacity:${ui.month===i||ui.month==='all'?1:.35}"></div>
      </div><div style="font-size:9px;color:var(--ink3);margin-top:5px;font-weight:700">${m[0]}</div></div>`).join('');
  const maxSub = bySub[0]?bySub[0][1]:1;
  $('v-home').innerHTML = `<div class="home">
    <div class="top2">
      <div class="card hero kpi sq"><div><small>Saldo ${periodLabel().toLowerCase()}</small><b class="mono ${saldo<0?'neg':''}" style="font-size:24px">${eur0(saldo)}</b></div>
        <div class="io"><small>Entrate</small><b class="mono pos">${eur0(te)}</b><small>Uscite</small><b class="mono neg">${eur0(tu)}</b></div></div>
      ${rateCard()}
    </div>
    <div class="grid2 h-kpi">
      <div class="card kpi" onclick="showTab('pat')"><small>Liquidità</small><b class="mono">${eur0(liq)}</b></div>
      <div class="card kpi" onclick="showTab('pat')"><small>Patrimonio</small><b class="mono">${eur0(patr)}</b></div>
    </div>
    <div class="h-cat"><h2 class="sec">Uscite per categoria</h2>
    <div class="card">${byCat.length ? `<div class="donut-wrap">${donut(byCat)}<div class="legend">${byCat.map(([k,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(k)}</span><b class="mono eu">${eurI(v)}</b><b class="mono pc">${Math.round(v/(tu||1)*100)}%</b></div>`).join('')}</div></div>` : '<div class="empty">Nessuna uscita nel periodo</div>'}</div></div>
    <div class="h-bars"><h2 class="sec">Entrate vs uscite · ${ui.year}</h2>
    <div class="card"><div style="display:flex;gap:2px">${bars}</div>
      <div class="note" style="margin-top:10px;display:flex;gap:14px"><span><b style="color:var(--acc)">●</b> Entrate</span><span><b style="color:var(--neg)">●</b> Uscite</span></div></div></div>
    <div class="h-sub"><h2 class="sec">Voci che pesano di più</h2>
    <div class="card">${bySub.length ? `<div class="bl">${bySub.map(([k,v],i)=>`<div class="bl-i"><div class="top"><span>${esc(k)}</span><span class="mono">${eur0(v)}</span></div><div class="bar"><div style="width:${v/maxSub*100}%;background:${PAL[i%PAL.length]}"></div></div></div>`).join('')}</div>` : '<div class="empty">—</div>'}</div></div></div>`;
}

// rate da pagare nel mese corrente, raggruppate per metodo (PayPal, Klarna…)
function rateCard(){
  const list = rateDelMese(thisMonth());
  const by = new Map();
  list.forEach(x=>{ const k=x.r.tipo||'Altro'; const g=by.get(k)||{due:0,paid:0}; g[x.paid?'paid':'due']+=x.amt; by.set(k,g); });
  const groups = [...by.entries()].sort((a,b)=>(b[1].due-a[1].due) || (b[1].paid-a[1].paid)); // prima quelle da pagare
  const due = sum(list.filter(x=>!x.paid).map(x=>x.amt)), paid = sum(list.filter(x=>x.paid).map(x=>x.amt));
  const rows = WIDE.matches ? 8 : paid ? 3 : 4, MAX = groups.length>rows ? rows-1 : rows; // righe che stanno nel quadrato
  const amt = v => v ? `<b class="mono">${eur(v)}</b>` : `<b class="ok">✓</b>`;
  const lines = groups.slice(0,MAX).map(([k,g])=>`<div><span>${esc(k)}</span>${amt(g.due)}</div>`).join('')
    + (groups.length>MAX ? `<div><span>+ altri ${groups.length-MAX}</span>${amt(sum(groups.slice(MAX).map(([k,g])=>g.due)))}</div>` : '');
  return `<div class="card kpi rc" onclick="showTab('rate')"><small>Rate da pagare · ${M3[now.getMonth()]}</small>
    ${list.length ? `<b class="mono ${due?'neg':'pos'}">${due?eur(due):'Tutto pagato'}</b><div class="rl">${lines}</div>
      ${paid?`<div class="note">Già pagate ${eur(paid)}</div>`:''}` : `<div class="empty" style="padding:18px 0 0">Nessuna rata questo mese</div>`}</div>`;
}

function renderMov(){
  let list = periodTx();
  if(ui.tipo!=='all') list = list.filter(t=>t.t===ui.tipo);
  const q = ui.q.trim().toLowerCase();
  if(q) list = list.filter(t=>(t.cat+' '+t.sub+' '+t.note).toLowerCase().includes(q));
  list.sort((a,b)=> b.d.localeCompare(a.d) || a.cat.localeCompare(b.cat));
  const tu = sum(list.filter(t=>t.t==='u').map(t=>t.amt)), te = sum(list.filter(t=>t.t==='e').map(t=>t.amt));
  let html = `<div class="seg">
      ${[['all','Tutti',''],['u','Uscite','u'],['e','Entrate','e']].map(([v,l,c])=>`<button class="${c} ${ui.tipo===v?'on':''}" onclick="ui.tipo='${v}';render()">${l}</button>`).join('')}
    </div>

    <div class="row note" style="margin:0 2px"><span>${list.length} movimenti</span><span class="mono"><span class="pos">+${eur0(te)}</span> · <span class="neg">-${eur0(tu)}</span></span></div>
    <div id="mov-list"></div>`;
  $('v-mov').innerHTML = html;
  renderMovList();
}
function renderMovList(){
  let list = periodTx();
  if(ui.tipo!=='all') list = list.filter(t=>t.t===ui.tipo);
  const q = ui.q.trim().toLowerCase();
  if(q) list = list.filter(t=>(t.cat+' '+t.sub+' '+t.note).toLowerCase().includes(q));
  list.sort((a,b)=> b.d.localeCompare(a.d) || a.cat.localeCompare(b.cat));
  if(!list.length){ $('mov-list').innerHTML='<div class="empty">Nessun movimento.<br>Tocca + per aggiungerne uno.</div>'; return; }
  const colorOf = c => PAL[Math.abs([...c].reduce((a,ch)=>a+ch.charCodeAt(0),0))%PAL.length];
  let cur='', out='';
  list.forEach(t=>{
    const head = `${+t.d.slice(8,10)} ${MESI[txMonth(t)]} ${txYear(t)}`;
    if(head!==cur){ cur=head; out+=`<div class="day">${head.toUpperCase()}</div>`; }
    const c = colorOf(t.cat);
    out += `<div class="tx" onclick="openTx('${t.id}')">
      <div class="dot" style="background:${c}22;color:${c}">${esc(t.cat[0]||'?')}</div>
      <div class="mid"><b>${esc(t.sub||t.cat)}</b><small>${esc([t.sub?t.cat:'', t.note.startsWith('Totale mensile')?'':t.note, pagLabel(t)?'💳 '+pagLabel(t):''].filter(Boolean).join(' · ')||(t.sub?'':'Totale mensile'))}</small></div>
      <b class="mono ${t.t==='e'?'pos':''}">${t.t==='e'?'+':'-'}${eur(t.amt)}</b></div>`;
  });
  $('mov-list').innerHTML = out;
}

/* ---- Mensile (come la tabella Contabilità di Numbers) ---- */
function renderMx(){
  const tipo = ui.mxTipo;
  const tx = S.tx.filter(t=>t.t===tipo && txYear(t)===ui.year);
  const cats = new Map();
  tx.forEach(t=>{
    if(!cats.has(t.cat)) cats.set(t.cat,{m:Array(12).fill(0),subs:new Map()});
    const c = cats.get(t.cat); c.m[txMonth(t)]+=t.amt;
    const sk = t.sub||'—';
    if(!c.subs.has(sk)) c.subs.set(sk,Array(12).fill(0));
    c.subs.get(sk)[txMonth(t)]+=t.amt;
  });
  const order = [...cats.entries()].sort((a,b)=>sum(b[1].m)-sum(a[1].m));
  const fmt = eurI;
  const cell = v => `<td class="mono${v?'':' z'}">${fmt(v)}</td>`;
  const tot = Array(12).fill(0); order.forEach(([k,c])=>c.m.forEach((v,i)=>tot[i]+=v));
  let rows='';
  order.forEach(([k,c])=>{
    rows+=`<tr class="grp"><td>${esc(k)}</td>${c.m.map(cell).join('')}<td class="mono t">${fmt(sum(c.m))}</td></tr>`;
    if(c.subs.size>1 || ![...c.subs.keys()].includes('—'))
      [...c.subs.entries()].sort((a,b)=>sum(b[1])-sum(a[1])).forEach(([s,m])=>{
        rows+=`<tr class="sub"><td>${esc(s)}</td>${m.map(cell).join('')}<td class="mono t">${fmt(sum(m))}</td></tr>`;
      });
  });
  $('v-mx').innerHTML = `
    <div class="seg" style="margin-bottom:12px">
      <button class="u ${tipo==='u'?'on':''}" onclick="ui.mxTipo='u';render()">Uscite</button>
      <button class="e ${tipo==='e'?'on':''}" onclick="ui.mxTipo='e';render()">Entrate</button>
    </div>
    <div class="mx-wrap"><table class="mx">
      <tr><th>${tipo==='u'?'Uscite':'Entrate'} ${ui.year}</th>${M3.map(m=>`<th>${m}</th>`).join('')}<th>Totale</th></tr>
      <tr class="tot"><td>Totale mese</td>${tot.map(cell).join('')}<td class="mono t">${fmt(sum(tot))}</td></tr>
      ${rows || '<tr><td colspan="14" class="empty">Nessun dato per questo anno</td></tr>'}
    </table></div>
    <p class="note" style="margin-top:12px">Stessa logica del tuo foglio: macro-categoria, sottovoci e mesi in colonna. <span class="narrow-only">Scorri a destra per vedere tutti i mesi.</span></p>`;
}

const LOGO_RE = [['wise',/wise/i],['ing',/\bing\b/i],['n26',/n26/i],['buddy',/buddy/i],['bbva',/bbva/i]];
function contoIcon(c){
  const m = LOGO_RE.find(([k,re])=>re.test(c.n));
  return m ? `<img class="logo" src="${LOGHI[m[0]]}" alt="">` : `<i class="logo l">${esc((c.n||'?')[0].toUpperCase())}</i>`;
}
function renderPat(){
  const groups = ['Banche','Cash','Investimenti'];
  const patr = sum(S.conti.map(c=>c.v)), liq = sum(S.conti.filter(c=>c.g!=='Investimenti').map(c=>c.v));
  let html = `<div class="card hero kpi"><small>Patrimonio totale</small><b class="mono">${eur(patr,0)}</b>
    <div class="row" style="margin-top:14px"><div><small>Liquidità</small><b class="mono" style="font-size:16px">${eur(liq,0)}</b></div>
    <div style="text-align:right"><small>Investimenti</small><b class="mono" style="font-size:16px">${eur(patr-liq,0)}</b></div></div></div>`;
  html += '<div class="pgs">';
  groups.forEach(g=>{
    const items = S.conti.filter(c=>c.g===g);
    html += `<div><div class="gh"><b>${g}</b><span class="mono">${eur(sum(items.map(c=>c.v)),0)}</span></div><div class="card" style="padding:4px 14px">
      ${items.map(c=>`<div class="acct" onclick="openConto('${c.id}')"><span class="acct-n">${contoIcon(c)}<span>${esc(c.n)}</span></span><b class="mono ${c.v?'':'mut'}">${eur(c.v,0)}</b></div>`).join('') || '<div class="empty">—</div>'}</div></div>`;
  });
  html += `</div><button class="btn ghost" style="margin-top:18px" onclick="openConto()">+ Aggiungi conto</button>`;
  $('v-pat').innerHTML = html;
}
function openConto(id){
  const c = id ? S.conti.find(x=>x.id===id) : {g:'Banche',n:'',v:0};
  sheet(`<h3>${id?'Modifica conto':'Nuovo conto'}</h3>
    <div class="f"><label>Gruppo</label><select id="c-g">${['Banche','Cash','Investimenti'].map(g=>`<option ${c.g===g?'selected':''}>${g}</option>`).join('')}</select></div>
    <div class="f"><label>Nome</label><input id="c-n" value="${esc(c.n)}" placeholder="es. ING"></div>
    <div class="f"><label>Saldo (€)</label><input id="c-v" inputmode="decimal" class="amt" value="${c.v||''}" placeholder="0 €"></div>
    <button class="btn" onclick="saveConto('${id||''}')">Salva</button>
    ${id?`<button class="btn danger" style="margin-top:8px" onclick="delConto('${id}')">Elimina</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
const num = s => parseFloat(String(s).replace(',','.')) || 0;
function saveConto(id){
  const o = {g:$('c-g').value, n:$('c-n').value.trim(), v:num($('c-v').value)};
  if(!o.n) return toast('Inserisci un nome');
  if(id) Object.assign(S.conti.find(x=>x.id===id),o); else S.conti.push({id:uid(),...o});
  save(); closeSheet(); render(); toast('Salvato');
}
function delConto(id){ S.conti=S.conti.filter(x=>x.id!==id); save(); closeSheet(); render(); }

/* ---- Altro: Rate / Investimenti / Trading ---- */
function renderAltro(){
  const tabs = [['rate','Rate'],['carte','Carte'],['inv','Invest.'],['trading','Trading']];
  let body='';
  if(ui.altro==='rate'){
    body = renderRate();
  } else if(ui.altro==='carte'){
    body = renderCarte();
  } else if(ui.altro==='inv'){
    const rows = S.inv; const top = rows.filter(r=>r.lvl===0);
    const ti = sum(top.map(r=>r.inv||0)), te = sum(top.map(r=>r.eff||0));
    body = `<div class="grid2"><div class="card kpi"><small>Investito</small><b class="mono">${eur(ti,0)}</b></div><div class="card kpi"><small>Valore attuale</small><b class="mono">${eur(te,0)}</b></div></div>
      <div class="card kpi" style="margin-top:10px"><small>Rendimento totale</small><b class="mono ${te>=ti?'pos':'neg'}">${te>=ti?'+':''}${((te-ti)/(ti||1)*100).toFixed(1)}%  ·  ${te>=ti?'+':''}${eur(te-ti,0)}</b></div>
      <h2 class="sec">Dettaglio</h2><div class="card" style="padding:4px 12px">
      <div class="inv-r h"><div>Voce</div><div>Inv.</div><div>Attuale</div><div>%</div></div>
      ${rows.map(r=>{ const p = r.inv>0&&r.eff!=null ? (r.eff-r.inv)/r.inv*100 : null;
        return `<div class="inv-r"><div class="${r.lvl===1?'l1':r.lvl===2?'l2':''}" style="${r.lvl===0?'font-weight:700':''}">${esc(r.n.replace(/^- /,''))}</div><div class="mono">${r.inv?eurI(r.inv):'–'}</div><div class="mono">${r.eff!=null?eurI(r.eff):'–'}</div><div class="mono ${p==null?'mut':p>=0?'pos':'neg'}">${p==null?'–':(p>0?'+':'')+Math.round(p)+'%'}</div></div>`; }).join('')}</div>
      <p class="note" style="margin-top:10px">Il rendimento % qui è ricalcolato da investito/attuale (nel foglio alcune celle % non coincidono con i valori).</p>`;
  } else {
    const m = ui.plMonth; const list = S.trading.filter(t=>+t.d.slice(0,4)===ui.year && +t.d.slice(5,7)-1===m).sort((a,b)=>a.d.localeCompare(b.d));
    const tot = sum(list.map(t=>t.v)); const mx = Math.max(1,...list.map(t=>Math.abs(t.v)));
    const yr = sum(S.trading.filter(t=>+t.d.slice(0,4)===ui.year).map(t=>t.v));
    body = `<div class="chips" style="margin:0 0 10px">${MESI.map((x,i)=>`<button class="chip ${m===i?'on':''}" onclick="ui.plMonth=${i};render()">${M3[i]}</button>`).join('')}</div>
      <div class="grid2"><div class="card kpi"><small>P&L ${M3[m]}</small><b class="mono ${tot<0?'neg':tot>0?'pos':''}">${eur(tot)}</b></div><div class="card kpi"><small>P&L ${ui.year}</small><b class="mono ${yr<0?'neg':yr>0?'pos':''}">${eur(yr)}</b></div></div>
      <div class="card" style="margin-top:10px">${list.length?`<div class="pl-bars">${list.map(t=>`<div style="height:${Math.abs(t.v)/mx*100}%;background:${t.v>=0?'var(--acc)':'var(--neg)'}"></div>`).join('')}</div>`:'<div class="empty">Nessun giorno registrato</div>'}</div>
      <h2 class="sec">Aggiungi giornata</h2>
      <div class="grid2"><input type="date" id="pl-d" value="${now.toISOString().slice(0,10)}"><input id="pl-v" inputmode="decimal" placeholder="P&L in €, es. -120,50"></div>
      <button class="btn" style="margin-top:8px" onclick="addPL()">Aggiungi</button>
      <div style="margin-top:14px">${list.slice().reverse().map(t=>`<div class="tx" onclick="delPL('${t.id}')"><div class="mid"><b>${+t.d.slice(8,10)} ${MESI[m]}</b><small>tocca per eliminare</small></div><b class="mono ${t.v>=0?'pos':'neg'}">${t.v>0?'+':''}${eur(t.v)}</b></div>`).join('')}</div>`;
  }
  // su schermo largo Rate e Investimenti sono nel menu: niente selettore
  const seg = WIDE.matches ? '' : `<div class="seg" style="margin-bottom:14px">${tabs.map(([v,l])=>`<button class="${ui.altro===v?'on':''}" onclick="ui.altro='${v}';render()">${l}</button>`).join('')}</div>`;
  $('v-altro').innerHTML = seg + body;
}
function renderRate(){
  const att = S.rate.filter(r=>residue(r)>0), fin = S.rate.filter(r=>residue(r)===0);
  const seg = `<div class="seg" style="margin-bottom:14px">
    <button class="${ui.rateTab==='due'?'on':''}" onclick="ui.rateTab='due';render()">Da pagare · ${att.length}</button>
    <button class="${ui.rateTab==='paid'?'on':''}" onclick="ui.rateTab='paid';render()">Pagate · ${fin.length}</button></div>`;
  const titolo = r => esc(r.prod || r.tipo || 'Rata');
  const top = `<div class="grid2" style="margin-bottom:12px"><button class="btn" onclick="openRata()">+ Nuova rata</button><button class="btn ghost" onclick="openServizi()">Servizi</button></div>`;
  if(ui.rateTab==='due'){
    const ym = thisMonth(), nome = MESI[now.getMonth()].toLowerCase();
    const next = r => r.first ? dueDate(r, pagate(r)) : '9999';
    const card = r=>{
      const pm = rateDelMese(ym).find(x=>x.r===r && x.paid);
      const info = r.first
        ? `Prossima: <b style="color:var(--ink)">${fmtD(next(r))}</b> · ${eur(quota(r,pagate(r)))}`
        : `<span style="color:var(--warn)">Manca la data della prossima rata: tocca Modifica</span>`;
      return `<div class="card rate">
        <div class="row"><div style="min-width:0"><b>${titolo(r)}</b><div class="note">${eur(r.rata)} × ${r.n}${daDove(r)?` · da ${esc(daDove(r))}`:''}</div></div><b class="mono">${eur(daPagare(r))}</b></div>
        <div class="bar" style="margin:4px 0 8px"><div style="width:${pagate(r)/r.n*100}%;background:var(--acc)"></div></div>
        <div class="row"><div class="note">${pagate(r)}/${r.n} pagate · ${info}${pm?`<br><span class="pos">✓ ${nome} pagata il ${fmtD(pm.d)}</span>`:''}</div>
          <button class="btn sm ghost" onclick="openRata('${r.id}')">Modifica</button></div></div>`;
    };
    // un gruppo per servizio; i servizi senza rate in corso restano nascosti
    const gruppi = [...new Set(att.map(r=>r.tipo||'Altro'))].sort((a,b)=>{ const i=x=>{ const k=servizi().indexOf(x); return k<0?99:k; }; return i(a)-i(b); });
    const html = gruppi.map(g=>{ const l = att.filter(r=>(r.tipo||'Altro')===g).sort((a,b)=>next(a).localeCompare(next(b)));
      return `<div class="gh"><b>${esc(g)}</b><span class="mono">${eur(sum(l.map(r=>r.rata)))}/mese · resta ${eur(sum(l.map(daPagare)))}</span></div><div class="rgrid">${l.map(card).join('')}</div>`; }).join('');
    return top + seg + `<div class="grid2"><div class="card kpi"><small>Rate al mese</small><b class="mono">${eur(sum(att.map(r=>r.rata)))}</b></div><div class="card kpi"><small>Ancora da pagare</small><b class="mono neg">${eur(sum(att.map(daPagare)))}</b></div></div>
      ${html || '<div class="empty">Nessuna rata da pagare 🎉</div>'}
      <p class="note" style="margin-top:14px">Nel giorno della scadenza (o alla prima apertura dell'app dopo) la rata viene registrata tra le uscite, categoria Rate, e tolta dal conto scelto; se è pagata con una carta di credito finisce nel suo estratto conto.</p>`;
  }
  const storico = S.tx.filter(t=>t.rid).sort((a,b)=>b.d.localeCompare(a.d) || b.id.localeCompare(a.id));
  const ultima = r => (storico.find(t=>t.rid===r.id)||{}).d;
  let cur='', righe='';
  storico.forEach(t=>{
    const m = `${MESI[txMonth(t)]} ${txYear(t)}`;
    if(m!==cur){ cur=m; righe+=`<div class="day">${m.toUpperCase()}</div>`; }
    righe += `<div class="tx" onclick="openTx('${t.id}')"><div class="mid"><b>${esc(t.note.split(' · ')[0]||t.sub)}</b><small>${fmtD(t.d)} · ${esc(t.sub)} · ${esc(t.note.split(' · ')[1]||'')}${daDove(t)?` · da ${esc(daDove(t))}`:''}</small></div><b class="mono">-${eur(t.amt)}</b></div>`;
  });
  return top + seg + `<h2 class="sec" style="margin-top:0">Rate concluse</h2><div class="rgrid">${fin.map(r=>`<div class="card rate" onclick="openRata('${r.id}')" style="cursor:pointer">
      <div class="row"><div style="min-width:0"><b>${titolo(r)}</b><div class="note">${esc(r.tipo)} · ${r.n} rate${ultima(r)?` · ultima il ${fmtD(ultima(r))}`:''}</div></div><b class="mono">${eur(r.tot)}</b></div>
      <span class="pill">✓ saldata</span></div>`).join('') || '<div class="empty">Nessuna rata conclusa</div>'}</div>
    <h2 class="sec">Pagamenti registrati</h2>${righe || '<div class="empty">Ancora nessun pagamento registrato dall\'app</div>'}`;
}
function openRata(id){
  const r = id ? S.rate.find(x=>x.id===id) : null;
  const acq = r ? (r.acq||'') : today();
  const dec = x => x ? String(x).replace('.',',') : ''; // 229.5 → 229,5 nel campo

// valori dei campi: finché non li tocchi, "rate da pagare" segue il numero rate e la prossima rata segue l'acquisto
function rataN(){ if(!$('r-res').dataset.t) $('r-res').value = $('r-n').value; rataPrev(); }
function rataAcq(){ if(!$('r-next').dataset.t && $('r-acq').value) $('r-next').value = addMonths($('r-acq').value, 1); rataPrev(); }
function rataForm(){
  const n = parseInt($('r-n').value)||0, r = $('r-res').value.trim();
  return {tot:num($('r-tot').value), n, res: r==='' ? n : parseInt(r), next:$('r-next').value};
}
function rataPrev(){
  const {tot,n,res,next} = rataForm(), el = $('r-prev');
  if(!tot || !n){ el.textContent = ''; return; }
  const rata = round2(tot/n);
  el.innerHTML = `Rata <b class="mono" style="color:var(--ink)">${eur(rata)}</b> × ${n}` +
    (res>=0 && res<=n ? ` · da pagare ${res} (${eur(res===n ? tot : res*rata)})` + (res && next ? ` · ultima il ${fmtD(addMonths(next,res-1))}` : '') : '');
}
function saveRata(id){
  const old = id ? S.rate.find(x=>x.id===id) : null, done = old ? old.done : 0;
  const {tot,n,res,next} = rataForm();
  if(!tot) return toast('Inserisci l\'importo totale');
  if(n<1) return toast('Inserisci il numero di rate');
  if(isNaN(res) || res<0 || res>n) return toast('Rate da pagare: tra 0 e '+n);
  if(res && !next) return toast('Inserisci la data della prossima rata');
  const pre = n - res - done;
  if(pre<0) return toast(`L'app ha già registrato ${done} rate: al massimo ${n-done} da pagare`);
  if(res && next<today() && !confirm(`La prossima rata (${fmtD(next)}) è già passata: verrà registrata subito come pagata e tolta dal conto. Continuare?`)) return;
  const o = {tipo:$('r-t').value.trim()||'PayPal', prod:$('r-p').value.trim(), acq:$('r-acq').value||null,
    tot:round2(tot), n, rata:round2(tot/n), pre, done, first: res ? next : (old&&old.first)||null, fi: pre+done,
    conto: $('r-c').value.startsWith('c:') ? $('r-c').value.slice(2) : '', carta: $('r-c').value.startsWith('k:') ? $('r-c').value.slice(2) : ''};
  if(old) Object.assign(old,o); else S.rate.push({id:uid(),...o});
  addServizio(o.tipo);
  save(); closeSheet(); payDueRate(); render(); toast('Salvato');
}

function nuovoServizio(sel){
  if(sel.value!=='__new'){ sel.dataset.prev = sel.value; return; }
  const n = (prompt('Nome del nuovo servizio')||'').trim();

  addServizio(n);
  if(![...sel.options].some(o=>o.value===n)){ const o=document.createElement('option'); o.textContent=n; sel.insertBefore(o, sel.lastElementChild); }
  sel.value = sel.dataset.prev = n;
}

function saveTx(id){
  const o = { t:$('t-t').value, amt:num($('t-a').value), d:$('t-d').value,
    cat: $('t-c').value==='__new' ? $('t-newc').value.trim() : $('t-c').value, sub:$('t-s').value.trim(), note:$('t-n').value.trim() };
  if(!o.amt) return toast('Inserisci un importo');
  if(!o.cat) return toast('Scegli una categoria');
  if(!o.d) return toast('Inserisci la data');
  const old = id && S.tx.find(x=>x.id===id);
  if(!(old && (old.rid || old.pf))) Object.assign(o, o.t==='u' ? pagParse($('t-k').value) : {carta:'', pag:'', conto:''});
  // una spesa di un estratto conto già addebitato non può cambiare carta né importo: il conto è già stato scalato
  const chiuso = t => t && t.carta && (()=>{ const c=carte().find(x=>x.id===t.carta); return c && (c.es||[]).some(e=>e.m===t.d.slice(0,7)); })();
  if(chiuso(old) && (o.carta!==old.carta || o.amt!==old.amt || o.d.slice(0,7)!==old.d.slice(0,7))) return toast('Estratto conto già addebitato: importo, mese e carta non si possono più cambiare');
  if(chiuso({...o, carta:o.carta}) && !(old && old.carta===o.carta && old.d.slice(0,7)===o.d.slice(0,7))) return toast('L\'estratto conto di quel mese è già stato addebitato');
  if(old && old.pf){ const f=carte().flatMap(c=>c.flex||[]).find(f=>f.id===old.pf); if(f && o.amt!==old.amt){ if(f.done) return toast('PagoFlex già in corso: l\'importo non si può cambiare'); f.imp=o.amt; } }
  // carta di debito / conto / contanti: l'importo esce subito dal conto (prima tolgo l'effetto della versione vecchia)
  if(old) applyPag(old, -1);
  if(old) Object.assign(old,o); else S.tx.push({id:uid(),...o});
  applyPag(old || S.tx[S.tx.length-1]);
  if(o.t==='u' && !(old && (old.rid || old.pf))) ui.lastPag = $('t-k').value;
  save(); closeSheet(); render(); toast('Movimento salvato');
}
function delTx(id){
  const t = S.tx.find(x=>x.id===id);
  if(t.pf) return toast('Spesa con PagoFlex: annulla prima il PagoFlex nella sezione Carte');
  applyPag(t, -1); // restituisce l'importo al conto
  S.tx=S.tx.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Eliminato');
}

/* ---- CSV ---- */
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/,'');
  const first = txt.split(/\r?\n/)[0]||'';
  const del = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===del){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
const csvNum = v => { if(v==null||String(v).trim()==='') return null; let x=String(v).replace(/[€\s]/g,''); if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.'); const n=parseFloat(x); return isNaN(n)?null:n; };
function csvDate(v){
  v=String(v||'').trim(); let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function importCSV(f){
  if(!f) return;
  const kind=$('csv-k').value, rep=$('csv-rep').checked;
  const r=new FileReader();
  r.onload=()=>{
    let rows=parseCSV(r.result), skipped=0, out=[];
    if(rows.length && /[a-zA-Z]/.test(rows[0].join('')) && csvNum(rows[0][rows[0].length-1])===null) rows=rows.slice(1); // intestazione
    rows.forEach(c=>{
      if(kind==='mov'){
        const d=csvDate(c[0]), a=csvNum(c[4]); const t=/^e/i.test(c[1]||'')?'e':/^u/i.test(c[1]||'')?'u':null;
        if(!d||a==null||!t||!c[2]) return skipped++;
        out.push({id:uid(),d,t,cat:c[2],sub:c[3]||'',amt:Math.abs(a),note:c[5]||''});
      } else if(kind==='conti'){
        const v=csvNum(c[2]); if(!c[1]||v==null) return skipped++;
        out.push({id:uid(),g:c[0]||'Banche',n:c[1],v});
      } else if(kind==='rate'){
        const rt=csvNum(c[2]), rs=csvNum(c[3]); if(rt==null||rs==null) return skipped++;
        const ct = c[5] ? S.conti.find(x=>x.n.toLowerCase()===c[5].toLowerCase()) : null;
        out.push({id:uid(), tipo:c[0]||'PayPal', prod:c[1]==='-'?'':(c[1]||''), acq:null, tot:round2(rt*rs), n:rs, rata:rt, pre:0, done:0, first:csvDate(c[4]), fi:0, conto:ct?ct.id:''});
      } else if(kind==='inv'){
        if(!c[0]) return skipped++;
        out.push({n:c[0],lvl:parseInt(c[1])||0,inv:csvNum(c[2]),eff:csvNum(c[3])});
      } else {
        const d=csvDate(c[0]), v=csvNum(c[1]); if(!d||v==null) return skipped++;
        out.push({id:uid(),d,v});
      }
    });
    const key = {mov:'tx',conti:'conti',rate:'rate',inv:'inv',trading:'trading'}[kind];
    S[key] = rep ? out : S[key].concat(out);
    if(key==='rate') payDueRate();
    save(); closeSheet(); render();
    toast(`Importati ${out.length}${skipped?` · ${skipped} righe saltate`:''}`);
  };
  r.readAsText(f);
}
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='bilancio-backup.json'; a.click(); }
function importJSON(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tx) throw 0; S={...buildSeed(), ...d}; afterLoad(); save(); closeSheet(); render(); toast('Backup importato'); }catch(e){ toast('File non valido'); } }; r.readAsText(f); }

const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="#04130c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg>';

function gate(st, info=''){

      <button class="btn ghost" style="margin-top:8px" onclick="resetPw()">Password dimenticata?</button>`,

      <p class="mono" style="word-break:break-all;margin:0 0 4px">${esc(u?u.uid:'')}</p>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(cloud.user.uid).then(()=>toast('UID copiato'))">Copia UID</button>
      <button class="btn" style="margin-top:8px" onclick="onUser(cloud.user)">Riprova</button>${exit}`,
    setup: `${who}<p class="note">Scegli una passphrase: cifra i dati nel browser prima di salvarli. <b class="neg">Se la perdi i dati non si recuperano</b>, nemmeno da Firebase.</p>
      <form onsubmit="event.preventDefault();setupVault()">${user}
        <input type="password" id="g-p" autocomplete="new-password" placeholder="Passphrase (min. 8 caratteri)">
        <input type="password" id="g-p2" autocomplete="new-password" placeholder="Ripeti passphrase" style="margin-top:8px">
        ${rem}<button class="btn" id="g-b">Crea cassaforte</button></form>${exit}`,
    unlock: `${who}${info?`<p class="note">${esc(info)}</p>`:''}
      <form onsubmit="event.preventDefault();unlockVault()">${user}
        <input type="password" id="g-p" autocomplete="current-password" placeholder="Passphrase">
        ${rem}<button class="btn" id="g-b">Sblocca</button></form>${exit}`,
    error: `<p class="note neg">${esc(info)}</p><button class="btn" onclick="location.reload()">Riprova</button>${exit}`
  }[st];
  $('gate-box').innerHTML = `<div class="brand gate-brand"><i>${LOGO}</i>Bilancio</div>${body}<p class="note neg" id="g-err"></p>`;

function gateErr(m){ const e=$('g-err'); if(e) e.textContent=m; }
function gateBtn(busy, label){ const b=$('g-b'); if(b){ b.disabled=busy; b.textContent=label; } }
const authMsg = e => ({
  'auth/invalid-credential':'Email o password errate', 'auth/wrong-password':'Email o password errate',
  'auth/user-not-found':'Email o password errate', 'auth/invalid-email':'Email non valida',
  'auth/missing-password':'Inserisci la password', 'auth/too-many-requests':'Troppi tentativi: riprova tra qualche minuto',
  'auth/network-request-failed':'Nessuna connessione'
})[e.code] || 'Accesso non riuscito: '+(e.code||e.message);

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error(src)); document.head.appendChild(s); }); }
async function boot(){
  if(!CLOUD) return;
  gate('loading','Connessione…');
  try{ for(const f of ['app','auth','firestore']) await loadScript(`${FIREBASE_SDK}firebase-${f}-compat.js`); }
  catch(e){ return gate('error','Impossibile caricare Firebase. Controlla la connessione e riprova.'); }
  firebase.initializeApp(FIREBASE_CONFIG);
  cloud.db = firebase.firestore();
  try{ await cloud.db.enablePersistence({synchronizeTabs:true}); }catch(e){} // cache offline (cifrata come su server)
  firebase.auth().onAuthStateChanged(onUser);
}
// l'account si crea dalla console Firebase (Authentication → Utenti): l'app non ha la registrazione
async function login(){
  const e=$('g-e').value.trim(), p=$('g-pw').value;
  if(!e || !p) return gateErr('Inserisci email e password');
  gateBtn(true,'Accedo…');
  try{ await firebase.auth().signInWithEmailAndPassword(e, p); }
  catch(err){ gateBtn(false,'Accedi'); gateErr(authMsg(err)); }
}
async function resetPw(){
  const e=$('g-e').value.trim();
  if(!e) return gateErr('Scrivi la tua email, poi premi di nuovo');
  try{ await firebase.auth().sendPasswordResetEmail(e); gateErr(''); toast('Email per reimpostare la password inviata'); }
  catch(err){ gateErr(authMsg(err)); }
}
async function onUser(u){
  if(!u){ resetVault(); cloud.user=null; cloud.meta=null; return gate('login'); }
  if(cloud.user && cloud.user.uid===u.uid && cloud.key) return;
  cloud.user = u;
  gate('loading','Apro la cassaforte…');
  try{ const s = await cloud.ref().get(); cloud.meta = s.exists ? s.data() : null; }
  catch(e){ return e.code==='permission-denied' ? gate('denied') : gate('error','Non riesco a leggere i dati: '+(e.code||e.message)); }
  if(!cloud.meta) return gate('setup');
  const saved = await kdb.get(u.uid);
  if(saved && saved.salt===cloud.meta.salt && await keyOk(saved.key, cloud.meta)) return openVault(saved.key);
  gate('unlock');
}
function remember(key){ const r=$('g-r'); return kdb.set(cloud.user.uid, r&&r.checked ? {key, salt:cloud.meta.salt} : null); }
function newPass(p, p2){
  if(p.length<8){ return 'Almeno 8 caratteri'; }
  if(p!==p2){ return 'Le due passphrase non coincidono'; }
  return '';
}
async function setupVault(){
  const err = newPass($('g-p').value, $('g-p2').value); if(err) return gateErr(err);
  gateBtn(true,'Creo…');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey($('g-p').value,salt,KDF_ITER);
    const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
    const ref=cloud.ref();
    // mai sovrascrivere una cassaforte esistente: i dati cifrati con la vecchia chiave andrebbero persi
    await cloud.db.runTransaction(async t=>{ if((await t.get(ref)).exists) throw new Error('exists'); t.set(ref,{...meta, created:ts()}); });
    cloud.meta=meta;
    await remember(key);
    openVault(key);
  }catch(e){
    if(e.message==='exists') return onUser(cloud.user);
    gateBtn(false,'Crea cassaforte'); gateErr('Errore: '+(e.code||e.message));
  }
}
async function unlockVault(){
  const p=$('g-p').value; if(!p) return;
  gateBtn(true,'Verifico…');
  const key = await deriveKey(p, unb64(cloud.meta.salt), cloud.meta.iter);
  if(!await keyOk(key, cloud.meta)){ gateBtn(false,'Sblocca'); return gateErr('Passphrase errata'); }
  await remember(key);
  openVault(key);
}
async function openVault(key){
  cloud.key=key;
  gate('loading','Decifro i dati…');
  try{ S = await cloud.get(); }
  catch(e){ cloud.key=null; return gate('error','Impossibile leggere o decifrare i dati: '+(e.code||e.message||'chiave non valida')); }
  cloud.v = S;
  // primo accesso da un browser che aveva già dati in locale: li porto nel cloud e poi li tolgo da localStorage
  // (prima di afterLoad, che crea le carte predefinite e renderebbe il cloud "non vuoto")
  const loc = localStore.get();
  if(loc && SEZ.some(k=>(loc[k]||[]).length) && !SEZ.some(k=>(S[k]||[]).length)){
    S = {...buildSeed(), ...loc}; cloud.wipeLocal = true; save(); toast('Dati locali caricati nel cloud');
  }
  afterLoad();
  $('gate').classList.remove('on'); setSync(cloud.timer?'saving':'ok'); render();
}
function resetVault(){
  clearTimeout(cloud.timer); clearTimeout(cloud.rt);
  Object.assign(cloud, {key:null, v:null, last:{}, timer:null, again:false, retry:0});
  S=buildSeed(); setSync(null); closeSheet(); render();
}
async function lockVault(msg){
  if(!msg && cloud.dirty().length && !confirm('Ci sono modifiche non ancora salvate. Bloccare comunque?')) return;
  await kdb.set(cloud.user.uid, null);
  resetVault(); gate('unlock', msg||'');
}
async function logout(){
  if(cloud.dirty().length && !confirm('Ci sono modifiche non ancora salvate. Uscire comunque?')) return;
  if(cloud.user) await kdb.set(cloud.user.uid, null);
  resetVault();
  await firebase.auth().signOut();
}
// scrittura rifiutata: o le regole non ci fanno passare, o la passphrase è cambiata da un altro dispositivo
async function keyMismatch(){
  try{
    const m=(await cloud.ref().get({source:'server'})).data();
    if(m && m.salt!==cloud.meta.salt){ cloud.meta=m; return lockVault('La passphrase è stata cambiata da un altro dispositivo: inserisci quella nuova. Le ultime modifiche fatte qui non sono state salvate.'); }
  }catch(e){}
  setSync('err'); $('sync').title='Salvataggio rifiutato dalle regole Firestore: aggiornale e tocca qui per riprovare';
  toast('Salvataggio rifiutato: aggiorna le regole Firestore, poi tocca il puntino rosso');
}
function openPass(){
  sheet(`<h3>Cambia passphrase</h3>
    <p class="note">Tutti i dati vengono ricifrati con la nuova passphrase; quella vecchia smette di funzionare su tutti i dispositivi.</p>
    <div class="f"><label>Nuova passphrase</label><input type="password" id="p-1" autocomplete="new-password"></div>
    <div class="f"><label>Ripeti</label><input type="password" id="p-2" autocomplete="new-password"></div>
    <button class="btn" id="p-b" onclick="changePass()">Ricifra e salva</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
async function changePass(){
  const err = newPass($('p-1').value, $('p-2').value); if(err) return toast(err);
  if(!navigator.onLine) return toast('Serve la connessione');
  $('p-b').disabled=true; $('p-b').textContent='Ricifro…';
  try{ await cloud.rekey($('p-1').value); closeSheet(); setSync('ok'); toast('Passphrase cambiata'); }
  catch(e){ console.error(e); $('p-b').disabled=false; $('p-b').textContent='Ricifra e salva'; toast('Errore: '+(e.code||e.message)); }
}
document.addEventListener('visibilitychange', async ()=>{
  if(!CLOUD || !cloud.key) return;
  // app in background (iPhone): invia subito senza aspettare il timer
  if(document.visibilityState==='hidden'){ if(cloud.timer){ clearTimeout(cloud.timer); cloud.timer=null; cloud.flush(); } return; }
  // di nuovo in primo piano: ricarico se nel frattempo un altro dispositivo ha cambiato qualcosa
  if(cloud.busy || cloud.timer || cloud.dirty().length || $('ov').classList.contains('on')) return checkRate();
  try{
    const fresh = await cloud.get();
    if(cloud.busy || cloud.timer) return;
    if(SEZ.some(k=>JSON.stringify(fresh[k])!==JSON.stringify(S[k]))){ S=fresh; cloud.v=S; S.rate=S.rate.map(migrateRata); render(); }
  }catch(e){}
  checkRate();
});
window.addEventListener('beforeunload', e=>{ if(CLOUD && (cloud.timer || cloud.busy || cloud.dirty().length)){ e.preventDefault(); e.returnValue=''; } });

// app rimasta aperta: a ogni ritorno in primo piano e ogni ora controllo le rate in scadenza
function checkRate(){ if((!CLOUD || cloud.key) && S.carte && (payDueRate() + settleCards())) render(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !CLOUD) checkRate(); });
setInterval(checkRate, 60*60*1000);

if(!CLOUD) afterLoad();
showTab('home');
boot();
</script>
</body>
</html>
