<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bilancio — Finanze personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f0e; --panel:#121917; --panel2:#18211e; --line:#233029;
  --ink:#e8f1ec; --ink2:#9db0a6; --ink3:#62756b;
  --acc:#34d399; --acc-dim:rgba(52,211,153,.12);
  --neg:#fb7185; --warn:#fbbf24;
  --r:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + var(--sab))}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}

/* masthead */
.mast{position:sticky;top:0;z-index:20;background:rgba(11,15,14,.92);backdrop-filter:blur(12px);
  padding:calc(12px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--acc);display:grid;place-items:center}
.brand i svg{width:13px;height:13px}
.icon-btn{background:none;border:1px solid var(--line);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.period{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.yr{display:flex;align-items:center;gap:6px;font-weight:700}
.yr button{background:none;border:none;color:var(--ink2);font-size:18px;padding:2px 6px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink2);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04130c}

/* layout */
.view{display:none;padding:14px 16px}
.view.on{display:block}
h2.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{display:block;color:var(--ink3);font-size:11px;font-weight:600;margin-bottom:4px}
.kpi b{font-size:19px;font-weight:700}
.hero{background:linear-gradient(160deg,#143028,#0f1a17 60%);border-color:#1f4a3b}
.hero small{color:#7fcfae}
.hero b{font-size:30px;letter-spacing:-.02em}
.pos{color:var(--acc)} .neg{color:var(--neg)} .mut{color:var(--ink3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:13px}

/* bars list */
.bl{display:flex;flex-direction:column;gap:11px}
.bl-i .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bl-i .top span:first-child{font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar>div{height:100%;border-radius:9px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--ink3);font-weight:600}
.donut .c b{display:block;font-size:14px;color:var(--ink)}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* movimenti */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.u{color:var(--neg)} .seg button.on.e{color:var(--acc)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.search{margin:10px 0}
.day{font-size:11px;color:var(--ink3);font-weight:700;margin:16px 2px 6px;letter-spacing:.05em}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.tx .dot{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + var(--sab));width:54px;height:54px;border-radius:17px;border:none;background:var(--acc);color:#04130c;font-size:28px;font-weight:600;box-shadow:0 8px 24px rgba(52,211,153,.35);cursor:pointer;z-index:15;display:none}
.fab.on{display:block}

/* matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-height:68vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.mx th,.mx td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mx th{position:sticky;top:0;background:var(--panel2);color:var(--ink3);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;z-index:2}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;text-align:left;background:var(--panel);z-index:1;min-width:128px;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
.mx th:first-child{background:var(--panel2);z-index:3}
.mx tr.grp td{background:var(--panel2);font-weight:700}
.mx tr.grp td:first-child{background:var(--panel2)}
.mx tr.sub td:first-child{padding-left:20px;color:var(--ink2)}
.mx td.z{color:#33443b}
.mx tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.mx td.t{font-weight:700;background:var(--panel2)}

/* lists */
.acct{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.acct:last-child{border:none}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 6px}
.gh b{font-size:13px} .gh span{font-size:13px;color:var(--ink2)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--acc-dim);color:var(--acc)}
.btn{background:var(--acc);color:#04130c;border:none;border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:none;border:1px solid #4a2430;color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:12px;width:auto;border-radius:9px}
.rate{margin-bottom:8px}
.rate .row{margin-bottom:8px}
.inv-r{display:grid;grid-template-columns:1fr 62px 62px 52px;gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px}
.inv-r.h{color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.inv-r div:not(:first-child){text-align:right}
.l1{padding-left:12px;color:var(--ink2)} .l2{padding-left:24px;color:var(--ink3);font-size:11.5px}
/* panoramica: saldo quadrato + rate del mese */
.top2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sq{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.sq .io small{margin:6px 0 1px}
.sq .io b{font-size:19px}
.rc{aspect-ratio:1/1;display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer}
.rc>b{font-size:19px}
.rl{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.rl div{display:flex;justify-content:space-between;gap:6px}
.rc .rl b{display:inline;font-size:12px;font-weight:600;white-space:nowrap}
.rl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.rl .ok{color:var(--acc)}
.rc .note{margin-top:auto;padding-top:8px}
.legend .eu{font-size:11px;color:var(--ink2)}
.legend .pc{font-size:10.5px;color:var(--ink3);width:30px;text-align:right}
.pl-bars{display:flex;align-items:center;gap:3px;height:90px;margin-top:10px}
.pl-bars div{flex:1;border-radius:3px;min-height:2px}

/* bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  background:rgba(11,15,14,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:7px 6px calc(7px + var(--sab))}
nav button{flex:1;background:none;border:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:5px 0;cursor:pointer}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--acc)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#0f1513;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + var(--sab))}
.sheet h3{margin:0 0 14px;font-size:17px}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.amt{font-size:28px;font-weight:700;text-align:center;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:var(--acc);color:#04130c;padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--ink3);line-height:1.5}
.btn:disabled{opacity:.6}

/* accesso (email/password + passphrase) */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 70% at 50% 0%,#143028,var(--bg) 60%);display:none;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--sab))}
.gate.on{display:flex}
.gate-box{width:100%;max-width:340px;text-align:center}
.gate-brand{justify-content:center;font-size:24px;margin-bottom:14px}
.gate-brand i{width:30px;height:30px;border-radius:9px}
.gate-brand i svg{width:18px;height:18px}
.gate-box .note{margin:0 0 16px}
.gate-box #g-err{margin:12px 0 0}
.gate-box input{text-align:center}
.gate-box .btn{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--ink2)}
.chk input{width:auto}
.sync{width:8px;height:8px;border-radius:50%;display:none;cursor:pointer}
.sync.on{display:block} .sync.ok{background:var(--acc)} .sync.saving{background:var(--warn)} .sync.err{background:var(--neg)}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-top">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="#04130c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg></i><span id="mast-title">Bilancio</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="sync" id="sync" onclick="toast(this.title)"></span>
      <button class="icon-btn" onclick="openSettings()" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div id="period-bar">
    <div class="period">
      <div class="yr"><button onclick="setYear(-1)">‹</button><span id="yr-label" class="mono"></span><button onclick="setYear(1)">›</button></div>
      <span class="note" id="period-note"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-mov"></section>
  <section class="view" id="v-mx"></section>
  <section class="view" id="v-pat"></section>
  <section class="view" id="v-altro"></section>
</main>

<button class="fab" id="fab" onclick="openTx()" aria-label="Nuovo movimento">+</button>

<nav id="nav">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Panoramica</button>
  <button data-t="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movimenti</button>
  <button data-t="mx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Mensile</button>
  <button data-t="pat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Patrimonio</button>
  <button data-t="altro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Altro</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div class="gate-box" id="gate-box"></div></div>

<script>

/* ============ CONFIG FIREBASE ============
   Incolla la configurazione web del progetto (Console Firebase → Impostazioni progetto → Le tue app → Web).
   Con apiKey vuota l'app resta solo locale (localStorage). Questi valori non sono segreti:
   l'accesso ai dati lo decidono le regole Firestore (firestore.rules). */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCiItrJc1Waa0q07JPYdPqF0ke-pFLLufA',
  authDomain: 'contabilit-1a500.firebaseapp.com',
  projectId: 'contabilit-1a500',
  appId: '1:771839838672:web:9943e49e505942b400d1d5'
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const CLOUD = !!FIREBASE_CONFIG.apiKey;

/* ============ CIFRATURA ============
   AES-GCM 256 con chiave derivata dalla passphrase (PBKDF2-SHA256).
   Su Firestore arrivano solo iv + testo cifrato: senza passphrase i dati non si leggono. */
const KDF_ITER = 600000;
const CHECK = 'bilancio-ok';
const ENC = new TextEncoder(), DEC = new TextDecoder();
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', ENC.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
// aad lega ogni blocco cifrato alla sua sezione (tx, conti…): non si può scambiarlo con un altro
async function encrypt(key, txt, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:ENC.encode(aad)}, key, ENC.encode(txt));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decrypt(key, o, aad){
  return DEC.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv), additionalData:ENC.encode(aad)}, key, unb64(o.ct)));
}
async function keyOk(key, meta){ try{ return await decrypt(key, meta.check, 'check') === CHECK; }catch(e){ return false; } }

// "Ricorda su questo dispositivo": la chiave (non esportabile) resta in IndexedDB, mai la passphrase
const kdb = {
  open(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('bilancio-keys',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); },
  async get(id){ try{ const db=await this.open(); return await new Promise(ok=>{ const q=db.transaction('k').objectStore('k').get(id); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } },
  async set(id,v){ try{ const db=await this.open(); await new Promise(ok=>{ const t=db.transaction('k','readwrite'), s=t.objectStore('k'); v==null?s.delete(id):s.put(v,id); t.oncomplete=t.onerror=()=>ok(); }); }catch(e){} }
};

/* ============ STORAGE ============
   store.get / store.set: senza Firebase localStorage (come prima); con Firebase
   Firestore in bilancio/{uid}/sez/{tx|conti|rate|inv|trading}, ogni sezione cifrata.
   Salvataggio ottimistico: lo stato in memoria cambia subito, l'invio parte dopo 400 ms
   e solo per le sezioni modificate, con nuovi tentativi se la rete manca. */
const KEY = 'bilancio:v1';
const SEZ = ['tx','conti','rate','inv','trading'];
const localStore = {
  get(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
const ts = () => firebase.firestore.FieldValue.serverTimestamp();
const cloud = {
  db:null, user:null, meta:null, key:null, v:null, last:{}, timer:null, rt:null, busy:false, again:false, retry:0, wipeLocal:false,
  ref(){ return this.db.collection('bilancio').doc(this.user.uid); },
  async get(){
    const col = this.ref().collection('sez');
    const snap = await col.get({source:'server'}).catch(()=>col.get());
    const out = buildSeed();
    for(const d of snap.docs) if(SEZ.includes(d.id)) out[d.id] = JSON.parse(await decrypt(this.key, d.data(), d.id));
    SEZ.forEach(k=>this.last[k]=JSON.stringify(out[k]));
    return out;
  },
  set(v){ this.v=v; clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.timer=null; this.flush(); },400); setSync('saving'); },
  dirty(){ return this.key && this.v ? SEZ.map(k=>[k,JSON.stringify(this.v[k])]).filter(([k,j])=>j!==this.last[k]) : []; },
  async flush(){
    if(this.busy){ this.again=true; return; }
    if(!this.key) return;
    this.busy=true; this.again=false;
    let ok=true;
    try{
      const dirty=this.dirty();
      if(dirty.length){
        setSync('saving');
        const b=this.db.batch(), kid=this.meta.salt;
        for(const [k,j] of dirty) b.set(this.ref().collection('sez').doc(k), {kid, ...await encrypt(this.key,j,k), updated:ts()});
        await b.commit();
        dirty.forEach(([k,j])=>this.last[k]=j);
      }
      this.retry=0;
      if(this.wipeLocal){ localStore.clear(); this.wipeLocal=false; }
    }catch(e){ ok=false; this.fail(e); }
    this.busy=false;
    if(this.again) return this.flush();
    if(ok && !this.timer && this.key) setSync('ok');
  },
  fail(e){
    console.error(e);
    if(e.code==='permission-denied') return keyMismatch();
    setSync('err');
    this.retry++; clearTimeout(this.rt);
    this.rt=setTimeout(()=>this.flush(), Math.min(60000, 2000*2**(this.retry-1)));
  },
  // nuova passphrase: nuovo sale, si ricifra tutto in un'unica scrittura atomica
  async rekey(pass){
    while(this.busy) await new Promise(r=>setTimeout(r,100));
    clearTimeout(this.timer); this.timer=null; this.busy=true;
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey(pass,salt,KDF_ITER);
      const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
      const b=this.db.batch(), last={};
      b.set(this.ref(), {...meta, updated:ts()}, {merge:true});
      for(const k of SEZ){ last[k]=JSON.stringify(S[k]); b.set(this.ref().collection('sez').doc(k), {kid:meta.salt, ...await encrypt(key,last[k],k), updated:ts()}); }
      await b.commit();
      const kept = await kdb.get(this.user.uid);
      Object.assign(this, {key, meta, last, v:S});
      if(kept) await kdb.set(this.user.uid, {key, salt:meta.salt});
    }finally{ this.busy=false; if(this.again) this.flush(); }
  }
};

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Panoramica ---- */
function donut(data){
  const tot = sum(data.map(d=>d[1])) || 1; const R=48, C=2*Math.PI*R; let off=0;
  const arcs = data.map(([k,v],i)=>{ const len=v/tot*C; const s=`<circle cx="64" cy="64" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off+=len; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" fill="none" stroke="#18211e" stroke-width="16"/>${arcs}</svg><div class="c"><div><b class="mono">${eur0(tot)}</b>uscite</div></div></div>`;
}

  const byCat = groupBy(U, t=>t.cat);
  const bySub = groupBy(U, t=>t.cat + (t.sub?' › '+t.sub:'')).slice(0,8);
  const yU = Array(12).fill(0), yE = Array(12).fill(0);
  S.tx.filter(t=>txYear(t)===ui.year).forEach(t=>{ (t.t==='u'?yU:yE)[txMonth(t)] += t.amt; });
  const mx = Math.max(1,...yU,...yE);
  const bars = M3.map((m,i)=>`<div style="flex:1;text-align:center;cursor:pointer" onclick="setMonth(${i})">
      <div style="display:flex;gap:2px;align-items:flex-end;height:90px;justify-content:center">

        <div style="width:6px;height:${yU[i]/mx*100}%;background:var(--neg);border-radius:3px;min-height:2px;opacity:${ui.month===i||ui.month==='all'?1:.35}"></div>
      </div><div style="font-size:9px;color:var(--ink3);margin-top:5px;font-weight:700">${m[0]}</div></div>`).join('');
  const maxSub = bySub[0]?bySub[0][1]:1;
  $('v-home').innerHTML = `
    <div class="top2">
      <div class="card hero kpi sq"><div><small>Saldo ${periodLabel().toLowerCase()}</small><b class="mono ${saldo<0?'neg':''}" style="font-size:24px">${eur0(saldo)}</b></div>
        <div class="io"><small>Entrate</small><b class="mono pos">${eur0(te)}</b><small>Uscite</small><b class="mono neg">${eur0(tu)}</b></div></div>

      <div class="card kpi" onclick="showTab('pat')"><small>Patrimonio</small><b class="mono">${eur0(patr)}</b></div>
    </div>
    <h2 class="sec">Uscite per categoria</h2>
    <div class="card">${byCat.length ? `<div class="donut-wrap">${donut(byCat)}<div class="legend">${byCat.map(([k,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(k)}</span><b class="mono eu">${Math.round(v).toLocaleString('it-IT')} €</b><b class="mono pc">${Math.round(v/(tu||1)*100)}%</b></div>`).join('')}</div></div>` : '<div class="empty">Nessuna uscita nel periodo</div>'}</div>
    <h2 class="sec">Entrate vs uscite · ${ui.year}</h2>
    <div class="card"><div style="display:flex;gap:2px">${bars}</div>
      <div class="note" style="margin-top:10px;display:flex;gap:14px"><span><b style="color:var(--acc)">●</b> Entrate</span><span><b style="color:var(--neg)">●</b> Uscite</span></div></div>
    <h2 class="sec">Voci che pesano di più</h2>
    <div class="card">${bySub.length ? `<div class="bl">${bySub.map(([k,v],i)=>`<div class="bl-i"><div class="top"><span>${esc(k)}</span><span class="mono">${eur0(v)}</span></div><div class="bar"><div style="width:${v/maxSub*100}%;background:${PAL[i%PAL.length]}"></div></div></div>`).join('')}</div>` : '<div class="empty">—</div>'}</div>`;

// rate da pagare nel mese corrente, raggruppate per metodo (PayPal, Klarna…)
function rateCard(){
  const list = rateMese();
  const by = new Map();
  list.forEach(r=>{ const k=r.tipo||'Altro'; const g=by.get(k)||{due:0,paid:0}; g[rataPagata(r)?'paid':'due']+=r.rata; by.set(k,g); });
  const groups = [...by.entries()].sort((a,b)=>(b[1].due-a[1].due) || (b[1].paid-a[1].paid)); // prima quelle da pagare
  const due = sum(list.filter(r=>!rataPagata(r)).map(r=>r.rata)), paid = sum(list.filter(rataPagata).map(r=>r.rata));
  const rows = paid ? 3 : 4, MAX = groups.length>rows ? rows-1 : rows; // righe che stanno nel quadrato
  const amt = v => v ? `<b class="mono">${eur(v)}</b>` : `<b class="ok">✓</b>`;
  const lines = groups.slice(0,MAX).map(([k,g])=>`<div><span>${esc(k)}</span>${amt(g.due)}</div>`).join('')
    + (groups.length>MAX ? `<div><span>+ altri ${groups.length-MAX}</span>${amt(sum(groups.slice(MAX).map(([k,g])=>g.due)))}</div>` : '');
  return `<div class="card kpi rc" onclick="ui.altro='rate';showTab('altro')"><small>Rate da pagare · ${M3[now.getMonth()]}</small>
    ${list.length ? `<b class="mono ${due?'neg':'pos'}">${due?eur(due):'Tutto pagato'}</b><div class="rl">${lines}</div>
      ${paid?`<div class="note">Già pagate ${eur(paid)}</div>`:''}` : `<div class="empty" style="padding:18px 0 0">Nessuna rata attiva</div>`}</div>`;
}

/* ---- Mensile (come la tabella Contabilità di Numbers) ---- */
function renderMx(){
  const tipo = ui.mxTipo;
  const tx = S.tx.filter(t=>t.t===tipo && txYear(t)===ui.year);
  const cats = new Map();
  tx.forEach(t=>{
    if(!cats.has(t.cat)) cats.set(t.cat,{m:Array(12).fill(0),subs:new Map()});
    const c = cats.get(t.cat); c.m[txMonth(t)]+=t.amt;
    const sk = t.sub||'—';
    if(!c.subs.has(sk)) c.subs.set(sk,Array(12).fill(0));
    c.subs.get(sk)[txMonth(t)]+=t.amt;
  });
  const order = [...cats.entries()].sort((a,b)=>sum(b[1].m)-sum(a[1].m));
  const cell = v => v ? `<td class="mono">${v.toLocaleString('it-IT',{maximumFractionDigits:0})}</td>` : `<td class="z mono">·</td>`;
  const tot = Array(12).fill(0); order.forEach(([k,c])=>c.m.forEach((v,i)=>tot[i]+=v));
  let rows='';
  order.forEach(([k,c])=>{
    rows+=`<tr class="grp"><td>${esc(k)}</td>${c.m.map(cell).join('')}<td class="mono t">${sum(c.m).toLocaleString('it-IT',{maximumFractionDigits:0})}</td></tr>`;
    if(c.subs.size>1 || ![...c.subs.keys()].includes('—'))
      [...c.subs.entries()].sort((a,b)=>sum(b[1])-sum(a[1])).forEach(([s,m])=>{
        rows+=`<tr class="sub"><td>${esc(s)}</td>${m.map(cell).join('')}<td class="mono t">${sum(m).toLocaleString('it-IT',{maximumFractionDigits:0})}</td></tr>`;

  $('v-mx').innerHTML = `

    </div>
    <div class="mx-wrap"><table class="mx">
      <tr><th>${tipo==='u'?'Uscite':'Entrate'} ${ui.year}</th>${M3.map(m=>`<th>${m}</th>`).join('')}<th>Totale</th></tr>
      <tr class="tot"><td>Totale mese</td>${tot.map(cell).join('')}<td class="mono t">${sum(tot).toLocaleString('it-IT',{maximumFractionDigits:0})}</td></tr>
      ${rows || '<tr><td colspan="14" class="empty">Nessun dato per questo anno</td></tr>'}
    </table></div>
    <p class="note" style="margin-top:12px">Stessa logica del tuo foglio: macro-categoria, sottovoci e mesi in colonna. Scorri a destra per vedere tutti i mesi.</p>`;

/* ---- CSV ---- */
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/,'');
  const first = txt.split(/\r?\n/)[0]||'';
  const del = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===del){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
const csvNum = v => { if(v==null||String(v).trim()==='') return null; let x=String(v).replace(/[€\s]/g,''); if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.'); const n=parseFloat(x); return isNaN(n)?null:n; };
function csvDate(v){
  v=String(v||'').trim(); let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function importCSV(f){
  if(!f) return;
  const kind=$('csv-k').value, rep=$('csv-rep').checked;
  const r=new FileReader();
  r.onload=()=>{
    let rows=parseCSV(r.result), skipped=0, out=[];
    if(rows.length && /[a-zA-Z]/.test(rows[0].join('')) && csvNum(rows[0][rows[0].length-1])===null) rows=rows.slice(1); // intestazione
    rows.forEach(c=>{
      if(kind==='mov'){
        const d=csvDate(c[0]), a=csvNum(c[4]); const t=/^e/i.test(c[1]||'')?'e':/^u/i.test(c[1]||'')?'u':null;
        if(!d||a==null||!t||!c[2]) return skipped++;
        out.push({id:uid(),d,t,cat:c[2],sub:c[3]||'',amt:Math.abs(a),note:c[5]||''});
      } else if(kind==='conti'){
        const v=csvNum(c[2]); if(!c[1]||v==null) return skipped++;
        out.push({id:uid(),g:c[0]||'Banche',n:c[1],v});
      } else if(kind==='rate'){
        const rt=csvNum(c[2]), rs=csvNum(c[3]); if(rt==null||rs==null) return skipped++;
        out.push({id:uid(),tipo:c[0]||'PayPal',prod:c[1]||'',rata:rt,res:rs});
      } else if(kind==='inv'){
        if(!c[0]) return skipped++;
        out.push({n:c[0],lvl:parseInt(c[1])||0,inv:csvNum(c[2]),eff:csvNum(c[3])});
      } else {
        const d=csvDate(c[0]), v=csvNum(c[1]); if(!d||v==null) return skipped++;
        out.push({id:uid(),d,v});
      }
    });
    const key = {mov:'tx',conti:'conti',rate:'rate',inv:'inv',trading:'trading'}[kind];
    S[key] = rep ? out : S[key].concat(out);
    save(); closeSheet(); render();
    toast(`Importati ${out.length}${skipped?` · ${skipped} righe saltate`:''}`);
  };
  r.readAsText(f);
}
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='bilancio-backup.json'; a.click(); }
function importJSON(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tx) throw 0; S={...buildSeed(), ...d}; save(); closeSheet(); render(); toast('Backup importato'); }catch(e){ toast('File non valido'); } }; r.readAsText(f); }

const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="#04130c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg>';

      <p class="mono" style="word-break:break-all;margin:0 0 4px">${esc(u?u.uid:'')}</p>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(cloud.user.uid).then(()=>toast('UID copiato'))">Copia UID</button>
      <button class="btn" style="margin-top:8px" onclick="onUser(cloud.user)">Riprova</button>${exit}`,
    setup: `${who}<p class="note">Scegli una passphrase: cifra i dati nel browser prima di salvarli. <b class="neg">Se la perdi i dati non si recuperano</b>, nemmeno da Firebase.</p>
      <form onsubmit="event.preventDefault();setupVault()">${user}

        <input type="password" id="g-p2" autocomplete="new-password" placeholder="Ripeti passphrase" style="margin-top:8px">
        ${rem}<button class="btn" id="g-b">Crea cassaforte</button></form>${exit}`,
    unlock: `${who}${info?`<p class="note">${esc(info)}</p>`:''}
      <form onsubmit="event.preventDefault();unlockVault()">${user}
        <input type="password" id="g-p" autocomplete="current-password" placeholder="Passphrase">
        ${rem}<button class="btn" id="g-b">Sblocca</button></form>${exit}`,
    error: `<p class="note neg">${esc(info)}</p><button class="btn" onclick="location.reload()">Riprova</button>${exit}`
  }[st];
  $('gate-box').innerHTML = `<div class="brand gate-brand"><i>${LOGO}</i>Bilancio</div>${body}<p class="note neg" id="g-err"></p>`;

function gateErr(m){ const e=$('g-err'); if(e) e.textContent=m; }
function gateBtn(busy, label){ const b=$('g-b'); if(b){ b.disabled=busy; b.textContent=label; } }
const authMsg = e => ({
  'auth/invalid-credential':'Email o password errate', 'auth/wrong-password':'Email o password errate',
  'auth/user-not-found':'Email o password errate', 'auth/invalid-email':'Email non valida',
  'auth/missing-password':'Inserisci la password', 'auth/too-many-requests':'Troppi tentativi: riprova tra qualche minuto',
  'auth/network-request-failed':'Nessuna connessione'
})[e.code] || 'Accesso non riuscito: '+(e.code||e.message);

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error(src)); document.head.appendChild(s); }); }
async function boot(){
  if(!CLOUD) return;
  gate('loading','Connessione…');
  try{ for(const f of ['app','auth','firestore']) await loadScript(`${FIREBASE_SDK}firebase-${f}-compat.js`); }
  catch(e){ return gate('error','Impossibile caricare Firebase. Controlla la connessione e riprova.'); }
  firebase.initializeApp(FIREBASE_CONFIG);
  cloud.db = firebase.firestore();
  try{ await cloud.db.enablePersistence({synchronizeTabs:true}); }catch(e){} // cache offline (cifrata come su server)
  firebase.auth().onAuthStateChanged(onUser);
}
// l'account si crea dalla console Firebase (Authentication → Utenti): l'app non ha la registrazione
async function login(){
  const e=$('g-e').value.trim(), p=$('g-pw').value;
  if(!e || !p) return gateErr('Inserisci email e password');
  gateBtn(true,'Accedo…');
  try{ await firebase.auth().signInWithEmailAndPassword(e, p); }
  catch(err){ gateBtn(false,'Accedi'); gateErr(authMsg(err)); }
}
async function resetPw(){
  const e=$('g-e').value.trim();
  if(!e) return gateErr('Scrivi la tua email, poi premi di nuovo');
  try{ await firebase.auth().sendPasswordResetEmail(e); gateErr(''); toast('Email per reimpostare la password inviata'); }
  catch(err){ gateErr(authMsg(err)); }
}
async function onUser(u){
  if(!u){ resetVault(); cloud.user=null; cloud.meta=null; return gate('login'); }
  if(cloud.user && cloud.user.uid===u.uid && cloud.key) return;
  cloud.user = u;
  gate('loading','Apro la cassaforte…');
  try{ const s = await cloud.ref().get(); cloud.meta = s.exists ? s.data() : null; }
  catch(e){ return e.code==='permission-denied' ? gate('denied') : gate('error','Non riesco a leggere i dati: '+(e.code||e.message)); }
  if(!cloud.meta) return gate('setup');
  const saved = await kdb.get(u.uid);
  if(saved && saved.salt===cloud.meta.salt && await keyOk(saved.key, cloud.meta)) return openVault(saved.key);
  gate('unlock');
}
function remember(key){ const r=$('g-r'); return kdb.set(cloud.user.uid, r&&r.checked ? {key, salt:cloud.meta.salt} : null); }
function newPass(p, p2){
  if(p.length<8){ return 'Almeno 8 caratteri'; }
  if(p!==p2){ return 'Le due passphrase non coincidono'; }
  return '';
}
async function setupVault(){
  const err = newPass($('g-p').value, $('g-p2').value); if(err) return gateErr(err);
  gateBtn(true,'Creo…');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey($('g-p').value,salt,KDF_ITER);
    const meta={v:1, salt:b64(salt), iter:KDF_ITER, check:await encrypt(key,CHECK,'check')};
    const ref=cloud.ref();
    // mai sovrascrivere una cassaforte esistente: i dati cifrati con la vecchia chiave andrebbero persi
    await cloud.db.runTransaction(async t=>{ if((await t.get(ref)).exists) throw new Error('exists'); t.set(ref,{...meta, created:ts()}); });
    cloud.meta=meta;
    await remember(key);
    openVault(key);
  }catch(e){
    if(e.message==='exists') return onUser(cloud.user);
    gateBtn(false,'Crea cassaforte'); gateErr('Errore: '+(e.code||e.message));
  }
}
async function unlockVault(){
  const p=$('g-p').value; if(!p) return;
  gateBtn(true,'Verifico…');
  const key = await deriveKey(p, unb64(cloud.meta.salt), cloud.meta.iter);
  if(!await keyOk(key, cloud.meta)){ gateBtn(false,'Sblocca'); return gateErr('Passphrase errata'); }
  await remember(key);
  openVault(key);
}
async function openVault(key){
  cloud.key=key;
  gate('loading','Decifro i dati…');
  try{ S = await cloud.get(); }
  catch(e){ cloud.key=null; return gate('error','Impossibile leggere o decifrare i dati: '+(e.code||e.message||'chiave non valida')); }
  cloud.v = S;
  // primo accesso da un browser che aveva già dati in locale: li porto nel cloud e poi li tolgo da localStorage
  const loc = localStore.get();
  if(loc && SEZ.some(k=>(loc[k]||[]).length) && !SEZ.some(k=>S[k].length)){
    S = {...buildSeed(), ...loc}; cloud.wipeLocal = true; save(); toast('Dati locali caricati nel cloud');
  }
  $('gate').classList.remove('on'); setSync(cloud.timer?'saving':'ok'); render();
}
function resetVault(){
  clearTimeout(cloud.timer); clearTimeout(cloud.rt);
  Object.assign(cloud, {key:null, v:null, last:{}, timer:null, again:false, retry:0});
  S=buildSeed(); setSync(null); closeSheet(); render();
}
async function lockVault(msg){
  if(!msg && cloud.dirty().length && !confirm('Ci sono modifiche non ancora salvate. Bloccare comunque?')) return;
  await kdb.set(cloud.user.uid, null);
  resetVault(); gate('unlock', msg||'');
}
async function logout(){
  if(cloud.dirty().length && !confirm('Ci sono modifiche non ancora salvate. Uscire comunque?')) return;
  if(cloud.user) await kdb.set(cloud.user.uid, null);
  resetVault();
  await firebase.auth().signOut();
}
// scrittura rifiutata: o le regole non ci fanno passare, o la passphrase è cambiata da un altro dispositivo
async function keyMismatch(){
  try{
    const m=(await cloud.ref().get({source:'server'})).data();
    if(m && m.salt!==cloud.meta.salt){ cloud.meta=m; return lockVault('La passphrase è stata cambiata da un altro dispositivo: inserisci quella nuova. Le ultime modifiche fatte qui non sono state salvate.'); }
  }catch(e){}
  setSync('err'); toast('Salvataggio rifiutato: controlla le regole Firestore');
}
function openPass(){
  sheet(`<h3>Cambia passphrase</h3>
    <p class="note">Tutti i dati vengono ricifrati con la nuova passphrase; quella vecchia smette di funzionare su tutti i dispositivi.</p>
    <div class="f"><label>Nuova passphrase</label><input type="password" id="p-1" autocomplete="new-password"></div>
    <div class="f"><label>Ripeti</label><input type="password" id="p-2" autocomplete="new-password"></div>
    <button class="btn" id="p-b" onclick="changePass()">Ricifra e salva</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Annulla</button>`);
}
async function changePass(){
  const err = newPass($('p-1').value, $('p-2').value); if(err) return toast(err);
  if(!navigator.onLine) return toast('Serve la connessione');
  $('p-b').disabled=true; $('p-b').textContent='Ricifro…';
  try{ await cloud.rekey($('p-1').value); closeSheet(); setSync('ok'); toast('Passphrase cambiata'); }
  catch(e){ console.error(e); $('p-b').disabled=false; $('p-b').textContent='Ricifra e salva'; toast('Errore: '+(e.code||e.message)); }
}
document.addEventListener('visibilitychange', async ()=>{
  if(!CLOUD || !cloud.key) return;
  // app in background (iPhone): invia subito senza aspettare il timer
  if(document.visibilityState==='hidden'){ if(cloud.timer){ clearTimeout(cloud.timer); cloud.timer=null; cloud.flush(); } return; }
  // di nuovo in primo piano: ricarico se nel frattempo un altro dispositivo ha cambiato qualcosa
  if(cloud.busy || cloud.timer || cloud.dirty().length || $('ov').classList.contains('on')) return;
  try{
    const fresh = await cloud.get();
    if(cloud.busy || cloud.timer) return;
    if(SEZ.some(k=>JSON.stringify(fresh[k])!==JSON.stringify(S[k]))){ S=fresh; cloud.v=S; render(); }
  }catch(e){}
});
window.addEventListener('beforeunload', e=>{ if(CLOUD && (cloud.timer || cloud.busy || cloud.dirty().length)){ e.preventDefault(); e.returnValue=''; } });

showTab('home');
boot();
</script>
